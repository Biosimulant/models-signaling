schema_version: '2.0'
title: Sneyd2002_IP3_Receptor
description: This model was successfully tested on Jarnac and MathSBML. The model
  reproduces the time profile of 'Open Probability' of the receptor as shown in Figure
  4 of the publication.
standard: other
tags:
- signaling
- systems
- systems-biology
- sbml
- faithful
- biomodels_ebi
- gpcr
authors:
- Biosimulant Team
- James Sneyd
- Jean-Francois Dufour
upstream:
  id: biomodels_ebi:BIOMD0000000057
  source_db: biomodels_ebi
  source_id: BIOMD0000000057
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/BIOMD0000000057
  download_url: https://www.ebi.ac.uk/biomodels/model/download/BIOMD0000000057?filename=BIOMD0000000057_url.xml
  license: CC0
biosim:
  entrypoint: src.sneyd2002_ip3_receptor:Sneyd2002Ip3ReceptorBiomd0000000057Model
  init_kwargs:
    model_path: data/BIOMD0000000057.xml
    integration_step: 0.01
  communication_step: 0.1
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
io:
  inputs:
  - name: initial_receptor
    maps_to: signaling_sbml_sneyd2002_ip3_receptor_biomd0000000057_model.initial_receptor
    label: Initial Receptor
    description: Initial level of Receptor. Maps to SBML symbol `R`; exposed as a
      traceable initial-condition perturbation.
  outputs:
  - name: receptor
    maps_to: signaling_sbml_sneyd2002_ip3_receptor_biomd0000000057_model.receptor
    label: Receptor
    description: Receptor. Maps to SBML symbol `R` and is emitted in native SBML units.
  - name: open_state
    maps_to: signaling_sbml_sneyd2002_ip3_receptor_biomd0000000057_model.open_state
    label: open State
    description: open State. Maps to SBML symbol `O` and is emitted in native SBML
      units.
  - name: inactivated_state_1
    maps_to: signaling_sbml_sneyd2002_ip3_receptor_biomd0000000057_model.inactivated_state_1
    label: Inactivated State 1
    description: Inactivated State 1. Maps to SBML symbol `I1` and is emitted in native
      SBML units.
  - name: state
    maps_to: signaling_sbml_sneyd2002_ip3_receptor_biomd0000000057_model.state
    label: Observable state
  - name: summary
    maps_to: signaling_sbml_sneyd2002_ip3_receptor_biomd0000000057_model.summary
    label: Simulation summary
  - name: species_labels
    maps_to: signaling_sbml_sneyd2002_ip3_receptor_biomd0000000057_model.species_labels
    label: Observable labels
