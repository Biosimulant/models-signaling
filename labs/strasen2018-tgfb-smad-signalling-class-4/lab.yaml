  - name: active_tgf_beta_tgfr1_tgfr2_endo
    maps_to: signaling_sbml_strasen2018_tgfb_smad_signalling_class_4_biomd0000001001_model.active_tgf_beta_tgfr1_tgfr2_endo
    label: active TGF-beta TGFR1 TGFR2 Endo
    description: active TGF-beta TGFR1 TGFR2 Endo. Maps to SBML symbol `Active_Rec_endo`
      and is emitted in native SBML units.
  - name: state
    maps_to: signaling_sbml_strasen2018_tgfb_smad_signalling_class_4_biomd0000001001_model.state
    label: Observable state
  - name: summary
    maps_to: signaling_sbml_strasen2018_tgfb_smad_signalling_class_4_biomd0000001001_model.summary
