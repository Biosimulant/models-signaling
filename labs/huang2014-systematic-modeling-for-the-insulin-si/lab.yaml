schema_version: '2.0'
title: Huang2014 - Systematic modeling for the insulin signaling network mediated
  by IRS1 and IRS2 Lab
description: Clean Biosimulant lab for metabolic and hormone-linked signaling. Values
  are native SBML quantities; equations, parameters, and initial values remain in
  the bundled source file.
models:
- alias: signaling_sbml_huang2014_systematic_modeling_for_the_insulin_si_model1912090001_model
  path: models/core
- alias: visualisation
  path: models/visualisation
wiring:
- from: signaling_sbml_huang2014_systematic_modeling_for_the_insulin_si_model1912090001_model.state
  to:
  - visualisation.signaling_sbml_huang2014_systematic_modeling_for_the_insulin_si_model1912090001_model_state
- from: signaling_sbml_huang2014_systematic_modeling_for_the_insulin_si_model1912090001_model.summary
  to:
  - visualisation.signaling_sbml_huang2014_systematic_modeling_for_the_insulin_si_model1912090001_model_summary
- from: signaling_sbml_huang2014_systematic_modeling_for_the_insulin_si_model1912090001_model.species_labels
  to:
  - visualisation.signaling_sbml_huang2014_systematic_modeling_for_the_insulin_si_model1912090001_model_species_labels
runtime:
  duration: 1.0
  communication_step: 0.1
  initial_inputs: {}
tags:
- signaling
- systems
- systems-biology
- sbml
- faithful
- biomodels_ebi
- gpcr
- metabolic-signaling
- hormone-signaling
io:
  inputs:
  - name: initial_x1_insulin
    maps_to: signaling_sbml_huang2014_systematic_modeling_for_the_insulin_si_model1912090001_model.initial_x1_insulin
    label: Initial X1 Insulin
    description: Initial level of X1 Insulin. Maps to SBML symbol `x1_Insulin`; exposed
      as a traceable initial-condition perturbation.
  outputs:
  - name: x2_receptor
    maps_to: signaling_sbml_huang2014_systematic_modeling_for_the_insulin_si_model1912090001_model.x2_receptor
    label: X2 Receptor
    description: X2 Receptor. Maps to SBML symbol `x2_Receptor` and is emitted in
      native SBML units.
  - name: x6_en_receptor
    maps_to: signaling_sbml_huang2014_systematic_modeling_for_the_insulin_si_model1912090001_model.x6_en_receptor
    label: X6 EN Receptor
    description: X6 EN Receptor. Maps to SBML symbol `x6_EN_Receptor` and is emitted
      in native SBML units.
  - name: x16_akt
    maps_to: signaling_sbml_huang2014_systematic_modeling_for_the_insulin_si_model1912090001_model.x16_akt
    label: X16 AKT
    description: X16 AKT. Maps to SBML symbol `x16_AKT` and is emitted in native SBML
      units.
  - name: state
    maps_to: signaling_sbml_huang2014_systematic_modeling_for_the_insulin_si_model1912090001_model.state
    label: Observable state
  - name: summary
    maps_to: signaling_sbml_huang2014_systematic_modeling_for_the_insulin_si_model1912090001_model.summary
    label: Simulation summary
  - name: species_labels
    maps_to: signaling_sbml_huang2014_systematic_modeling_for_the_insulin_si_model1912090001_model.species_labels
    label: Observable labels
