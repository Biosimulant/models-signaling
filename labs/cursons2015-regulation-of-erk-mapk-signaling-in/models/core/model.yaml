schema_version: '2.0'
title: Cursons2015 - Regulation of ERK-MAPK signaling in human epidermis
description: Cursons2015 - Regulation of ERK-MAPKsignaling in human epidermis Model
  comparing the abundance ofphosphorylated MAPK signalling proteins and calcium signalling
  inthe epidermis. It can be used to explore signaling dynamics and compare pathway
  response across conditions.
