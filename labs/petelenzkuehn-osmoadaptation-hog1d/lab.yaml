- from: signaling_sbml_petelenzkuehn_osmoadaptation_hog1d_biomd0000000606_model.summary
  to:
  - visualisation.signaling_sbml_petelenzkuehn_osmoadaptation_hog1d_biomd0000000606_model_summary
- from: signaling_sbml_petelenzkuehn_osmoadaptation_hog1d_biomd0000000606_model.species_labels
  to:
  - visualisation.signaling_sbml_petelenzkuehn_osmoadaptation_hog1d_biomd0000000606_model_species_labels
runtime:
  duration: 1.0
  communication_step: 0.1
  initial_inputs: {}
tags:
- signaling
- systems
- systems-biology
- sbml
- faithful
- biomodels_ebi
- stress-response
io:
