schema_version: '2.0'
title: Kok2020 - IFNalpha-induced signaling in Huh7.5 cells
description: The proposed ODE model describes dynamics of IFNalpha-induced signaling
  in Huh7.5 cells for a time scale up to 32 hours after stimulation with IFNalpha.
  The model consists of an IFN receptor model, fo.
