  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/BIOMD0000000600
  download_url: https://www.ebi.ac.uk/biomodels/model/download/BIOMD0000000600?filename=BIOMD0000000600_url.xml
  license: CC0
biosim:
