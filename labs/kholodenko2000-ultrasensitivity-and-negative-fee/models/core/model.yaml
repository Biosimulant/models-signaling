description: Kholodenko2000 - Ultrasensitivity and negative feedback bring oscillations
  in MAPK cascade The combination of ultrasensitivity and negative feedback bring
  sustained oscillations in the mitogen-activat. It can be used to explore signaling
  dynamics and compare pathway response across conditions.
