schema_version: '2.0'
title: Kawka2014 - Revealing the role of SGK1 in the dynamics of medulloblastoma using
  a mathematical model
description: This is a mathematical model of the Wnt signaling pathway in medulloblastoma
  comprised of two compartments. Composed of nine ordinary differential equations
  accounts for the formation and dissociation.
standard: other
tags:
- signaling
- systems
- systems-biology
- sbml
