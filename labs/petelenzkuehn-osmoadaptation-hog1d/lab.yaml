  - name: initial_glucose_i
    maps_to: signaling_sbml_petelenzkuehn_osmoadaptation_hog1d_biomd0000000606_model.initial_glucose_i
    label: Initial Glucose I
    description: Initial level of Glucose I. Maps to SBML symbol `glucose_i`; exposed
      as a traceable initial-condition perturbation.
  outputs:
  - name: glycerol_i
    maps_to: signaling_sbml_petelenzkuehn_osmoadaptation_hog1d_biomd0000000606_model.glycerol_i
    label: Glycerol I
    description: Glycerol I. Maps to SBML symbol `glycerol_i` and is emitted in native
