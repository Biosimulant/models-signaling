  - visualisation.signaling_sbml_lee2008_erk_and_pi3k_signal_integration_by_myc_biomd0000000818_model_summary
- from: signaling_sbml_lee2008_erk_and_pi3k_signal_integration_by_myc_biomd0000000818_model.species_labels
  to:
  - visualisation.signaling_sbml_lee2008_erk_and_pi3k_signal_integration_by_myc_biomd0000000818_model_species_labels
runtime:
