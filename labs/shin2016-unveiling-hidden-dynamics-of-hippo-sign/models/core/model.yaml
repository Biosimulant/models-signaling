schema_version: '2.0'
title: Shin2016 - Unveiling Hidden Dynamics of Hippo Signalling
description: This is a mathematical model describing Hippo signalling pathway activity.
  It includes descriptions of crosstalk with the Akt and ERK MAPK pathways; crosstalk
  activity is described using complex regul.
