schema_version: '2.0'
title: Keizer1996_Ryanodine_receptor_adaptation
description: The model reproduces the time profile of Open probability of the ryanodine
  receptor as shown in Fig 2A and 2B of the paper. The model was successfully tested
  on MathSBML and Jarnac.
standard: other
tags:
- signaling
- systems
- systems-biology
- sbml
- faithful
- biomodels_ebi
- gpcr
authors:
- Biosimulant Team
- J Keizer
- L Levine
upstream:
  id: biomodels_ebi:BIOMD0000000060
  source_db: biomodels_ebi
  source_id: BIOMD0000000060
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/BIOMD0000000060
  download_url: https://www.ebi.ac.uk/biomodels/model/download/BIOMD0000000060?filename=BIOMD0000000060_url.xml
  license: CC0
biosim:
  entrypoint: src.keizer1996_ryanodine_receptor_adaptation:Keizer1996RyanodineReceptorAdaptationBiomd0000000060Model
  init_kwargs:
    model_path: data/BIOMD0000000060.xml
    integration_step: 0.01
  communication_step: 0.1
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
io:
