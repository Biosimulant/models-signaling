title: Sarma2012 - Oscillations in MAPK cascade (S1n)
description: Sarma2012 - Oscillations in MAPK cascade (S1n) Two plausible designs
  (S1 and S2) of coupled positive and negative feedback loops of MAPK cascade has
  been described in this paper. It can be used to explore signaling dynamics and compare
  pathway response across conditions.
