schema_version: '2.0'
title: Thomson2009 – Unlimited multistability in multisite phosphorylation systems
description: This model describes a distributive, sequential system with n = 4, which
  is a simplified example of unlimited multistability in multisite phosphorylation
  systems. It can be used to explore signaling dynamics and compare pathway response
  across conditions.
