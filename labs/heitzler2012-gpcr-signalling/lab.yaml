schema_version: '2.0'
package: heitzler2012-gpcr-signalling
version: 1.0.0
title: Heitzler2012 - GPCR signalling Lab
description: 'Clean Biosimulant lab for systems signaling model: Heitzler2012 - GPCR
  signalling. Values are native SBML quantities; equations, parameters, and initial
  values remain in the bundled source file.'
models:
- alias: signaling_sbml_heitzler2012_gpcr_signalling_biomd0000000842_model
  path: models/core
- alias: visualisation
  path: models/visualisation
wiring:
- from: signaling_sbml_heitzler2012_gpcr_signalling_biomd0000000842_model.state
  to:
  - visualisation.signaling_sbml_heitzler2012_gpcr_signalling_biomd0000000842_model_state
- from: signaling_sbml_heitzler2012_gpcr_signalling_biomd0000000842_model.summary
  to:
  - visualisation.signaling_sbml_heitzler2012_gpcr_signalling_biomd0000000842_model_summary
- from: signaling_sbml_heitzler2012_gpcr_signalling_biomd0000000842_model.species_labels
  to:
  - visualisation.signaling_sbml_heitzler2012_gpcr_signalling_biomd0000000842_model_species_labels
runtime:
  duration: 1.0
  communication_step: 0.1
  initial_inputs: {}
tags:
- signaling
- systems
- systems-biology
- sbml
- faithful
- biomodels_ebi
- gpcr
io:
  inputs:
  - name: initial_perk_kinase
    maps_to: signaling_sbml_heitzler2012_gpcr_signalling_biomd0000000842_model.initial_perk_kinase
    label: Initial PERK kinase
    description: Initial level of PERK kinase. Maps to SBML symbol `pERK`; exposed
      as a traceable initial-condition perturbation.
  outputs:
  - name: erk
    maps_to: signaling_sbml_heitzler2012_gpcr_signalling_biomd0000000842_model.erk
    label: ERK
    description: ERK. Maps to SBML symbol `ERK` and is emitted in native SBML units.
  - name: gp_p_erk
    maps_to: signaling_sbml_heitzler2012_gpcr_signalling_biomd0000000842_model.gp_p_erk
    label: Gp P ERK
    description: Gp P ERK. Maps to SBML symbol `GpERK` and is emitted in native SBML
      units.
  - name: b_p_erk
    maps_to: signaling_sbml_heitzler2012_gpcr_signalling_biomd0000000842_model.b_p_erk
    label: B P ERK
    description: B P ERK. Maps to SBML symbol `bpERK` and is emitted in native SBML
      units.
  - name: state
    maps_to: signaling_sbml_heitzler2012_gpcr_signalling_biomd0000000842_model.state
    label: Observable state
  - name: summary
    maps_to: signaling_sbml_heitzler2012_gpcr_signalling_biomd0000000842_model.summary
    label: Simulation summary
  - name: species_labels
    maps_to: signaling_sbml_heitzler2012_gpcr_signalling_biomd0000000842_model.species_labels
    label: Observable labels
