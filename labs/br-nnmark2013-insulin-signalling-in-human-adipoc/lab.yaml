- from: signaling_sbml_br_nnmark2013_insulin_signalling_in_human_adipoc_biomd0000000448_model.summary
  to:
  - visualisation.signaling_sbml_br_nnmark2013_insulin_signalling_in_human_adipoc_biomd0000000448_model_summary
- from: signaling_sbml_br_nnmark2013_insulin_signalling_in_human_adipoc_biomd0000000448_model.species_labels
  to:
  - visualisation.signaling_sbml_br_nnmark2013_insulin_signalling_in_human_adipoc_biomd0000000448_model_species_labels
runtime:
