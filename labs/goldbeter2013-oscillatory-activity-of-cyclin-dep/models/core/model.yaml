schema_version: '2.0'
title: Goldbeter2013-Oscillatory activity of cyclin-dependent kinases in the cell
  cycle
description: A model for oscillations of Cdc2 kinase in embryonic cell cycles based
  on Michaelis–Menten phosphorylation–dephosphorylation kinetics shows that the occurrence
  and amplitude of the oscillations strong. It can be used to explore signaling dynamics
  and compare pathway response across conditions.
standard: other
tags:
- signaling
- systems
- systems-biology
- sbml
- faithful
- biomodels_ebi
- cell-cycle-signaling
authors:
- Biosimulant Team
- Albert Goldbeter
