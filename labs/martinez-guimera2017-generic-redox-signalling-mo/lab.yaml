  - name: source_defined_aox_state
    maps_to: signaling_sbml_martinez_guimera2017_generic_redox_signalling_mo_model1710260000_model.source_defined_aox_state
    label: source-defined AOX state
    description: source-defined AOX state. Maps to SBML symbol `AOX` and is emitted
      in native SBML units.
  - name: nil_source_state
    maps_to: signaling_sbml_martinez_guimera2017_generic_redox_signalling_mo_model1710260000_model.nil_source_state
    label: nil source state
    description: nil source state. Maps to SBML symbol `Nil` and is emitted in native
      SBML units.
  - name: state
    maps_to: signaling_sbml_martinez_guimera2017_generic_redox_signalling_mo_model1710260000_model.state
    label: Observable state
  - name: summary
    maps_to: signaling_sbml_martinez_guimera2017_generic_redox_signalling_mo_model1710260000_model.summary
