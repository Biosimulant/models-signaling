schema_version: '2.0'
title: Palini2011_Minimal_2_Feedback_Model Lab
description: 'Clean Biosimulant lab for systems signaling model: Palini2011_Minimal_2_Feedback_Model.
  Values are native SBML quantities; equations, parameters, and initial values remain
  in the bundled source file.'
models:
- alias: signaling_sbml_palini2011_minimal_2_feedback_model_biomd0000000325_model
  path: models/core
- alias: visualisation
  path: models/visualisation
wiring:
- from: signaling_sbml_palini2011_minimal_2_feedback_model_biomd0000000325_model.state
  to:
  - visualisation.signaling_sbml_palini2011_minimal_2_feedback_model_biomd0000000325_model_state
- from: signaling_sbml_palini2011_minimal_2_feedback_model_biomd0000000325_model.summary
  to:
  - visualisation.signaling_sbml_palini2011_minimal_2_feedback_model_biomd0000000325_model_summary
- from: signaling_sbml_palini2011_minimal_2_feedback_model_biomd0000000325_model.species_labels
  to:
  - visualisation.signaling_sbml_palini2011_minimal_2_feedback_model_biomd0000000325_model_species_labels
runtime:
  duration: 1.0
  communication_step: 0.1
  initial_inputs: {}
tags:
- signaling
- systems
- systems-biology
- sbml
- faithful
- biomodels_ebi
- gpcr
io:
  inputs:
  - name: initial_source_defined_l_state
    maps_to: signaling_sbml_palini2011_minimal_2_feedback_model_biomd0000000325_model.initial_source_defined_l_state
    label: Initial source-defined L state
    description: Initial level of source-defined L state. Maps to SBML symbol `L`;
      exposed as a traceable initial-condition perturbation.
  outputs:
  - name: source_defined_l_state
    maps_to: signaling_sbml_palini2011_minimal_2_feedback_model_biomd0000000325_model.source_defined_l_state
    label: Source Defined L State
    description: Source Defined L State. Maps to SBML symbol `L` and is emitted in
      native SBML units.
  - name: source_defined_r_state
    maps_to: signaling_sbml_palini2011_minimal_2_feedback_model_biomd0000000325_model.source_defined_r_state
    label: Source Defined R State
    description: Source Defined R State. Maps to SBML symbol `R` and is emitted in
      native SBML units.
  - name: source_defined_c_state
    maps_to: signaling_sbml_palini2011_minimal_2_feedback_model_biomd0000000325_model.source_defined_c_state
    label: Source Defined C State
    description: Source Defined C State. Maps to SBML symbol `C` and is emitted in
      native SBML units.
  - name: state
    maps_to: signaling_sbml_palini2011_minimal_2_feedback_model_biomd0000000325_model.state
    label: Observable state
  - name: summary
    maps_to: signaling_sbml_palini2011_minimal_2_feedback_model_biomd0000000325_model.summary
    label: Simulation summary
  - name: species_labels
    maps_to: signaling_sbml_palini2011_minimal_2_feedback_model_biomd0000000325_model.species_labels
    label: Observable labels
