  - visualisation.signaling_sbml_celli_re2011_plasticity_of_tgf_signalling_biomd0000000600_model_summary
- from: signaling_sbml_celli_re2011_plasticity_of_tgf_signalling_biomd0000000600_model.species_labels
  to:
  - visualisation.signaling_sbml_celli_re2011_plasticity_of_tgf_signalling_biomd0000000600_model_species_labels
runtime:
  duration: 1.0
  communication_step: 0.1
  initial_inputs: {}
tags:
- signaling
- systems
- systems-biology
- sbml
- faithful
- biomodels_ebi
- cellular-signaling
io:
