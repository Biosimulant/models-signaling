    maps_to: signaling_sbml_hetmanski2019_mechanochemical_signaling_controll_model1908290001_model.actinf
    label: Actinf
    description: Actinf. Maps to SBML symbol `Actinf` and is emitted in native SBML
      units.
  - name: p_mlca
    maps_to: signaling_sbml_hetmanski2019_mechanochemical_signaling_controll_model1908290001_model.p_mlca
    label: P Mlca
    description: P Mlca. Maps to SBML symbol `pMLCa` and is emitted in native SBML
      units.
  - name: cavi_src
    maps_to: signaling_sbml_hetmanski2019_mechanochemical_signaling_controll_model1908290001_model.cavi_src
    label: Cavi Src
    description: Cavi Src. Maps to SBML symbol `Cavi_Src` and is emitted in native
      SBML units.
  - name: state
