schema_version: '2.0'
title: Schwarz2018-Cdk Activity Threshold Determines Passage through the Restriction
  Point
description: At the restriction point (R), mammalian cells irreversibly commit to
  divide. R has been viewed as a point in G1 that is passed when growth factor signaling
  initiates a positive feedback loop of Cdk ac.
