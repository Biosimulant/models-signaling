    maps_to: signaling_sbml_hayashi1999_nosynth_phospho_model4780784080_model.initial_nos_calcium_m_ca4
    label: Initial NOS calcium M Ca4
    description: Initial level of NOS calcium M Ca4. Maps to SBML symbol `NOS_slash_CaM_minus_Ca4`;
      exposed as a traceable initial-condition perturbation.
  - name: initial_nos_calcium_mkialpha
    maps_to: signaling_sbml_hayashi1999_nosynth_phospho_model4780784080_model.initial_nos_calcium_mkialpha
    label: Initial NOS calcium Mkialpha
    description: Initial level of NOS calcium Mkialpha. Maps to SBML symbol `NOS_slash_CaMKIalpha`;
      exposed as a traceable initial-condition perturbation.
  - name: initial_nos_calcium_mkiialpha
    maps_to: signaling_sbml_hayashi1999_nosynth_phospho_model4780784080_model.initial_nos_calcium_mkiialpha
    label: Initial NOS calcium Mkiialpha
    description: Initial level of NOS calcium Mkiialpha. Maps to SBML symbol `NOS_slash_CaMKIIalpha`;
      exposed as a traceable initial-condition perturbation.
