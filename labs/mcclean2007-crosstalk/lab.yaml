schema_version: '2.0'
title: McClean2007_CrossTalk Lab
description: Clean Biosimulant lab for MAPK/ERK receptor signaling. Values are native
  SBML quantities; equations, parameters, and initial values remain in the bundled
  source file.
models:
- alias: signaling_sbml_mcclean2007_crosstalk_biomd0000000116_model
  path: models/core
- alias: visualisation
  path: models/visualisation
wiring:
- from: signaling_sbml_mcclean2007_crosstalk_biomd0000000116_model.state
  to:
  - visualisation.signaling_sbml_mcclean2007_crosstalk_biomd0000000116_model_state
- from: signaling_sbml_mcclean2007_crosstalk_biomd0000000116_model.summary
  to:
  - visualisation.signaling_sbml_mcclean2007_crosstalk_biomd0000000116_model_summary
- from: signaling_sbml_mcclean2007_crosstalk_biomd0000000116_model.species_labels
  to:
  - visualisation.signaling_sbml_mcclean2007_crosstalk_biomd0000000116_model_species_labels
runtime:
  duration: 1.0
  communication_step: 0.1
  initial_inputs: {}
tags:
- signaling
- systems
- systems-biology
- sbml
- faithful
- biomodels_ebi
- mapk
io:
  inputs:
  - name: initial_x1p
    maps_to: signaling_sbml_mcclean2007_crosstalk_biomd0000000116_model.initial_x1p
    label: Initial X1p
    description: Initial level of X1p. Maps to SBML symbol `species_0`; exposed as
      a traceable initial-condition perturbation.
  outputs:
  - name: x1p
    maps_to: signaling_sbml_mcclean2007_crosstalk_biomd0000000116_model.x1p
    label: X1p
    description: X1p. Maps to SBML symbol `species_0` and is emitted in native SBML
      units.
  - name: x2p
    maps_to: signaling_sbml_mcclean2007_crosstalk_biomd0000000116_model.x2p
    label: X2p
    description: X2p. Maps to SBML symbol `species_1` and is emitted in native SBML
      units.
  - name: x3p
    maps_to: signaling_sbml_mcclean2007_crosstalk_biomd0000000116_model.x3p
    label: X3p
    description: X3p. Maps to SBML symbol `species_2` and is emitted in native SBML
      units.
  - name: state
    maps_to: signaling_sbml_mcclean2007_crosstalk_biomd0000000116_model.state
    label: Observable state
  - name: summary
    maps_to: signaling_sbml_mcclean2007_crosstalk_biomd0000000116_model.summary
    label: Simulation summary
  - name: species_labels
    maps_to: signaling_sbml_mcclean2007_crosstalk_biomd0000000116_model.species_labels
    label: Observable labels
