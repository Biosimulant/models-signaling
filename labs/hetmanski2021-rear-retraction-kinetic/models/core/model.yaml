schema_version: '2.0'
title: Hetmanski2021 rear retraction kinetic
description: Point models describing protein-protein signalling and membrane tension/contractility
  leading to rear retraction. It can be used to explore signaling dynamics and compare
  pathway response across conditions.
standard: other
tags:
- signaling
- systems
- systems-biology
- sbml
- faithful
- biomodels_ebi
- gpcr
authors:
- Biosimulant Team
- Joseph H R Hetmanski
- Matthew C Jones
- Fatima Chunara
- Jean-Marc Schwartz
- Patrick T Caswell
upstream:
  id: biomodels_ebi:MODEL2103010001
  source_db: biomodels_ebi
  source_id: MODEL2103010001
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/MODEL2103010001
  download_url: https://www.ebi.ac.uk/biomodels/model/download/MODEL2103010001?filename=S1_Model.xml
  license: CC0
biosim:
  entrypoint: src.hetmanski2021_rear_retraction_kinetic:Hetmanski2021RearRetractionKineticModel2103010001Model
  init_kwargs:
    model_path: data/MODEL2103010001.xml
    integration_step: 0.01
  communication_step: 0.1
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
