schema_version: '2.0'
title: Heiland2019 - NAD pathway model analysing the impact of NNMT on pathway dynamics
  and evolution
description: This is a detailed model of NAD biosynthesis and consumption representing
  pathway variances across kingdoms. It can be used to explore signaling dynamics
  and compare pathway response across conditions.
