schema_version: '2.0'
title: Pathak2013 - MAPK activation in response to various biotic stresses Lab
description: Clean Biosimulant lab for MAPK/ERK receptor signaling. Values are native
  SBML quantities; equations, parameters, and initial values remain in the bundled
  source file.
models:
- alias: signaling_sbml_pathak2013_mapk_activation_in_response_to_variou_biomd0000000492_model
  path: models/core
- alias: visualisation
  path: models/visualisation
wiring:
- from: signaling_sbml_pathak2013_mapk_activation_in_response_to_variou_biomd0000000492_model.state
  to:
  - visualisation.signaling_sbml_pathak2013_mapk_activation_in_response_to_variou_biomd0000000492_model_state
- from: signaling_sbml_pathak2013_mapk_activation_in_response_to_variou_biomd0000000492_model.summary
  to:
  - visualisation.signaling_sbml_pathak2013_mapk_activation_in_response_to_variou_biomd0000000492_model_summary
- from: signaling_sbml_pathak2013_mapk_activation_in_response_to_variou_biomd0000000492_model.species_labels
  to:
  - visualisation.signaling_sbml_pathak2013_mapk_activation_in_response_to_variou_biomd0000000492_model_species_labels
runtime:
  duration: 1.0
  communication_step: 0.1
  initial_inputs: {}
tags:
- signaling
- systems
- systems-biology
- sbml
- faithful
- biomodels_ebi
- mapk
- stress-response
- plant-signaling
io:
  inputs:
  - name: initial_fungal_pathogen
    maps_to: signaling_sbml_pathak2013_mapk_activation_in_response_to_variou_biomd0000000492_model.initial_fungal_pathogen
    label: Initial Fungal Pathogen
    description: Initial level of Fungal Pathogen. Maps to SBML symbol `s1`; exposed
      as a traceable initial-condition perturbation.
  outputs:
  - name: mapkkk
    maps_to: signaling_sbml_pathak2013_mapk_activation_in_response_to_variou_biomd0000000492_model.mapkkk
    label: MAPKKK
    description: MAPKKK. Maps to SBML symbol `s7` and is emitted in native SBML units.
  - name: mapkkk_2
    maps_to: signaling_sbml_pathak2013_mapk_activation_in_response_to_variou_biomd0000000492_model.mapkkk_2
    label: MAPKKK
    description: MAPKKK. Maps to SBML symbol `s8` and is emitted in native SBML units.
  - name: mapkkk1
    maps_to: signaling_sbml_pathak2013_mapk_activation_in_response_to_variou_biomd0000000492_model.mapkkk1
    label: MAPKKK1
    description: MAPKKK1. Maps to SBML symbol `s9` and is emitted in native SBML units.
  - name: state
    maps_to: signaling_sbml_pathak2013_mapk_activation_in_response_to_variou_biomd0000000492_model.state
    label: Observable state
  - name: summary
    maps_to: signaling_sbml_pathak2013_mapk_activation_in_response_to_variou_biomd0000000492_model.summary
    label: Simulation summary
  - name: species_labels
    maps_to: signaling_sbml_pathak2013_mapk_activation_in_response_to_variou_biomd0000000492_model.species_labels
    label: Observable labels
