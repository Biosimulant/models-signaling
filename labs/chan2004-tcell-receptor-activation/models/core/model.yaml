    label: Initial Inactive Lck
    description: Initial level of Inactive Lck. Maps to SBML symbol `lck_inactive`;
      exposed as a traceable initial-condition perturbation.
  outputs:
  - name: inactive_lck
    maps_to: signaling_sbml_chan2004_tcell_receptor_activation_biomd0000000120_model.inactive_lck
    label: Inactive Lck
    description: Inactive Lck. Maps to SBML symbol `lck_inactive` and is emitted in
      native SBML units.
  - name: active_lck
    maps_to: signaling_sbml_chan2004_tcell_receptor_activation_biomd0000000120_model.active_lck
    label: active Lck
    description: active Lck. Maps to SBML symbol `lck_active` and is emitted in native
      SBML units.
  - name: inactive_phosphatase
    maps_to: signaling_sbml_chan2004_tcell_receptor_activation_biomd0000000120_model.inactive_phosphatase
    label: Inactive Phosphatase
    description: Inactive Phosphatase. Maps to SBML symbol `phosphatase_inactive`
      and is emitted in native SBML units.
  - name: state
    maps_to: signaling_sbml_chan2004_tcell_receptor_activation_biomd0000000120_model.state
    label: Observable state
  - name: summary
    maps_to: signaling_sbml_chan2004_tcell_receptor_activation_biomd0000000120_model.summary
    label: Simulation summary
  - name: species_labels
    maps_to: signaling_sbml_chan2004_tcell_receptor_activation_biomd0000000120_model.species_labels
    label: Observable labels
