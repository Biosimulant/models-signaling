  id: biomodels_ebi:BIOMD0000000854
  source_db: biomodels_ebi
  source_id: BIOMD0000000854
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/BIOMD0000000854
  download_url: https://www.ebi.ac.uk/biomodels/model/download/BIOMD0000000854?filename=Gray2016.xml
  license: CC0
biosim:
