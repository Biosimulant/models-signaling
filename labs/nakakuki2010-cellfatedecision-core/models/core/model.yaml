schema_version: '2.0'
title: Nakakuki2010_CellFateDecision_Core
description: This model describes the activation of immediate early genes such as
  cFos after EGF or heregulin (HRG) stimulation of the MAPK pathway. Phosphorylated
  cFos is a key transcription factor triggering dow.
standard: other
tags:
- signaling
- systems
- systems-biology
- sbml
- faithful
- biomodels_ebi
- mapk
authors:
- Biosimulant Team
- Takashi Nakakuki
- Marc R Birtwistle
- Yuko Saeki
- Noriko Yumoto
- Kaori Ide
