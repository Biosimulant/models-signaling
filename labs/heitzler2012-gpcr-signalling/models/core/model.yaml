schema_version: '2.0'
title: Heitzler2012 - GPCR signalling
description: 'This model is from the article: Competing G protein-coupled receptor
  kinases balance G protein and β-arrestin signaling Heitzler D, Durand G, Gallay
  N, Rizk A, Ahn S, Kim J, Violin JD, Dupuy L, Gauthi. It can be used to explore signaling
  dynamics and compare pathway response across conditions.'
standard: other
tags:
- signaling
