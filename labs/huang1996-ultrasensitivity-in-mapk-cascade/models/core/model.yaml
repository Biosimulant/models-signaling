title: Huang1996 - Ultrasensitivity in MAPK cascade
description: Huang1996 - Ultrasensitivity in MAPK cascade The temporal sequence of
  kinase activation, from MAPKKK (activated RAF) to the final effector MAPK (activated
  ERK), is described here. It can be used to explore signaling dynamics and compare
  pathway response across conditions.
