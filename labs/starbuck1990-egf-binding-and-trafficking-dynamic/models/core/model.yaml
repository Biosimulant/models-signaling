schema_version: '2.0'
title: Starbuck1990 - EGF binding and trafficking dynamics in Fibroblast
description: mathematical model, with accompanying quantitative experimental data,
  for binding and trafficking properties of the epidermal growth factor (EGF) receptor
  on B82 fibroblasts, and propose a theoretical. It can be used to explore signaling
  dynamics and compare pathway response across conditions.
standard: other
