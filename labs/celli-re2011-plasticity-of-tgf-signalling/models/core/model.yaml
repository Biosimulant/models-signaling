    description: Initial level of I SMAD TGF-beta TGF-beta R P. Maps to SBML symbol
      `I_Smad_TGFb_TGFbR_P`; exposed as a traceable initial-condition perturbation.
  - name: initial_tgf_beta_tgf_beta_r
    maps_to: signaling_sbml_celli_re2011_plasticity_of_tgf_signalling_biomd0000000600_model.initial_tgf_beta_tgf_beta_r
    label: Initial TGF-beta TGF-beta R
    description: Initial level of TGF-beta TGF-beta R. Maps to SBML symbol `TGFb_TGFbR`;
      exposed as a traceable initial-condition perturbation.
