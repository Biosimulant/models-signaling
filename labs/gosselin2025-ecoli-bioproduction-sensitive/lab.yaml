    maps_to: signaling_sbml_gosselin2025_ecoli_bioproduction_sensitive_model2506160002_model.initial_acetate_out
    label: Initial acetate Out
    description: Initial level of acetate Out. Maps to SBML symbol `Ace_out`; exposed
      as a traceable initial-condition perturbation.
  - name: initial_glucose
    maps_to: signaling_sbml_gosselin2025_ecoli_bioproduction_sensitive_model2506160002_model.initial_glucose
    label: Initial glucose
    description: Initial level of glucose. Maps to SBML symbol `Glc`; exposed as a
      traceable initial-condition perturbation.
  - name: initial_response_node_x
    maps_to: signaling_sbml_gosselin2025_ecoli_bioproduction_sensitive_model2506160002_model.initial_response_node_x
    label: Initial response node X
    description: Initial level of response node X. Maps to SBML symbol `X`; exposed
      as a traceable initial-condition perturbation.
  outputs:
  - name: glucose
    maps_to: signaling_sbml_gosselin2025_ecoli_bioproduction_sensitive_model2506160002_model.glucose
    label: glucose
    description: glucose. Maps to SBML symbol `Glc` and is emitted in native SBML
      units.
  - name: source_defined_acp_state
    maps_to: signaling_sbml_gosselin2025_ecoli_bioproduction_sensitive_model2506160002_model.source_defined_acp_state
    label: source-defined ACP state
    description: source-defined ACP state. Maps to SBML symbol `AcP` and is emitted
      in native SBML units.
  - name: acetate
    maps_to: signaling_sbml_gosselin2025_ecoli_bioproduction_sensitive_model2506160002_model.acetate
    label: acetate
    description: acetate. Maps to SBML symbol `Ace` and is emitted in native SBML
      units.
  - name: state
    maps_to: signaling_sbml_gosselin2025_ecoli_bioproduction_sensitive_model2506160002_model.state
    label: Observable state
  - name: summary
    maps_to: signaling_sbml_gosselin2025_ecoli_bioproduction_sensitive_model2506160002_model.summary
    label: Simulation summary
  - name: species_labels
    maps_to: signaling_sbml_gosselin2025_ecoli_bioproduction_sensitive_model2506160002_model.species_labels
    label: Observable labels
