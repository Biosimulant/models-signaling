schema_version: '2.0'
package: iribe2006-camkiikineticsmodel
version: 1.0.0
title: Iribe2006_CaMKIIkineticsModel Lab
description: Clean Biosimulant lab for calcium and second-messenger signaling. Values
  are native SBML quantities; equations, parameters, and initial values remain in
  the bundled source file.
models:
- alias: signaling_sbml_iribe2006_camkiikineticsmodel_model1006230085_model
  path: models/core
- alias: visualisation
  path: models/visualisation
wiring:
- from: signaling_sbml_iribe2006_camkiikineticsmodel_model1006230085_model.state
  to:
  - visualisation.signaling_sbml_iribe2006_camkiikineticsmodel_model1006230085_model_state
- from: signaling_sbml_iribe2006_camkiikineticsmodel_model1006230085_model.summary
  to:
  - visualisation.signaling_sbml_iribe2006_camkiikineticsmodel_model1006230085_model_summary
- from: signaling_sbml_iribe2006_camkiikineticsmodel_model1006230085_model.species_labels
  to:
  - visualisation.signaling_sbml_iribe2006_camkiikineticsmodel_model1006230085_model_species_labels
runtime:
  duration: 1.0
  communication_step: 0.1
  initial_inputs: {}
tags:
- signaling
- systems
- systems-biology
- sbml
- faithful
- biomodels_ebi
- calcium-signaling
- neuroscience
io:
  inputs:
  - name: initial_v_membrane_potential
    maps_to: signaling_sbml_iribe2006_camkiikineticsmodel_model1006230085_model.initial_v_membrane_potential
    label: Initial V Membrane Potential
    description: Initial level of V Membrane Potential. Maps to SBML symbol `V_membrane_potential`;
      exposed as a traceable initial-condition perturbation.
  outputs:
  - name: f_calcium_map_kinase
    maps_to: signaling_sbml_iribe2006_camkiikineticsmodel_model1006230085_model.f_calcium_map_kinase
    label: F calcium MAP kinase
    description: F calcium MAP kinase. Maps to SBML symbol `F_CaMK` and is emitted
      in native SBML units.
  - name: f_srca_ry_r
    maps_to: signaling_sbml_iribe2006_camkiikineticsmodel_model1006230085_model.f_srca_ry_r
    label: F Srca Ry R
    description: F Srca Ry R. Maps to SBML symbol `F_SRCa_RyR` and is emitted in native
      SBML units.
  - name: cmdn_calcium
    maps_to: signaling_sbml_iribe2006_camkiikineticsmodel_model1006230085_model.cmdn_calcium
    label: Cmdn calcium
    description: Cmdn calcium. Maps to SBML symbol `Cmdn_Ca` and is emitted in native
      SBML units.
  - name: state
    maps_to: signaling_sbml_iribe2006_camkiikineticsmodel_model1006230085_model.state
    label: Observable state
  - name: summary
    maps_to: signaling_sbml_iribe2006_camkiikineticsmodel_model1006230085_model.summary
    label: Simulation summary
  - name: species_labels
    maps_to: signaling_sbml_iribe2006_camkiikineticsmodel_model1006230085_model.species_labels
    label: Observable labels
