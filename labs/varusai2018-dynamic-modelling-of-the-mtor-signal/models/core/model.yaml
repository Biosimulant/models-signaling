schema_version: '2.0'
title: Varusai2018 - Dynamic modelling of the mTOR signalling network reveals complex
  emergent behaviours conferred by DEPTOR
description: This is a mathematical describing the effect that DEP domain-containing
  mTOR-interacting protein (DEPTOR) has on the mammalian target of rapamycin (mTOR)
  signalling network. It can be used to explore signaling dynamics and compare pathway
  response across conditions.
