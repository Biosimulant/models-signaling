schema_version: '2.0'
title: Khan2018 - Origins of robustness in translational control via eukaryotic translation
  initiation factor (eIF) 2
description: This is a ordinary differential equation-based model of the eukaryotic
  translation initiation factor (eIF2) phosphorylation pathway, a pathway important
  for regulating protein synthesis activity in eu. It can be used to explore signaling
  dynamics and compare pathway response across conditions.
standard: other
tags:
- signaling
- systems
- systems-biology
- sbml
- faithful
- biomodels_ebi
- gpcr
authors:
- Biosimulant Team
- Mohammad Farhan Khan
- Sarah Spurgeon
- Tobias von der Haar
