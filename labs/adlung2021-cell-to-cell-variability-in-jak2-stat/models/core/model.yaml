schema_version: '2.0'
title: Adlung2021 - Cell-to-cell variability in JAK2/STAT5 pathway
description: A mathematical model for cell-to-cell variability in JAK2/STAT5 pathway
  components and cytoplasmic volumes defines survival threshold in erythroid progenitor
  cells. It can be used to explore signaling dynamics and compare pathway response
  across conditions.
standard: other
tags:
- signaling
- systems
- systems-biology
- sbml
- faithful
- biomodels_ebi
- jak-stat
authors:
- Biosimulant Team
- Lorenz Adlung
- Paul Stapor
- Christian Tönsing
- Leonard Schmiester
- Luisa E Schwarzmüller
upstream:
  id: biomodels_ebi:BIOMD0000001077
  source_db: biomodels_ebi
  source_id: BIOMD0000001077
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/BIOMD0000001077
  download_url: https://www.ebi.ac.uk/biomodels/model/download/BIOMD0000001077?filename=Adlung2021
    _model_jakstat_pa.xml
  license: CC0
biosim:
  entrypoint: src.adlung2021_cell_to_cell_variability_in_jak2_stat:Adlung2021CellToCellVariabilityInJak2StatBiomd0000001077Model
  init_kwargs:
    model_path: data/BIOMD0000001077.xml
    integration_step: 0.01
  communication_step: 0.1
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
io:
  inputs:
  - name: initial_epo_receptor_jak2_complex
    maps_to: signaling_sbml_adlung2021_cell_to_cell_variability_in_jak2_stat_biomd0000001077_model.initial_epo_receptor_jak2_complex
    label: Initial EPO receptor-JAK2 complex
    description: Initial level of EPO receptor-JAK2 complex. Maps to SBML symbol `EpoRJAK2`;
      exposed as a traceable initial-condition perturbation.
  outputs:
  - name: stat5
    maps_to: signaling_sbml_adlung2021_cell_to_cell_variability_in_jak2_stat_biomd0000001077_model.stat5
    label: STAT5
    description: STAT5. Maps to SBML symbol `STAT5` and is emitted in native SBML
      units.
  - name: phosphorylated_stat5
    maps_to: signaling_sbml_adlung2021_cell_to_cell_variability_in_jak2_stat_biomd0000001077_model.phosphorylated_stat5
    label: phosphorylated STAT5
    description: phosphorylated STAT5. Maps to SBML symbol `pSTAT5` and is emitted
      in native SBML units.
  - name: nuclear_phosphorylated_stat5
    maps_to: signaling_sbml_adlung2021_cell_to_cell_variability_in_jak2_stat_biomd0000001077_model.nuclear_phosphorylated_stat5
    label: nuclear phosphorylated STAT5
    description: nuclear phosphorylated STAT5. Maps to SBML symbol `npSTAT5` and is
      emitted in native SBML units.
  - name: state
    maps_to: signaling_sbml_adlung2021_cell_to_cell_variability_in_jak2_stat_biomd0000001077_model.state
    label: Observable state
  - name: summary
    maps_to: signaling_sbml_adlung2021_cell_to_cell_variability_in_jak2_stat_biomd0000001077_model.summary
    label: Simulation summary
  - name: species_labels
    maps_to: signaling_sbml_adlung2021_cell_to_cell_variability_in_jak2_stat_biomd0000001077_model.species_labels
    label: Observable labels
