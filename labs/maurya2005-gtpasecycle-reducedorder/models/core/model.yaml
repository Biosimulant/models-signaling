  - name: source_defined_rg_t_state
    maps_to: signaling_sbml_maurya2005_gtpasecycle_reducedorder_biomd0000000085_model.source_defined_rg_t_state
    label: source-defined RG*T state
    description: source-defined RG*T state. Maps to SBML symbol `species_10` and is
      emitted in native SBML units.
  - name: source_defined_g_at_state
    maps_to: signaling_sbml_maurya2005_gtpasecycle_reducedorder_biomd0000000085_model.source_defined_g_at_state
