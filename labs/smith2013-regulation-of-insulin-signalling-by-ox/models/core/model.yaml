schema_version: '2.0'
title: Smith2013 - Regulation of Insulin Signalling by Oxidative Stress
description: Smith2013 - Regulation of Insulin Signalling by Oxidative Stress The
  model describes insulin signalling (in rodent adipocytes), which includes in addition
  to the core pathway, the transcriptional feed. It can be used to explore signaling
  dynamics and compare pathway response across conditions.
