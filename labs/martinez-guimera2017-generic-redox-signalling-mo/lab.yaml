  - visualisation.signaling_sbml_martinez_guimera2017_generic_redox_signalling_mo_model1710260000_model_summary
- from: signaling_sbml_martinez_guimera2017_generic_redox_signalling_mo_model1710260000_model.species_labels
  to:
  - visualisation.signaling_sbml_martinez_guimera2017_generic_redox_signalling_mo_model1710260000_model_species_labels
runtime:
