schema_version: '2.0'
title: Strasen2018 - TGFb SMAD Signalling - Degradation of 25pM ligand (TGFb)
description: MOdel simulates 25pM ligand degradation kinetics as shown in Figure 4D.
  It can be used to explore signaling dynamics and compare pathway response across
  conditions.
standard: other
tags:
- signaling
- systems
- systems-biology
- sbml
- faithful
- biomodels_ebi
- tgf-beta
- smad
authors:
- Biosimulant Team
- Strasen J
- Sarma U
- Jentsch M
- Bohn S
- Sheng C
upstream:
  id: biomodels_ebi:BIOMD0000000990
  source_db: biomodels_ebi
  source_id: BIOMD0000000990
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/BIOMD0000000990
  download_url: https://www.ebi.ac.uk/biomodels/model/download/BIOMD0000000990?filename=MODEL1712050002.xml
  license: CC0
biosim:
  entrypoint: src.strasen2018_tgfb_smad_signalling_degradation_of:Strasen2018TgfbSmadSignallingDegradationOfBiomd0000000990Model
  init_kwargs:
    model_path: data/BIOMD0000000990.xml
    integration_step: 0.01
  communication_step: 0.1
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
io:
  inputs:
  - name: initial_index_induced_ligand_deg_level
    maps_to: signaling_sbml_strasen2018_tgfb_smad_signalling_degradation_of_biomd0000000990_model.initial_index_induced_ligand_deg_level
    label: Index Induced Ligand Deg
    description: Index Induced Ligand Deg source parameter. Maps to SBML symbol `index_induced_ligand_deg`
      and preserves the bundled default.
  - name: initial_kin_deg_ligand_level
    maps_to: signaling_sbml_strasen2018_tgfb_smad_signalling_degradation_of_biomd0000000990_model.initial_kin_deg_ligand_level
    label: Kin Deg Ligand
    description: Kin Deg Ligand source parameter. Maps to SBML symbol `kin_deg_Ligand`
      and preserves the bundled default.
  - name: initial_tgf_beta_ligand_dose
    maps_to: signaling_sbml_strasen2018_tgfb_smad_signalling_degradation_of_biomd0000000990_model.initial_tgf_beta_ligand_dose
    label: TGF-beta LIGAND Dose
    description: TGF-beta LIGAND Dose source parameter. Maps to SBML symbol `TGFb_LIGAND_Dose`
      and preserves the bundled default.
  outputs:
  - name: active_tgfr2
    maps_to: signaling_sbml_strasen2018_tgfb_smad_signalling_degradation_of_biomd0000000990_model.active_tgfr2
    label: active TGFR2
    description: active TGFR2. Maps to SBML symbol `Active_R2` and is emitted in native
      SBML units.
  - name: active_tgf_beta_tgfr1_tgfr2
    maps_to: signaling_sbml_strasen2018_tgfb_smad_signalling_degradation_of_biomd0000000990_model.active_tgf_beta_tgfr1_tgfr2
    label: active TGF-beta TGFR1 TGFR2
    description: active TGF-beta TGFR1 TGFR2. Maps to SBML symbol `Active_Rec` and
      is emitted in native SBML units.
  - name: active_tgf_beta_tgfr1_tgfr2_endo
    maps_to: signaling_sbml_strasen2018_tgfb_smad_signalling_degradation_of_biomd0000000990_model.active_tgf_beta_tgfr1_tgfr2_endo
    label: active TGF-beta TGFR1 TGFR2 Endo
    description: active TGF-beta TGFR1 TGFR2 Endo. Maps to SBML symbol `Active_Rec_endo`
      and is emitted in native SBML units.
  - name: state
    maps_to: signaling_sbml_strasen2018_tgfb_smad_signalling_degradation_of_biomd0000000990_model.state
    label: Observable state
  - name: summary
    maps_to: signaling_sbml_strasen2018_tgfb_smad_signalling_degradation_of_biomd0000000990_model.summary
    label: Simulation summary
  - name: species_labels
    maps_to: signaling_sbml_strasen2018_tgfb_smad_signalling_degradation_of_biomd0000000990_model.species_labels
    label: Observable labels
