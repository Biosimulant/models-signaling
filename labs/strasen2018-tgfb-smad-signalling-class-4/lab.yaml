    description: Kin Deg Ligand source parameter. Maps to SBML symbol `kin_deg_Ligand`
      and preserves the bundled default.
  - name: initial_kout_deg_ligand_100p_m_level
    maps_to: signaling_sbml_strasen2018_tgfb_smad_signalling_class_4_biomd0000001001_model.initial_kout_deg_ligand_100p_m_level
    label: Kout Deg Ligand 100p M
    description: Kout Deg Ligand 100p M source parameter. Maps to SBML symbol `kout_deg_Ligand_100pM`
