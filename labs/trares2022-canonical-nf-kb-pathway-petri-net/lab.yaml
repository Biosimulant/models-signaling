  to:
  - visualisation.signaling_sbml_trares2022_canonical_nf_kb_pathway_petri_net_model2207210001_model_state
- from: signaling_sbml_trares2022_canonical_nf_kb_pathway_petri_net_model2207210001_model.summary
  to:
  - visualisation.signaling_sbml_trares2022_canonical_nf_kb_pathway_petri_net_model2207210001_model_summary
- from: signaling_sbml_trares2022_canonical_nf_kb_pathway_petri_net_model2207210001_model.species_labels
  to:
  - visualisation.signaling_sbml_trares2022_canonical_nf_kb_pathway_petri_net_model2207210001_model_species_labels
runtime:
  duration: 1.0
  communication_step: 0.1
  initial_inputs: {}
tags:
- signaling
- systems
- systems-biology
- sbml
- faithful
- biomodels_ebi
- nfkb
io:
