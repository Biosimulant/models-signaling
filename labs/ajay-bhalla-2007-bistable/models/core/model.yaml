schema_version: '2.0'
title: Ajay_Bhalla_2007_Bistable
description: This is a model of ERKII signaling which is bistable due to feedback.
  The feedback occurs through ERKII phosphorylation of phospholipase A2 (PLA2), leading
  to increased production of arachidonic acid.
standard: other
tags:
- signaling
- systems
- systems-biology
- sbml
- faithful
- biomodels_ebi
- cellular-signaling
authors:
- Biosimulant Team
- Sriram M Ajay
- Upinder S Bhalla
