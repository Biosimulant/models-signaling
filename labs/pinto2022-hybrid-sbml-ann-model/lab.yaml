schema_version: '2.0'
package: pinto2022-hybrid-sbml-ann-model
version: 1.0.0
title: Pinto2022 - Hybrid SBML/ANN model Lab
description: 'Clean Biosimulant lab for systems signaling model: Pinto2022 - Hybrid
  SBML/ANN model. Values are native SBML quantities; equations, parameters, and initial
  values remain in the bundled source file.'
models:
- alias: signaling_sbml_pinto2022_hybrid_sbml_ann_model_model2207280001_model
  path: models/core
- alias: visualisation
  path: models/visualisation
wiring:
- from: signaling_sbml_pinto2022_hybrid_sbml_ann_model_model2207280001_model.state
  to:
  - visualisation.signaling_sbml_pinto2022_hybrid_sbml_ann_model_model2207280001_model_state
- from: signaling_sbml_pinto2022_hybrid_sbml_ann_model_model2207280001_model.summary
  to:
  - visualisation.signaling_sbml_pinto2022_hybrid_sbml_ann_model_model2207280001_model_summary
- from: signaling_sbml_pinto2022_hybrid_sbml_ann_model_model2207280001_model.species_labels
  to:
  - visualisation.signaling_sbml_pinto2022_hybrid_sbml_ann_model_model2207280001_model_species_labels
runtime:
  duration: 1.0
  communication_step: 0.1
  initial_inputs: {}
tags:
- signaling
- systems
- systems-biology
- sbml
- faithful
- biomodels_ebi
- cellular-signaling
io:
  inputs:
  - name: initial_adp
    maps_to: signaling_sbml_pinto2022_hybrid_sbml_ann_model_model2207280001_model.initial_adp
    label: Initial ADP
    description: Initial level of ADP. Maps to SBML symbol `adp`; exposed as a traceable
      initial-condition perturbation.
  outputs:
  - name: adp
    maps_to: signaling_sbml_pinto2022_hybrid_sbml_ann_model_model2207280001_model.adp
    label: ADP
    description: ADP. Maps to SBML symbol `adp` and is emitted in native SBML units.
  - name: source_defined_asa_state
    maps_to: signaling_sbml_pinto2022_hybrid_sbml_ann_model_model2207280001_model.source_defined_asa_state
    label: Source Defined ASA State
    description: Source Defined ASA State. Maps to SBML symbol `asa` and is emitted
      in native SBML units.
  - name: aspartate_ligand
    maps_to: signaling_sbml_pinto2022_hybrid_sbml_ann_model_model2207280001_model.aspartate_ligand
    label: Aspartate Ligand
    description: Aspartate Ligand. Maps to SBML symbol `asp` and is emitted in native
      SBML units.
  - name: state
    maps_to: signaling_sbml_pinto2022_hybrid_sbml_ann_model_model2207280001_model.state
    label: Observable state
  - name: summary
    maps_to: signaling_sbml_pinto2022_hybrid_sbml_ann_model_model2207280001_model.summary
    label: Simulation summary
  - name: species_labels
    maps_to: signaling_sbml_pinto2022_hybrid_sbml_ann_model_model2207280001_model.species_labels
    label: Observable labels
