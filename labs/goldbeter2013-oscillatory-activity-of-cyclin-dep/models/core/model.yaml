  source_db: biomodels_ebi
  source_id: BIOMD0000000944
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/BIOMD0000000944
  download_url: https://www.ebi.ac.uk/biomodels/model/download/BIOMD0000000944?filename=Goldbeter2013.xml
  license: CC0
biosim:
