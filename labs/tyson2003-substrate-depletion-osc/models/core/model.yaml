schema_version: '2.0'
title: Tyson2003_Substrate_Depletion_Osc
description: 'This is an SBML implementation the model of the substrate depletion
  oscillator (figure 2c) described in the article: Sniffers, buzzers, toggles and
  blinkers: dynamics of regulatory and signaling pathw. It can be used to explore
  signaling dynamics and compare pathway response across conditions.'
