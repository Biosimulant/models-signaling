schema_version: '2.0'
title: Scaramellini1997 - Two-receptor:One-transducer (2R1T) model for analysis of
  interactions between agonists
description: The two-receptor:one-transducerm odel (Leff, 1987) is here extended to
  analyze interactions between agonistsd isplaying E/[A] curves of different shapes,
  by incorporating slope factors into the separa. It can be used to explore signaling
  dynamics and compare pathway response across conditions.
standard: other
