schema_version: '2.0'
title: GonzalezMiranda2013 - The effect of circadian oscillations on biochemical cell
  signaling by NF-κB
description: This is a mathematical model for NF-κB oscillations, described by a set
  of ordinary nonlinear differential equations, when perturbed by a circadian oscillation.
  It can be used to explore signaling dynamics and compare pathway response across
  conditions.
