schema_version: '2.0'
title: Jung2019 - Regulating glioblastoma signaling pathways and anti-invasion therapy
  - core control model
description: This model is based on paper:Strategies in regulating glioblastoma signaling
  pathways and anti-invasion therapyAbstract:Glioblastoma multiforme is one of the
  most invasive type of glial tumors, which. It can be used to explore signaling dynamics
  and compare pathway response across conditions.
