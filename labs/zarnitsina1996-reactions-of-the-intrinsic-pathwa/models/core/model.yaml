  source_db: biomodels_ebi
  source_id: MODEL1806140001
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/MODEL1806140001
  download_url: https://www.ebi.ac.uk/biomodels/model/download/MODEL1806140001?filename=Zarnitsina1996.xml
  license: CC0
biosim:
  entrypoint: src.zarnitsina1996_reactions_of_the_intrinsic_pathwa:Zarnitsina1996ReactionsOfTheIntrinsicPathwaModel1806140001Model
  init_kwargs:
    model_path: data/MODEL1806140001.xml
    integration_step: 0.01
  communication_step: 0.1
