schema_version: '2.0'
title: Lipniacki2004 - Mathematical model of NFKB regulatory module
description: its a mathematical model studying impact of TNF on NFKB nuclear dynamics.
  It can be used to explore signaling dynamics and compare pathway response across
  conditions.
standard: other
tags:
- signaling
- systems
- systems-biology
- sbml
- faithful
- biomodels_ebi
- nfkb
- tnf-signaling
authors:
- Biosimulant Team
- Tomasz Lipniacki
- Pawel Paszek
- A R Allan R Brasier
- Bruce Luxon
- Marek Kimmel
upstream:
  id: biomodels_ebi:BIOMD0000000786
  source_db: biomodels_ebi
  source_id: BIOMD0000000786
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/BIOMD0000000786
  download_url: https://www.ebi.ac.uk/biomodels/model/download/BIOMD0000000786?filename=Lipniacki2004.xml
  license: CC0
biosim:
  entrypoint: src.lipniacki2004_mathematical_model_of_nfkb_regulat:Lipniacki2004MathematicalModelOfNfkbRegulatBiomd0000000786Model
  init_kwargs:
    model_path: data/BIOMD0000000786.xml
    integration_step: 0.01
  communication_step: 0.1
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
io:
  inputs:
  - name: initial_tnf_receptor_level
    maps_to: signaling_sbml_lipniacki2004_mathematical_model_of_nfkb_regulat_biomd0000000786_model.initial_tnf_receptor_level
    label: TNF receptor
    description: TNF receptor source parameter. Maps to SBML symbol `TNF_R` and preserves
      the bundled default.
  - name: initial_tnf
    maps_to: signaling_sbml_lipniacki2004_mathematical_model_of_nfkb_regulat_biomd0000000786_model.initial_tnf
    label: Initial TNF
    description: Initial level of TNF. Maps to SBML symbol `TNF`; exposed as a traceable
      initial-condition perturbation.
  outputs:
  - name: ikk_active
    maps_to: signaling_sbml_lipniacki2004_mathematical_model_of_nfkb_regulat_biomd0000000786_model.ikk_active
    label: IKK active
    description: IKK active. Maps to SBML symbol `IKK_active` and is emitted in native
      SBML units.
  - name: ikkactive_ik_b
    maps_to: signaling_sbml_lipniacki2004_mathematical_model_of_nfkb_regulat_biomd0000000786_model.ikkactive_ik_b
    label: Ikkactive Ik B
    description: Ikkactive Ik B. Maps to SBML symbol `IKKactive_IkB` and is emitted
      in native SBML units.
  - name: ikkactive_ik_b_nfkb
    maps_to: signaling_sbml_lipniacki2004_mathematical_model_of_nfkb_regulat_biomd0000000786_model.ikkactive_ik_b_nfkb
    label: Ikkactive Ik B NF-kB
    description: Ikkactive Ik B NF-kB. Maps to SBML symbol `IKKactive_IkB_NFKB` and
      is emitted in native SBML units.
  - name: state
    maps_to: signaling_sbml_lipniacki2004_mathematical_model_of_nfkb_regulat_biomd0000000786_model.state
    label: Observable state
  - name: summary
    maps_to: signaling_sbml_lipniacki2004_mathematical_model_of_nfkb_regulat_biomd0000000786_model.summary
    label: Simulation summary
  - name: species_labels
    maps_to: signaling_sbml_lipniacki2004_mathematical_model_of_nfkb_regulat_biomd0000000786_model.species_labels
    label: Observable labels
