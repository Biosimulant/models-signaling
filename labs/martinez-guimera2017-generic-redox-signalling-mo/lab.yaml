    maps_to: signaling_sbml_martinez_guimera2017_generic_redox_signalling_mo_model1710260000_model.initial_inhibitor
    label: Initial Inhibitor
    description: Initial level of Inhibitor. Maps to SBML symbol `Inhibitor`; exposed
      as a traceable initial-condition perturbation.
  outputs:
