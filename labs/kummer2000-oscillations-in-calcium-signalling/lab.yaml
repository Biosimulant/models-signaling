schema_version: '2.0'
package: kummer2000-oscillations-in-calcium-signalling
version: 1.0.0
title: Kummer2000 - Oscillations in Calcium Signalling Lab
description: Clean Biosimulant lab for calcium and second-messenger signaling. Values
  are native SBML quantities; equations, parameters, and initial values remain in
  the bundled source file.
models:
- alias: signaling_sbml_kummer2000_oscillations_in_calcium_signalling_biomd0000000329_model
  path: models/core
- alias: visualisation
  path: models/visualisation
wiring:
- from: signaling_sbml_kummer2000_oscillations_in_calcium_signalling_biomd0000000329_model.state
  to:
  - visualisation.signaling_sbml_kummer2000_oscillations_in_calcium_signalling_biomd0000000329_model_state
- from: signaling_sbml_kummer2000_oscillations_in_calcium_signalling_biomd0000000329_model.summary
  to:
  - visualisation.signaling_sbml_kummer2000_oscillations_in_calcium_signalling_biomd0000000329_model_summary
- from: signaling_sbml_kummer2000_oscillations_in_calcium_signalling_biomd0000000329_model.species_labels
  to:
  - visualisation.signaling_sbml_kummer2000_oscillations_in_calcium_signalling_biomd0000000329_model_species_labels
runtime:
  duration: 1.0
  communication_step: 0.1
  initial_inputs: {}
tags:
- signaling
- systems
- systems-biology
- sbml
- faithful
- biomodels_ebi
- calcium-signaling
io:
  inputs:
  - name: initial_calcium
    maps_to: signaling_sbml_kummer2000_oscillations_in_calcium_signalling_biomd0000000329_model.initial_calcium
    label: Initial Calcium
    description: Initial level of Calcium. Maps to SBML symbol `c`; exposed as a traceable
      initial-condition perturbation.
  outputs:
  - name: active_plc
    maps_to: signaling_sbml_kummer2000_oscillations_in_calcium_signalling_biomd0000000329_model.active_plc
    label: active PLC
    description: active PLC. Maps to SBML symbol `b` and is emitted in native SBML
      units.
  - name: calcium
    maps_to: signaling_sbml_kummer2000_oscillations_in_calcium_signalling_biomd0000000329_model.calcium
    label: Calcium
    description: Calcium. Maps to SBML symbol `c` and is emitted in native SBML units.
  - name: g_alpha
    maps_to: signaling_sbml_kummer2000_oscillations_in_calcium_signalling_biomd0000000329_model.g_alpha
    label: G Alpha
    description: G Alpha. Maps to SBML symbol `a` and is emitted in native SBML units.
  - name: state
    maps_to: signaling_sbml_kummer2000_oscillations_in_calcium_signalling_biomd0000000329_model.state
    label: Observable state
  - name: summary
    maps_to: signaling_sbml_kummer2000_oscillations_in_calcium_signalling_biomd0000000329_model.summary
    label: Simulation summary
  - name: species_labels
    maps_to: signaling_sbml_kummer2000_oscillations_in_calcium_signalling_biomd0000000329_model.species_labels
    label: Observable labels
