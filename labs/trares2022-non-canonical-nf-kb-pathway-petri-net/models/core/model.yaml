schema_version: '2.0'
title: Trares2022 - Non-canonical NF-kB pathway, Petri net
description: Signaling Trares2022Non Canonical Nf Kb Pathway Petri Net Model2207210002Model
  captures core biological behavior in the context of signaling, sbml, biomodels_ebi
  using a biomodels_ebi-sourced OTHER model. When you run it, you can observe state
  and evaluate how the modeled system changes across runs.
standard: other
tags:
