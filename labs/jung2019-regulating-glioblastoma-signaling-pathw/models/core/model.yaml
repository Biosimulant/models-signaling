io:
  inputs:
  - name: initial_delta_d
    maps_to: signaling_sbml_jung2019_regulating_glioblastoma_signaling_pathw_biomd0000000828_model.initial_delta_d
    label: Initial Delta D
    description: Initial level of Delta D. Maps to SBML symbol `deltaD`; exposed as
      a traceable initial-condition perturbation.
  - name: initial_drug_d
    maps_to: signaling_sbml_jung2019_regulating_glioblastoma_signaling_pathw_biomd0000000828_model.initial_drug_d
    label: Initial Drug D
    description: Initial level of Drug D. Maps to SBML symbol `Drug_D`; exposed as
      a traceable initial-condition perturbation.
  - name: initial_glucose_g
    maps_to: signaling_sbml_jung2019_regulating_glioblastoma_signaling_pathw_biomd0000000828_model.initial_glucose_g
    label: Initial Glucose G
    description: Initial level of Glucose G. Maps to SBML symbol `Glucose_G`; exposed
      as a traceable initial-condition perturbation.
  outputs:
  - name: glucose_g
    maps_to: signaling_sbml_jung2019_regulating_glioblastoma_signaling_pathw_biomd0000000828_model.glucose_g
    label: Glucose G
    description: Glucose G. Maps to SBML symbol `Glucose_G` and is emitted in native
      SBML units.
  - name: drug_d
    maps_to: signaling_sbml_jung2019_regulating_glioblastoma_signaling_pathw_biomd0000000828_model.drug_d
    label: Drug D
    description: Drug D. Maps to SBML symbol `Drug_D` and is emitted in native SBML
      units.
  - name: mi_r_451_m
    maps_to: signaling_sbml_jung2019_regulating_glioblastoma_signaling_pathw_biomd0000000828_model.mi_r_451_m
    label: Mi R 451 M
    description: Mi R 451 M. Maps to SBML symbol `miR_451_M` and is emitted in native
      SBML units.
  - name: state
    maps_to: signaling_sbml_jung2019_regulating_glioblastoma_signaling_pathw_biomd0000000828_model.state
    label: Observable state
  - name: summary
    maps_to: signaling_sbml_jung2019_regulating_glioblastoma_signaling_pathw_biomd0000000828_model.summary
    label: Simulation summary
  - name: species_labels
    maps_to: signaling_sbml_jung2019_regulating_glioblastoma_signaling_pathw_biomd0000000828_model.species_labels
    label: Observable labels
