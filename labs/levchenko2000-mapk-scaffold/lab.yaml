schema_version: '2.0'
package: levchenko2000-mapk-scaffold
version: 1.0.0
title: Levchenko2000_MAPK_Scaffold Lab
description: Clean Biosimulant lab for MAPK/ERK receptor signaling. Values are native
  SBML quantities; equations, parameters, and initial values remain in the bundled
  source file.
models:
- alias: signaling_sbml_levchenko2000_mapk_scaffold_biomd0000000014_model
  path: models/core
- alias: visualisation
  path: models/visualisation
wiring:
- from: signaling_sbml_levchenko2000_mapk_scaffold_biomd0000000014_model.state
  to:
  - visualisation.signaling_sbml_levchenko2000_mapk_scaffold_biomd0000000014_model_state
- from: signaling_sbml_levchenko2000_mapk_scaffold_biomd0000000014_model.summary
  to:
  - visualisation.signaling_sbml_levchenko2000_mapk_scaffold_biomd0000000014_model_summary
- from: signaling_sbml_levchenko2000_mapk_scaffold_biomd0000000014_model.species_labels
  to:
  - visualisation.signaling_sbml_levchenko2000_mapk_scaffold_biomd0000000014_model_species_labels
runtime:
  duration: 1.0
  communication_step: 0.1
  initial_inputs: {}
tags:
- signaling
- systems
- systems-biology
- sbml
- faithful
- biomodels_ebi
- mapk
io:
  inputs:
  - name: initial_mapk_phosphatase
    maps_to: signaling_sbml_levchenko2000_mapk_scaffold_biomd0000000014_model.initial_mapk_phosphatase
    label: Initial MAPK Phosphatase
    description: Initial level of MAPK Phosphatase. Maps to SBML symbol `MAPKP`; exposed
      as a traceable initial-condition perturbation.
  outputs:
  - name: mapk_phosphatase
    maps_to: signaling_sbml_levchenko2000_mapk_scaffold_biomd0000000014_model.mapk_phosphatase
    label: MAPK Phosphatase
    description: MAPK Phosphatase. Maps to SBML symbol `MAPKP` and is emitted in native
      SBML units.
  - name: mek_phosphatase
    maps_to: signaling_sbml_levchenko2000_mapk_scaffold_biomd0000000014_model.mek_phosphatase
    label: MEK Phosphatase
    description: MEK Phosphatase. Maps to SBML symbol `MEKP` and is emitted in native
      SBML units.
  - name: raf_phosphatase
    maps_to: signaling_sbml_levchenko2000_mapk_scaffold_biomd0000000014_model.raf_phosphatase
    label: RAF Phosphatase
    description: RAF Phosphatase. Maps to SBML symbol `RAFP` and is emitted in native
      SBML units.
  - name: state
    maps_to: signaling_sbml_levchenko2000_mapk_scaffold_biomd0000000014_model.state
    label: Observable state
  - name: summary
    maps_to: signaling_sbml_levchenko2000_mapk_scaffold_biomd0000000014_model.summary
    label: Simulation summary
  - name: species_labels
    maps_to: signaling_sbml_levchenko2000_mapk_scaffold_biomd0000000014_model.species_labels
    label: Observable labels
