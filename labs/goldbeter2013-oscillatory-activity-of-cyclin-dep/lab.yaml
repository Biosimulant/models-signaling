schema_version: '2.0'
package: goldbeter2013-oscillatory-activity-of-cyclin-dep
version: 1.0.0
title: Goldbeter2013-Oscillatory activity of cyclin-dependent kinases in the cell
  cycle Lab
description: Clean Biosimulant lab for cell-cycle regulatory signaling. Values are
  native SBML quantities; equations, parameters, and initial values remain in the
  bundled source file.
models:
- alias: signaling_sbml_goldbeter2013_oscillatory_activity_of_cyclin_dep_biomd0000000944_model
  path: models/core
- alias: visualisation
  path: models/visualisation
wiring:
- from: signaling_sbml_goldbeter2013_oscillatory_activity_of_cyclin_dep_biomd0000000944_model.state
  to:
  - visualisation.signaling_sbml_goldbeter2013_oscillatory_activity_of_cyclin_dep_biomd0000000944_model_state
- from: signaling_sbml_goldbeter2013_oscillatory_activity_of_cyclin_dep_biomd0000000944_model.summary
  to:
  - visualisation.signaling_sbml_goldbeter2013_oscillatory_activity_of_cyclin_dep_biomd0000000944_model_summary
- from: signaling_sbml_goldbeter2013_oscillatory_activity_of_cyclin_dep_biomd0000000944_model.species_labels
  to:
  - visualisation.signaling_sbml_goldbeter2013_oscillatory_activity_of_cyclin_dep_biomd0000000944_model_species_labels
runtime:
  duration: 1.0
  communication_step: 0.1
  initial_inputs: {}
tags:
- signaling
- systems
- systems-biology
- sbml
- faithful
- biomodels_ebi
- cell-cycle-signaling
io:
  inputs:
  - name: initial_cyclin
    maps_to: signaling_sbml_goldbeter2013_oscillatory_activity_of_cyclin_dep_biomd0000000944_model.initial_cyclin
    label: Initial Cyclin
    description: Initial level of Cyclin. Maps to SBML symbol `Cyclin`; exposed as
      a traceable initial-condition perturbation.
  outputs:
  - name: active_cdc2_kinase
    maps_to: signaling_sbml_goldbeter2013_oscillatory_activity_of_cyclin_dep_biomd0000000944_model.active_cdc2_kinase
    label: active Cdc2 Kinase
    description: active Cdc2 Kinase. Maps to SBML symbol `Active_Cdc2_kinase` and
      is emitted in native SBML units.
  - name: active_apc
    maps_to: signaling_sbml_goldbeter2013_oscillatory_activity_of_cyclin_dep_biomd0000000944_model.active_apc
    label: active APC
    description: active APC. Maps to SBML symbol `Active_APC` and is emitted in native
      SBML units.
  - name: cyclin
    maps_to: signaling_sbml_goldbeter2013_oscillatory_activity_of_cyclin_dep_biomd0000000944_model.cyclin
    label: Cyclin
    description: Cyclin. Maps to SBML symbol `Cyclin` and is emitted in native SBML
      units.
  - name: state
    maps_to: signaling_sbml_goldbeter2013_oscillatory_activity_of_cyclin_dep_biomd0000000944_model.state
    label: Observable state
  - name: summary
    maps_to: signaling_sbml_goldbeter2013_oscillatory_activity_of_cyclin_dep_biomd0000000944_model.summary
    label: Simulation summary
  - name: species_labels
    maps_to: signaling_sbml_goldbeter2013_oscillatory_activity_of_cyclin_dep_biomd0000000944_model.species_labels
    label: Observable labels
