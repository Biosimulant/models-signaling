schema_version: '2.0'
title: Palini2011_Minimal_2_Feedback_Model
description: 'This is the model of the minmal 2 feedback switch described in the article:
  Synthetic conversion of a graded receptor signal into a tunable, reversible switch.
  It can be used to explore signaling dynamics and compare pathway response across
  conditions.'
standard: other
tags:
- signaling
- systems
- systems-biology
- sbml
- faithful
- biomodels_ebi
- gpcr
authors:
- Biosimulant Team
- Santhosh Palani
- Casim A Sarkar
upstream:
  id: biomodels_ebi:BIOMD0000000325
  source_db: biomodels_ebi
  source_id: BIOMD0000000325
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/BIOMD0000000325
  download_url: https://www.ebi.ac.uk/biomodels/model/download/BIOMD0000000325?filename=BIOMD0000000325_url.xml
  license: CC0
biosim:
  entrypoint: src.palini2011_minimal_2_feedback_model:Palini2011Minimal2FeedbackModelBiomd0000000325Model
  init_kwargs:
    model_path: data/BIOMD0000000325.xml
    integration_step: 0.01
  communication_step: 0.1
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
