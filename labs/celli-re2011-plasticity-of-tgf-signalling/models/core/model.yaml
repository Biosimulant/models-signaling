schema_version: '2.0'
title: Cellière2011 - Plasticity of TGF-β Signalling
description: Cellière2011 - Plasticity of TGF-β Signalling Transforming growth factor
  beta (TGF-β) signalling has been implicated as an important regulator of almost
  all major cell behaviours, including proliferat. It can be used to explore signaling
  dynamics and compare pathway response across conditions.
standard: other
tags:
- signaling
- systems
- systems-biology
- sbml
- faithful
- biomodels_ebi
- cellular-signaling
authors:
- Biosimulant Team
- Geraldine Cellière
- Georgios Fengos
- Marianne Hervé
- Dagmar Iber
