schema_version: '2.0'
title: Sarma2012 - Interaction topologies of MAPK cascade (M2_K2_PSEQ)
description: Sarma2012 - Interaction topologies of MAPK cascade (M2_K2_PSEQ) The paper
  presents the various interaction topologies between the kinases and phosphatases
  of MAPK cascade. It can be used to explore signaling dynamics and compare pathway
  response across conditions.
