schema_version: '2.0'
title: Kholodenko1999 - EGFR signaling Lab
description: Clean Biosimulant lab for MAPK/ERK receptor signaling. Values are native
  SBML quantities; equations, parameters, and initial values remain in the bundled
  source file.
models:
- alias: signaling_sbml_kholodenko1999_egfr_signaling_biomd0000000048_model
  path: models/core
- alias: visualisation
  path: models/visualisation
wiring:
- from: signaling_sbml_kholodenko1999_egfr_signaling_biomd0000000048_model.state
  to:
  - visualisation.signaling_sbml_kholodenko1999_egfr_signaling_biomd0000000048_model_state
- from: signaling_sbml_kholodenko1999_egfr_signaling_biomd0000000048_model.summary
  to:
  - visualisation.signaling_sbml_kholodenko1999_egfr_signaling_biomd0000000048_model_summary
- from: signaling_sbml_kholodenko1999_egfr_signaling_biomd0000000048_model.species_labels
  to:
  - visualisation.signaling_sbml_kholodenko1999_egfr_signaling_biomd0000000048_model_species_labels
runtime:
  duration: 1.0
  communication_step: 0.1
  initial_inputs: {}
tags:
- signaling
- systems
- systems-biology
- sbml
- faithful
- biomodels_ebi
- egfr
io:
  inputs:
  - name: initial_egf_egfr
    maps_to: signaling_sbml_kholodenko1999_egfr_signaling_biomd0000000048_model.initial_egf_egfr
    label: Initial EGF EGFR
    description: Initial level of EGF EGFR. Maps to SBML symbol `Ra`; exposed as a
      traceable initial-condition perturbation.
  - name: initial_egf_egfr_2
    maps_to: signaling_sbml_kholodenko1999_egfr_signaling_biomd0000000048_model.initial_egf_egfr_2
    label: Initial EGF EGFR 2
    description: Initial level of EGF EGFR 2. Maps to SBML symbol `R2`; exposed as
      a traceable initial-condition perturbation.
  - name: initial_egf_egfr_2_grb2_adapter_protein
    maps_to: signaling_sbml_kholodenko1999_egfr_signaling_biomd0000000048_model.initial_egf_egfr_2_grb2_adapter_protein
    label: Initial EGF EGFR 2 Grb2 adapter protein
    description: Initial level of EGF EGFR 2 Grb2 adapter protein. Maps to SBML symbol
      `RG`; exposed as a traceable initial-condition perturbation.
  outputs:
  - name: epidermal_growth_factor
    maps_to: signaling_sbml_kholodenko1999_egfr_signaling_biomd0000000048_model.epidermal_growth_factor
    label: Epidermal Growth Factor
    description: Epidermal Growth Factor. Maps to SBML symbol `EGF` and is emitted
      in native SBML units.
  - name: egfr
    maps_to: signaling_sbml_kholodenko1999_egfr_signaling_biomd0000000048_model.egfr
    label: EGFR
    description: EGFR. Maps to SBML symbol `R` and is emitted in native SBML units.
  - name: egf_egfr
    maps_to: signaling_sbml_kholodenko1999_egfr_signaling_biomd0000000048_model.egf_egfr
    label: EGF EGFR
    description: EGF EGFR. Maps to SBML symbol `Ra` and is emitted in native SBML
      units.
  - name: state
    maps_to: signaling_sbml_kholodenko1999_egfr_signaling_biomd0000000048_model.state
    label: Observable state
  - name: summary
    maps_to: signaling_sbml_kholodenko1999_egfr_signaling_biomd0000000048_model.summary
    label: Simulation summary
  - name: species_labels
    maps_to: signaling_sbml_kholodenko1999_egfr_signaling_biomd0000000048_model.species_labels
    label: Observable labels
