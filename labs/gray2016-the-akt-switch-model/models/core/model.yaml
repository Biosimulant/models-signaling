    label: Initial source-defined AC state
    description: Initial level of source-defined AC state. Maps to SBML symbol `Ac`;
      exposed as a traceable initial-condition perturbation.
  outputs:
  - name: source_defined_ac_state
    maps_to: signaling_sbml_gray2016_the_akt_switch_model_biomd0000000854_model.source_defined_ac_state
    label: source-defined AC state
    description: source-defined AC state. Maps to SBML symbol `Ac` and is emitted
      in native SBML units.
  - name: source_defined_pc_state
    maps_to: signaling_sbml_gray2016_the_akt_switch_model_biomd0000000854_model.source_defined_pc_state
    label: source-defined PC state
    description: source-defined PC state. Maps to SBML symbol `Pc` and is emitted
      in native SBML units.
  - name: source_defined_ap_state
    maps_to: signaling_sbml_gray2016_the_akt_switch_model_biomd0000000854_model.source_defined_ap_state
    label: source-defined AP state
    description: source-defined AP state. Maps to SBML symbol `Ap` and is emitted
      in native SBML units.
  - name: state
    maps_to: signaling_sbml_gray2016_the_akt_switch_model_biomd0000000854_model.state
