schema_version: '2.0'
title: Tiwari2019 - Mathematical model of NFKB regulatory module with TNF and ROS
description: It is a dynamic model containing elements of two different model as one.
  It contains the impact of TNF on SOD and impact of ROS on A20 behavior.
standard: other
tags:
- signaling
- systems
- systems-biology
- sbml
- faithful
- biomodels_ebi
- nfkb
- tnf-signaling
authors:
- Biosimulant Team
- Mihai Glont
- Chinmay Arankalle
- Krishna Kumar Tiwari
- Tung Nguyen
- Henning Hermjakob
upstream:
  id: biomodels_ebi:MODEL1911140002
  source_db: biomodels_ebi
  source_id: MODEL1911140002
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/MODEL1911140002
  download_url: https://www.ebi.ac.uk/biomodels/model/download/MODEL1911140002?filename=Tiwari2019.xml
  license: CC0
biosim:
  entrypoint: src.tiwari2019_mathematical_model_of_nfkb_regulatory:Tiwari2019MathematicalModelOfNfkbRegulatoryModel1911140002Model
  init_kwargs:
    model_path: data/MODEL1911140002.xml
    integration_step: 0.01
  communication_step: 0.1
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
io:
  inputs:
  - name: initial_tnf_receptor_level
    maps_to: signaling_sbml_tiwari2019_mathematical_model_of_nfkb_regulatory_model1911140002_model.initial_tnf_receptor_level
    label: TNF receptor
    description: TNF receptor source parameter. Maps to SBML symbol `TNF_R` and preserves
      the bundled default.
  - name: initial_tnf
    maps_to: signaling_sbml_tiwari2019_mathematical_model_of_nfkb_regulatory_model1911140002_model.initial_tnf
    label: Initial TNF
    description: Initial level of TNF. Maps to SBML symbol `TNF`; exposed as a traceable
      initial-condition perturbation.
  outputs:
  - name: ikk_active
    maps_to: signaling_sbml_tiwari2019_mathematical_model_of_nfkb_regulatory_model1911140002_model.ikk_active
    label: IKK active
    description: IKK active. Maps to SBML symbol `IKK_active` and is emitted in native
      SBML units.
  - name: ikkactive_ik_b
    maps_to: signaling_sbml_tiwari2019_mathematical_model_of_nfkb_regulatory_model1911140002_model.ikkactive_ik_b
    label: Ikkactive Ik B
    description: Ikkactive Ik B. Maps to SBML symbol `IKKactive_IkB` and is emitted
      in native SBML units.
  - name: ikkactive_ik_b_nfkb
    maps_to: signaling_sbml_tiwari2019_mathematical_model_of_nfkb_regulatory_model1911140002_model.ikkactive_ik_b_nfkb
    label: Ikkactive Ik B NF-kB
    description: Ikkactive Ik B NF-kB. Maps to SBML symbol `IKKactive_IkB_NFKB` and
      is emitted in native SBML units.
  - name: state
    maps_to: signaling_sbml_tiwari2019_mathematical_model_of_nfkb_regulatory_model1911140002_model.state
    label: Observable state
  - name: summary
    maps_to: signaling_sbml_tiwari2019_mathematical_model_of_nfkb_regulatory_model1911140002_model.summary
    label: Simulation summary
  - name: species_labels
    maps_to: signaling_sbml_tiwari2019_mathematical_model_of_nfkb_regulatory_model1911140002_model.species_labels
    label: Observable labels
