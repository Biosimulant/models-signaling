  license: CC0
biosim:
  entrypoint: src.sarma2012_interaction_topologies_of_mapk_cascade_model1204280022:Sarma2012InteractionTopologiesOfMapkCascadeModel1204280022Model
  init_kwargs:
    model_path: data/MODEL1204280022.xml
    integration_step: 0.01
  communication_step: 0.1
