    maps_to: signaling_sbml_lee2008_erk_and_pi3k_signal_integration_by_myc_biomd0000000818_model.initial_myc_transcription_factor_total
    label: Initial MYC transcription factor Total
    description: Initial level of MYC transcription factor Total. Maps to SBML symbol
      `Myc_total`; exposed as a traceable initial-condition perturbation.
  outputs:
