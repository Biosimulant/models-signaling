description: 'Yapo2017 - A2AR/cAMP/PKA signalling in D2 dopamine receptor expressing
  medium-spiny neurons This model is described in the article: Detection of phasic
  dopamine by D1 and D2 striatal medium spiny neur. It can be used to explore signaling
  dynamics and compare pathway response across conditions.'
