schema_version: '2.0'
title: Ouyang2014 - photomorphogenic UV-B signalling network
description: 'Ouyang2014 - photomorphogenic UV-B signallingnetwork This model is described
  in the article: Coordinated photomorphogenic UV-B signaling network captured by
  mathematical modeling. It can be used to explore signaling dynamics and compare
  pathway response across conditions.'
standard: other
tags:
- signaling
- systems
- systems-biology
- sbml
- faithful
- biomodels_ebi
- plant-signaling
authors:
- Biosimulant Team
- Xinhao Ouyang
- Xi Huang
- Xiao Jin
- Zheng Chen
- Panyu Yang
upstream:
  id: biomodels_ebi:BIOMD0000000545
  source_db: biomodels_ebi
  source_id: BIOMD0000000545
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/BIOMD0000000545
  download_url: https://www.ebi.ac.uk/biomodels/model/download/BIOMD0000000545?filename=BIOMD0000000545_url.xml
  license: CC0
biosim:
  entrypoint: src.ouyang2014_photomorphogenic_uv_b_signalling_netw:Ouyang2014PhotomorphogenicUvBSignallingNetwBiomd0000000545Model
  init_kwargs:
    model_path: data/BIOMD0000000545.xml
    integration_step: 0.01
  communication_step: 0.1
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
io:
  inputs:
  - name: initial_source_defined_uv_state_level
    maps_to: signaling_sbml_ouyang2014_photomorphogenic_uv_b_signalling_netw_biomd0000000545_model.initial_source_defined_uv_state_level
    label: source-defined UV state
    description: source-defined UV state source parameter. Maps to SBML symbol `UV`
      and preserves the bundled default.
  - name: initial_uvr8_m
    maps_to: signaling_sbml_ouyang2014_photomorphogenic_uv_b_signalling_netw_biomd0000000545_model.initial_uvr8_m
    label: Initial UVR8 M
    description: Initial level of UVR8 M. Maps to SBML symbol `UVR8_M`; exposed as
      a traceable initial-condition perturbation.
  - name: initial_uvr8d
    maps_to: signaling_sbml_ouyang2014_photomorphogenic_uv_b_signalling_netw_biomd0000000545_model.initial_uvr8d
    label: Initial UVR8D
    description: Initial level of UVR8D. Maps to SBML symbol `UVR8D`; exposed as a
      traceable initial-condition perturbation.
  outputs:
  - name: source_defined_cdcs_state
    maps_to: signaling_sbml_ouyang2014_photomorphogenic_uv_b_signalling_netw_biomd0000000545_model.source_defined_cdcs_state
    label: source-defined CDCS state
    description: source-defined CDCS state. Maps to SBML symbol `CDCS` and is emitted
      in native SBML units.
  - name: uvr8m
    maps_to: signaling_sbml_ouyang2014_photomorphogenic_uv_b_signalling_netw_biomd0000000545_model.uvr8m
    label: UVR8M
    description: UVR8M. Maps to SBML symbol `UVR8M` and is emitted in native SBML
      units.
  - name: source_defined_ucs_state
    maps_to: signaling_sbml_ouyang2014_photomorphogenic_uv_b_signalling_netw_biomd0000000545_model.source_defined_ucs_state
    label: source-defined UCS state
    description: source-defined UCS state. Maps to SBML symbol `UCS` and is emitted
      in native SBML units.
  - name: state
    maps_to: signaling_sbml_ouyang2014_photomorphogenic_uv_b_signalling_netw_biomd0000000545_model.state
    label: Observable state
  - name: summary
    maps_to: signaling_sbml_ouyang2014_photomorphogenic_uv_b_signalling_netw_biomd0000000545_model.summary
    label: Simulation summary
  - name: species_labels
    maps_to: signaling_sbml_ouyang2014_photomorphogenic_uv_b_signalling_netw_biomd0000000545_model.species_labels
    label: Observable labels
