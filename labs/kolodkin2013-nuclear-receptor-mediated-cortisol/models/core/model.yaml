description: 'Kolodkin2013 - Nuclear receptor-mediatedcortisol signalling network
  This model is described in the article: Optimization of stress response through
  the nuclear receptor-mediated cortisol signalling ne. It can be used to explore
  signaling dynamics and compare pathway response across conditions.'
