    label: Initial source-defined IX state
    description: Initial level of source-defined IX state. Maps to SBML symbol `IX`;
      exposed as a traceable initial-condition perturbation.
  outputs:
  - name: activated_clotting_factor_ix
    maps_to: signaling_sbml_zarnitsina1996_reactions_of_the_intrinsic_pathwa_model1806140001_model.activated_clotting_factor_ix
    label: activated clotting factor IX
    description: activated clotting factor IX. Maps to SBML symbol `IXa` and is emitted
      in native SBML units.
  - name: activated_clotting_factor_xi
    maps_to: signaling_sbml_zarnitsina1996_reactions_of_the_intrinsic_pathwa_model1806140001_model.activated_clotting_factor_xi
    label: activated clotting factor XI
    description: activated clotting factor XI. Maps to SBML symbol `XIa` and is emitted
      in native SBML units.
  - name: activated_clotting_factor_ix_at
    maps_to: signaling_sbml_zarnitsina1996_reactions_of_the_intrinsic_pathwa_model1806140001_model.activated_clotting_factor_ix_at
    label: activated clotting factor IX AT
    description: activated clotting factor IX AT. Maps to SBML symbol `IXa_AT` and
      is emitted in native SBML units.
  - name: state
    maps_to: signaling_sbml_zarnitsina1996_reactions_of_the_intrinsic_pathwa_model1806140001_model.state
    label: Observable state
  - name: summary
    maps_to: signaling_sbml_zarnitsina1996_reactions_of_the_intrinsic_pathwa_model1806140001_model.summary
    label: Simulation summary
  - name: species_labels
