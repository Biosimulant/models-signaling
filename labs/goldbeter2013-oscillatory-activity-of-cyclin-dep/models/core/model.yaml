  - name: active_cdc2_kinase
    maps_to: signaling_sbml_goldbeter2013_oscillatory_activity_of_cyclin_dep_biomd0000000944_model.active_cdc2_kinase
    label: active Cdc2 Kinase
    description: active Cdc2 Kinase. Maps to SBML symbol `Active_Cdc2_kinase` and
      is emitted in native SBML units.
  - name: active_apc
    maps_to: signaling_sbml_goldbeter2013_oscillatory_activity_of_cyclin_dep_biomd0000000944_model.active_apc
    label: active APC
    description: active APC. Maps to SBML symbol `Active_APC` and is emitted in native
      SBML units.
  - name: cyclin
    maps_to: signaling_sbml_goldbeter2013_oscillatory_activity_of_cyclin_dep_biomd0000000944_model.cyclin
    label: Cyclin
    description: Cyclin. Maps to SBML symbol `Cyclin` and is emitted in native SBML
      units.
  - name: state
