    description: Initial level of P50 Rel A N. Maps to SBML symbol `P0`; exposed as
      a traceable initial-condition perturbation.
  outputs:
  - name: ikk_complex
    maps_to: signaling_sbml_trares2022_canonical_nf_kb_pathway_petri_net_model2207210001_model.ikk_complex
    label: IKK Complex
    description: IKK Complex. Maps to SBML symbol `P12` and is emitted in native SBML
      units.
  - name: ikk_complex_activated
    maps_to: signaling_sbml_trares2022_canonical_nf_kb_pathway_petri_net_model2207210001_model.ikk_complex_activated
    label: IKK Complex Activated
    description: IKK Complex Activated. Maps to SBML symbol `P13` and is emitted in
      native SBML units.
  - name: p50_rel_a_n
    maps_to: signaling_sbml_trares2022_canonical_nf_kb_pathway_petri_net_model2207210001_model.p50_rel_a_n
    label: P50 Rel A N
    description: P50 Rel A N. Maps to SBML symbol `P0` and is emitted in native SBML
      units.
  - name: state
    maps_to: signaling_sbml_trares2022_canonical_nf_kb_pathway_petri_net_model2207210001_model.state
    label: Observable state
  - name: summary
    maps_to: signaling_sbml_trares2022_canonical_nf_kb_pathway_petri_net_model2207210001_model.summary
