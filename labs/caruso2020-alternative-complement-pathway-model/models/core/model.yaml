schema_version: '2.0'
title: Caruso2020 - Alternative Complement Pathway model
description: SBML export of the Alternative Complement Pathway model published by
  Caruso et al. It can be used to explore signaling dynamics and compare pathway response
  across conditions.
standard: other
tags:
- signaling
- systems
- systems-biology
- sbml
- faithful
- biomodels_ebi
- complement
authors:
- Biosimulant Team
- Caruso A
- Vollmer J
- Machacek M
- Kortvely E
upstream:
  id: biomodels_ebi:MODEL2206230002
  source_db: biomodels_ebi
  source_id: MODEL2206230002
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/MODEL2206230002
  download_url: https://www.ebi.ac.uk/biomodels/model/download/MODEL2206230002?filename=acp_model.xml
  license: CC0
biosim:
  entrypoint: src.caruso2020_alternative_complement_pathway_model:Caruso2020AlternativeComplementPathwayModelModel2206230002Model
  init_kwargs:
    model_path: data/MODEL2206230002.xml
    integration_step: 0.01
  communication_step: 0.1
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
io:
  inputs:
  - name: initial_k_el_c5a_level
    maps_to: signaling_sbml_caruso2020_alternative_complement_pathway_model_model2206230002_model.initial_k_el_c5a_level
    label: K El C5a
    description: K El C5a source parameter. Maps to SBML symbol `mw0eca22f3_9f69_4c28_8450_109dea301a7e`
      and preserves the bundled default.
  - name: initial_k_el_drug_level
    maps_to: signaling_sbml_caruso2020_alternative_complement_pathway_model_model2206230002_model.initial_k_el_drug_level
    label: K El Drug
    description: K El Drug source parameter. Maps to SBML symbol `mw2904b9f4_09fe_48f9_a742_05908528bc90`
      and preserves the bundled default.
  - name: initial_k_el_i_complement_c3b_level
    maps_to: signaling_sbml_caruso2020_alternative_complement_pathway_model_model2206230002_model.initial_k_el_i_complement_c3b_level
    label: K El I complement C3b
    description: K El I complement C3b source parameter. Maps to SBML symbol `mwf3fb9035_f67a_4a45_a797_5c11abaa0feb`
      and preserves the bundled default.
  outputs:
  - name: cn_ugm_l
    maps_to: signaling_sbml_caruso2020_alternative_complement_pathway_model_model2206230002_model.cn_ugm_l
    label: Cn Ugm L
    description: Cn Ugm L. Maps to SBML symbol `mw43392936_e299_4891_89da_819acae8a437`
      and is emitted in native SBML units.
  - name: erythrocytes_u_m
    maps_to: signaling_sbml_caruso2020_alternative_complement_pathway_model_model2206230002_model.erythrocytes_u_m
    label: Erythrocytes U M
    description: Erythrocytes U M. Maps to SBML symbol `mw69ef1201_c624_479d_9761_6839f82ca5fd`
      and is emitted in native SBML units.
  - name: erythrocytes_n_l
    maps_to: signaling_sbml_caruso2020_alternative_complement_pathway_model_model2206230002_model.erythrocytes_n_l
    label: Erythrocytes N L
    description: Erythrocytes N L. Maps to SBML symbol `mwb12eecaa_a5f3_4796_a6b0_621255476677`
      and is emitted in native SBML units.
  - name: state
    maps_to: signaling_sbml_caruso2020_alternative_complement_pathway_model_model2206230002_model.state
    label: Observable state
  - name: summary
    maps_to: signaling_sbml_caruso2020_alternative_complement_pathway_model_model2206230002_model.summary
    label: Simulation summary
  - name: species_labels
    maps_to: signaling_sbml_caruso2020_alternative_complement_pathway_model_model2206230002_model.species_labels
    label: Observable labels
