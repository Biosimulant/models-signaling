schema_version: '2.0'
title: Markevich2004_MAPK_orderedMM2kinases
description: The model describes the double phosphorylation of MAP kinase by an ordered
  mechanism using the Michaelis-Menten formalism. Two different enzymes, MAPKK1 and
  MAPKK2, successively phosphorylate the MAP.
