title: Bush2016 - Extended Carrousel model of GPCR-RGS
description: 'Bush2016 - Extended Carrousel model ofGPCR-RGS This model is described
  in the article: Yeast GPCR signaling reflects the fraction of occupied receptors,
  not the number. It can be used to explore signaling dynamics and compare pathway
  response across conditions.'
