- from: signaling_sbml_goldbeter1991_min_mit_oscil_expl_inact_biomd0000000004_model.summary
  to:
  - visualisation.signaling_sbml_goldbeter1991_min_mit_oscil_expl_inact_biomd0000000004_model_summary
- from: signaling_sbml_goldbeter1991_min_mit_oscil_expl_inact_biomd0000000004_model.species_labels
  to:
  - visualisation.signaling_sbml_goldbeter1991_min_mit_oscil_expl_inact_biomd0000000004_model_species_labels
runtime:
  duration: 1.0
  communication_step: 0.1
  initial_inputs: {}
tags:
- signaling
- systems
- systems-biology
- sbml
- faithful
- biomodels_ebi
- cell-cycle-signaling
io:
