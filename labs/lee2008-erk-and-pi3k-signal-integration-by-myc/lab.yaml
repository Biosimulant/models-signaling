    maps_to: signaling_sbml_lee2008_erk_and_pi3k_signal_integration_by_myc_biomd0000000818_model.akt
    label: AKT
    description: AKT. Maps to SBML symbol `AKT` and is emitted in native SBML units.
  - name: phosphorylated_akt
    maps_to: signaling_sbml_lee2008_erk_and_pi3k_signal_integration_by_myc_biomd0000000818_model.phosphorylated_akt
    label: phosphorylated AKT
    description: phosphorylated AKT. Maps to SBML symbol `AKTp` and is emitted in
