schema_version: '2.0'
title: Mueller2015 - Hepatocyte proliferation, T160 phosphorylation of CDK2
description: 'Mueller2015 - Hepatocyte proliferation, T160phosphorylation of CDK2
  This model is described in the article: T160-phosphorylated CDK2 defines threshold
  for HGF-dependent proliferation in primary hepato. It can be used to explore signaling
  dynamics and compare pathway response across conditions.'
