schema_version: '2.0'
package: bray1993-chemotaxis
version: 1.0.0
title: Bray1993_chemotaxis Lab
description: 'Clean Biosimulant lab for systems signaling model: Bray1993_chemotaxis.
  Values are native SBML quantities; equations, parameters, and initial values remain
  in the bundled source file.'
models:
- alias: signaling_sbml_bray1993_chemotaxis_biomd0000000404_model
  path: models/core
- alias: visualisation
  path: models/visualisation
wiring:
- from: signaling_sbml_bray1993_chemotaxis_biomd0000000404_model.state
  to:
  - visualisation.signaling_sbml_bray1993_chemotaxis_biomd0000000404_model_state
- from: signaling_sbml_bray1993_chemotaxis_biomd0000000404_model.summary
  to:
  - visualisation.signaling_sbml_bray1993_chemotaxis_biomd0000000404_model_summary
- from: signaling_sbml_bray1993_chemotaxis_biomd0000000404_model.species_labels
  to:
  - visualisation.signaling_sbml_bray1993_chemotaxis_biomd0000000404_model_species_labels
runtime:
  duration: 1.0
  communication_step: 0.1
  initial_inputs: {}
tags:
- signaling
- systems
- systems-biology
- sbml
- faithful
- biomodels_ebi
- gpcr
io:
  inputs:
  - name: initial_aspartate_ligand
    maps_to: signaling_sbml_bray1993_chemotaxis_biomd0000000404_model.initial_aspartate_ligand
    label: Initial aspartate ligand
    description: Initial level of aspartate ligand. Maps to SBML symbol `asp`; exposed
      as a traceable initial-condition perturbation.
  - name: initial_atp
    maps_to: signaling_sbml_bray1993_chemotaxis_biomd0000000404_model.initial_atp
    label: Initial ATP
    description: Initial level of ATP. Maps to SBML symbol `species_1`; exposed as
      a traceable initial-condition perturbation.
  - name: initial_source_defined_ni_state
    maps_to: signaling_sbml_bray1993_chemotaxis_biomd0000000404_model.initial_source_defined_ni_state
    label: Initial source-defined NI state
    description: Initial level of source-defined NI state. Maps to SBML symbol `ni`;
      exposed as a traceable initial-condition perturbation.
  outputs:
  - name: aspartate_ligand
    maps_to: signaling_sbml_bray1993_chemotaxis_biomd0000000404_model.aspartate_ligand
    label: aspartate ligand
    description: aspartate ligand. Maps to SBML symbol `asp` and is emitted in native
      SBML units.
  - name: total_aspartate_bound_receptor
    maps_to: signaling_sbml_bray1993_chemotaxis_biomd0000000404_model.total_aspartate_bound_receptor
    label: total aspartate-bound receptor
    description: total aspartate-bound receptor. Maps to SBML symbol `Tasp` and is
      emitted in native SBML units.
  - name: total_inactive_receptor_state_ni
    maps_to: signaling_sbml_bray1993_chemotaxis_biomd0000000404_model.total_inactive_receptor_state_ni
    label: total inactive receptor state Ni
    description: total inactive receptor state Ni. Maps to SBML symbol `Tni` and is
      emitted in native SBML units.
  - name: state
    maps_to: signaling_sbml_bray1993_chemotaxis_biomd0000000404_model.state
    label: Observable state
  - name: summary
    maps_to: signaling_sbml_bray1993_chemotaxis_biomd0000000404_model.summary
    label: Simulation summary
  - name: species_labels
    maps_to: signaling_sbml_bray1993_chemotaxis_biomd0000000404_model.species_labels
    label: Observable labels
