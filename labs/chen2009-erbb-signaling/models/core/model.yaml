schema_version: '2.0'
title: Chen2009 - ErbB Signaling
description: This is A431 IERMv1.0 model described in the article Input-output behavior
  of ErbB signaling pathways as revealed by a mass action model trained against dynamic
  data. It can be used to explore signaling dynamics and compare pathway response
  across conditions.
standard: other
tags:
- signaling
- systems
- systems-biology
- sbml
- faithful
- biomodels_ebi
- cellular-signaling
authors:
- Biosimulant Team
- William W Chen
- Birgit Schoeberl
- Paul J Jasper
- Mario Niepel
- Ulrik B Nielsen
upstream:
  id: biomodels_ebi:BIOMD0000000255
  source_db: biomodels_ebi
  source_id: BIOMD0000000255
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/BIOMD0000000255
  download_url: https://www.ebi.ac.uk/biomodels/model/download/BIOMD0000000255?filename=BIOMD0000000255_url.xml
  license: CC0
biosim:
  entrypoint: src.chen2009_erbb_signaling:Chen2009ErbbSignalingBiomd0000000255Model
  init_kwargs:
    model_path: data/BIOMD0000000255.xml
    integration_step: 0.01
  communication_step: 0.1
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
io:
  inputs:
  - name: initial_egf
    maps_to: signaling_sbml_chen2009_erbb_signaling_biomd0000000255_model.initial_egf
    label: Initial EGF
    description: Initial level of EGF. Maps to SBML symbol `c1`; exposed as a traceable
      initial-condition perturbation.
  - name: initial_heregulin
    maps_to: signaling_sbml_chen2009_erbb_signaling_biomd0000000255_model.initial_heregulin
    label: Initial heregulin
    description: Initial level of heregulin. Maps to SBML symbol `c515`; exposed as
      a traceable initial-condition perturbation.
  - name: initial_heregulin_2
    maps_to: signaling_sbml_chen2009_erbb_signaling_biomd0000000255_model.initial_heregulin_2
    label: Initial heregulin
    description: Initial level of heregulin. Maps to SBML symbol `c514`; exposed as
      a traceable initial-condition perturbation.
  outputs:
  - name: source_2_egf_erb_b1_atp_full_active
    maps_to: signaling_sbml_chen2009_erbb_signaling_biomd0000000255_model.source_2_egf_erb_b1_atp_full_active
    label: 2 EGF Erb B1 ATP Full active
    description: 2 EGF Erb B1 ATP Full active. Maps to SBML symbol `c116` and is emitted
      in native SBML units.
  - name: source_2_egf_erb_b1_p_gap_grb2_adapter_protein_sos_guanine_nucleotide_exchange_factor_ras_gdp
    maps_to: signaling_sbml_chen2009_erbb_signaling_biomd0000000255_model.source_2_egf_erb_b1_p_gap_grb2_adapter_protein_sos_guanine_nucleotide_exchange_factor_ras_gdp
    label: 2 EGF Erb B1 P GAP Grb2 adapter protein SOS guanine-nucleotide exchange
      factor RAS GDP
    description: 2 EGF Erb B1 P GAP Grb2 adapter protein SOS guanine-nucleotide exchange
      factor RAS GDP. Maps to SBML symbol `c27` and is emitted in native SBML units.
  - name: source_2_egf_erb_b1_p_gap_grb2_adapter_protein_sos_guanine_nucleotide_exchange_factor_ras_gdp_c_pp
    maps_to: signaling_sbml_chen2009_erbb_signaling_biomd0000000255_model.source_2_egf_erb_b1_p_gap_grb2_adapter_protein_sos_guanine_nucleotide_exchange_factor_ras_gdp_c_pp
    label: 2 EGF Erb B1 P GAP Grb2 adapter protein SOS guanine-nucleotide exchange
      factor RAS GDP C PP
    description: 2 EGF Erb B1 P GAP Grb2 adapter protein SOS guanine-nucleotide exchange
      factor RAS GDP C PP. Maps to SBML symbol `c89` and is emitted in native SBML
      units.
  - name: state
    maps_to: signaling_sbml_chen2009_erbb_signaling_biomd0000000255_model.state
    label: Observable state
  - name: summary
    maps_to: signaling_sbml_chen2009_erbb_signaling_biomd0000000255_model.summary
    label: Simulation summary
  - name: species_labels
    maps_to: signaling_sbml_chen2009_erbb_signaling_biomd0000000255_model.species_labels
    label: Observable labels
