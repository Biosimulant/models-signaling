schema_version: '2.0'
title: Sobotta2017 - IL-6-induced JAK1-STAT3-signaling
description: Here we present a mathematical model of IL-6-induced JAK1-STAT3 signaling
  that quantitatively links physiological IL-6 concentrations to the dynamics of IL-6-induced
  signal transduction and expression. It can be used to explore signaling dynamics
  and compare pathway response across conditions.
