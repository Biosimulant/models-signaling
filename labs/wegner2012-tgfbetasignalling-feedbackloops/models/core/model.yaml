      units.
  - name: state
    maps_to: signaling_sbml_wegner2012_tgfbetasignalling_feedbackloops_biomd0000000410_model.state
    label: Observable state
  - name: summary
    maps_to: signaling_sbml_wegner2012_tgfbetasignalling_feedbackloops_biomd0000000410_model.summary
    label: Simulation summary
  - name: species_labels
    maps_to: signaling_sbml_wegner2012_tgfbetasignalling_feedbackloops_biomd0000000410_model.species_labels
    label: Observable labels
