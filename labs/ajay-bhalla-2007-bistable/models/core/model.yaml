  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/MODEL9147091146
  download_url: https://www.ebi.ac.uk/biomodels/model/download/MODEL9147091146?filename=MODEL9147091146_url.xml
  license: CC0
biosim:
  entrypoint: src.ajay_bhalla_2007_bistable:AjayBhalla2007BistableModel9147091146Model
  init_kwargs:
    model_path: data/MODEL9147091146.xml
    integration_step: 0.01
  communication_step: 0.1
runtime:
