schema_version: '2.0'
title: Zi2011_TGF-beta_Pathway Lab
description: Clean Biosimulant lab for developmental and growth-control signaling.
  Values are native SBML quantities; equations, parameters, and initial values remain
  in the bundled source file.
models:
- alias: signaling_sbml_zi2011_tgf_beta_pathway_biomd0000000342_model
  path: models/core
- alias: visualisation
  path: models/visualisation
wiring:
- from: signaling_sbml_zi2011_tgf_beta_pathway_biomd0000000342_model.state
  to:
  - visualisation.signaling_sbml_zi2011_tgf_beta_pathway_biomd0000000342_model_state
- from: signaling_sbml_zi2011_tgf_beta_pathway_biomd0000000342_model.summary
  to:
  - visualisation.signaling_sbml_zi2011_tgf_beta_pathway_biomd0000000342_model_summary
- from: signaling_sbml_zi2011_tgf_beta_pathway_biomd0000000342_model.species_labels
  to:
  - visualisation.signaling_sbml_zi2011_tgf_beta_pathway_biomd0000000342_model_species_labels
runtime:
  duration: 1.0
  communication_step: 0.1
  initial_inputs: {}
tags:
- signaling
- systems
- systems-biology
- sbml
- faithful
- biomodels_ebi
- tgf-beta
io:
  inputs:
  - name: initial_kdeg_tgf_beta_response_parameter_level
    maps_to: signaling_sbml_zi2011_tgf_beta_pathway_biomd0000000342_model.initial_kdeg_tgf_beta_response_parameter_level
    label: Kdeg TGF beta response parameter
    description: Kdeg TGF beta response parameter source parameter. Maps to SBML symbol
      `kdeg_TGF_beta` and preserves the bundled default.
  - name: initial_empty_degraded
    maps_to: signaling_sbml_zi2011_tgf_beta_pathway_biomd0000000342_model.initial_empty_degraded
    label: Initial Empty Degraded
    description: Initial level of Empty Degraded. Maps to SBML symbol `empty_degraded`;
      exposed as a traceable initial-condition perturbation.
  - name: initial_source_defined_aa_state
    maps_to: signaling_sbml_zi2011_tgf_beta_pathway_biomd0000000342_model.initial_source_defined_aa_state
    label: Initial source-defined AA state
    description: Initial level of source-defined AA state. Maps to SBML symbol `AA`;
      exposed as a traceable initial-condition perturbation.
  outputs:
  - name: smad2c
    maps_to: signaling_sbml_zi2011_tgf_beta_pathway_biomd0000000342_model.smad2c
    label: Smad2c
    description: Smad2c. Maps to SBML symbol `Smad2c` and is emitted in native SBML
      units.
  - name: smad2n
    maps_to: signaling_sbml_zi2011_tgf_beta_pathway_biomd0000000342_model.smad2n
    label: Smad2n
    description: Smad2n. Maps to SBML symbol `Smad2n` and is emitted in native SBML
      units.
  - name: smad4c
    maps_to: signaling_sbml_zi2011_tgf_beta_pathway_biomd0000000342_model.smad4c
    label: Smad4c
    description: Smad4c. Maps to SBML symbol `Smad4c` and is emitted in native SBML
      units.
  - name: state
    maps_to: signaling_sbml_zi2011_tgf_beta_pathway_biomd0000000342_model.state
    label: Observable state
  - name: summary
    maps_to: signaling_sbml_zi2011_tgf_beta_pathway_biomd0000000342_model.summary
    label: Simulation summary
  - name: species_labels
    maps_to: signaling_sbml_zi2011_tgf_beta_pathway_biomd0000000342_model.species_labels
    label: Observable labels
