schema_version: '2.0'
package: trares2022-canonical-nf-kb-pathway-petri-net
version: 1.0.0
title: Trares2022 - Canonical NF-kB pathway, Petri net Lab
description: Clean Biosimulant lab for NF-kB pathway signaling. Values are native
