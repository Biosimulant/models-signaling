schema_version: '2.0'
title: Hammaren-Geissen2022_PPToP_Model12
description: The model encodes the general biological process of protein synthesis
  and post-translational modification (PTM, such as protein phosphorylation), viewed
  through the eyes of a specific, widely-used exp. It can be used to explore signaling
  dynamics and compare pathway response across conditions.
standard: other
tags:
- signaling
- systems
- systems-biology
- sbml
- faithful
- biomodels_ebi
- cellular-signaling
authors:
- Biosimulant Team
- Henrik M Hammarén
- Eva-Maria Geissen
- Clement M Potel
- Martin Beck
- Mikhail M Savitski
upstream:
  id: biomodels_ebi:BIOMD0000001078
  source_db: biomodels_ebi
  source_id: BIOMD0000001078
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/BIOMD0000001078
  download_url: https://www.ebi.ac.uk/biomodels/model/download/BIOMD0000001078?filename=Hammaren-Geissen2022_PPToP_Model12_withParameterSets.xml
  license: CC0
biosim:
  entrypoint: src.hammaren_geissen2022_pptop_model12:HammarenGeissen2022PptopModel12Biomd0000001078Model
  init_kwargs:
    model_path: data/BIOMD0000001078.xml
    integration_step: 0.01
  communication_step: 0.1
