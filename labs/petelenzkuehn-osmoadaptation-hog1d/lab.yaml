    maps_to: signaling_sbml_petelenzkuehn_osmoadaptation_hog1d_biomd0000000606_model.initial_t_stress_level
    label: T Stress
    description: T Stress source parameter. Maps to SBML symbol `t_stress` and preserves
      the bundled default.
  - name: initial_glucose_e
    maps_to: signaling_sbml_petelenzkuehn_osmoadaptation_hog1d_biomd0000000606_model.initial_glucose_e
    label: Initial Glucose E
    description: Initial level of Glucose E. Maps to SBML symbol `glucose_e`; exposed
