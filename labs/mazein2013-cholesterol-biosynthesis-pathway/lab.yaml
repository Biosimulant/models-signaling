schema_version: '2.0'
package: mazein2013-cholesterol-biosynthesis-pathway
version: 1.0.0
title: Mazein2013 - Cholesterol biosynthesis pathway Lab
description: Clean Biosimulant lab for metabolic and hormone-linked signaling. Values
  are native SBML quantities; equations, parameters, and initial values remain in
  the bundled source file.
models:
- alias: signaling_sbml_mazein2013_cholesterol_biosynthesis_pathway_model1409170000_model
  path: models/core
- alias: visualisation
  path: models/visualisation
wiring:
- from: signaling_sbml_mazein2013_cholesterol_biosynthesis_pathway_model1409170000_model.state
  to:
  - visualisation.signaling_sbml_mazein2013_cholesterol_biosynthesis_pathway_model1409170000_model_state
- from: signaling_sbml_mazein2013_cholesterol_biosynthesis_pathway_model1409170000_model.summary
  to:
  - visualisation.signaling_sbml_mazein2013_cholesterol_biosynthesis_pathway_model1409170000_model_summary
- from: signaling_sbml_mazein2013_cholesterol_biosynthesis_pathway_model1409170000_model.species_labels
  to:
  - visualisation.signaling_sbml_mazein2013_cholesterol_biosynthesis_pathway_model1409170000_model_species_labels
runtime:
  duration: 1.0
  communication_step: 0.1
  initial_inputs: {}
tags:
- signaling
- systems
- systems-biology
- sbml
- faithful
- biomodels_ebi
- metabolic-signaling
io:
  inputs:
  - name: initial_acety_co_a
    maps_to: signaling_sbml_mazein2013_cholesterol_biosynthesis_pathway_model1409170000_model.initial_acety_co_a
    label: Initial Acety Co A
    description: Initial level of Acety Co A. Maps to SBML symbol `s1`; exposed as
      a traceable initial-condition perturbation.
  outputs:
  - name: source_defined_acat2_state
    maps_to: signaling_sbml_mazein2013_cholesterol_biosynthesis_pathway_model1409170000_model.source_defined_acat2_state
    label: source-defined ACAT2 state
    description: source-defined ACAT2 state. Maps to SBML symbol `s80` and is emitted
      in native SBML units.
  - name: acety_co_a
    maps_to: signaling_sbml_mazein2013_cholesterol_biosynthesis_pathway_model1409170000_model.acety_co_a
    label: Acety Co A
    description: Acety Co A. Maps to SBML symbol `s1` and is emitted in native SBML
      units.
  - name: acetoacetyl_co_a
    maps_to: signaling_sbml_mazein2013_cholesterol_biosynthesis_pathway_model1409170000_model.acetoacetyl_co_a
    label: Acetoacetyl Co A
    description: Acetoacetyl Co A. Maps to SBML symbol `s2` and is emitted in native
      SBML units.
  - name: state
    maps_to: signaling_sbml_mazein2013_cholesterol_biosynthesis_pathway_model1409170000_model.state
    label: Observable state
  - name: summary
    maps_to: signaling_sbml_mazein2013_cholesterol_biosynthesis_pathway_model1409170000_model.summary
    label: Simulation summary
  - name: species_labels
    maps_to: signaling_sbml_mazein2013_cholesterol_biosynthesis_pathway_model1409170000_model.species_labels
    label: Observable labels
