    maps_to: signaling_sbml_goldbeter1991_min_mit_oscil_expl_inact_biomd0000000004_model.initial_cyclin
    label: Initial Cyclin
    description: Initial level of Cyclin. Maps to SBML symbol `C`; exposed as a traceable
      initial-condition perturbation.
  outputs:
  - name: active_cdc_2_kinase
    maps_to: signaling_sbml_goldbeter1991_min_mit_oscil_expl_inact_biomd0000000004_model.active_cdc_2_kinase
    label: active CDC 2 Kinase
    description: active CDC 2 Kinase. Maps to SBML symbol `M` and is emitted in native
      SBML units.
  - name: active_cyclin_protease
    maps_to: signaling_sbml_goldbeter1991_min_mit_oscil_expl_inact_biomd0000000004_model.active_cyclin_protease
