    maps_to: signaling_sbml_sharp2013_lipopolysaccharide_induced_nfkb_activa_biomd0000000489_model.initial_cd14
    label: Initial CD14
    description: Initial level of CD14. Maps to SBML symbol `species_1`; exposed as
      a traceable initial-condition perturbation.
  - name: initial_source_defined_irak4_state
    maps_to: signaling_sbml_sharp2013_lipopolysaccharide_induced_nfkb_activa_biomd0000000489_model.initial_source_defined_irak4_state
    label: Initial source-defined IRAK4 state
    description: Initial level of source-defined IRAK4 state. Maps to SBML symbol
      `species_2`; exposed as a traceable initial-condition perturbation.
  - name: initial_source_defined_lbp_state
    maps_to: signaling_sbml_sharp2013_lipopolysaccharide_induced_nfkb_activa_biomd0000000489_model.initial_source_defined_lbp_state
    label: Initial source-defined LBP state
    description: Initial level of source-defined LBP state. Maps to SBML symbol `species_3`;
      exposed as a traceable initial-condition perturbation.
  outputs:
  - name: source_defined_tnfa_state
    maps_to: signaling_sbml_sharp2013_lipopolysaccharide_induced_nfkb_activa_biomd0000000489_model.source_defined_tnfa_state
    label: source-defined TNFA state
