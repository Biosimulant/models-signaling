schema_version: '2.0'
title: Amara2013 - PCNA ubiquitylation in the activation of PRR pathway
description: Mechanistic model of the Post-Replication Repair (PRR), the pathway involved
  in the bypass of DNA lesions induced by sunlight exposure and UV radiation. It can
  be used to explore signaling dynamics and compare pathway response across conditions.
standard: other
