schema_version: '2.0'
package: goldbeter2007-somitogenesis-switch
version: 1.0.0
title: Goldbeter2007_Somitogenesis_Switch Lab
description: 'Clean Biosimulant lab for systems signaling model: Goldbeter2007_Somitogenesis_Switch.
  Values are native SBML quantities; equations, parameters, and initial values remain
  in the bundled source file.'
models:
- alias: signaling_sbml_goldbeter2007_somitogenesis_switch_biomd0000000275_model
  path: models/core
- alias: visualisation
  path: models/visualisation
wiring:
- from: signaling_sbml_goldbeter2007_somitogenesis_switch_biomd0000000275_model.state
  to:
  - visualisation.signaling_sbml_goldbeter2007_somitogenesis_switch_biomd0000000275_model_state
- from: signaling_sbml_goldbeter2007_somitogenesis_switch_biomd0000000275_model.summary
  to:
  - visualisation.signaling_sbml_goldbeter2007_somitogenesis_switch_biomd0000000275_model_summary
- from: signaling_sbml_goldbeter2007_somitogenesis_switch_biomd0000000275_model.species_labels
  to:
  - visualisation.signaling_sbml_goldbeter2007_somitogenesis_switch_biomd0000000275_model_species_labels
runtime:
  duration: 1.0
  communication_step: 0.1
  initial_inputs: {}
tags:
- signaling
- systems
- systems-biology
- sbml
- faithful
- biomodels_ebi
- cellular-signaling
io:
  inputs:
  - name: initial_source_defined_ra_state
    maps_to: signaling_sbml_goldbeter2007_somitogenesis_switch_biomd0000000275_model.initial_source_defined_ra_state
    label: Initial source-defined RA state
    description: Initial level of source-defined RA state. Maps to SBML symbol `RA`;
      exposed as a traceable initial-condition perturbation.
  outputs:
  - name: cyp26_m_rna
    maps_to: signaling_sbml_goldbeter2007_somitogenesis_switch_biomd0000000275_model.cyp26_m_rna
    label: Cyp26 M RNA
    description: Cyp26 M RNA. Maps to SBML symbol `M_C` and is emitted in native SBML
      units.
  - name: cyp26
    maps_to: signaling_sbml_goldbeter2007_somitogenesis_switch_biomd0000000275_model.cyp26
    label: CYP26
    description: CYP26. Maps to SBML symbol `C` and is emitted in native SBML units.
  - name: source_defined_fgf_state
    maps_to: signaling_sbml_goldbeter2007_somitogenesis_switch_biomd0000000275_model.source_defined_fgf_state
    label: source-defined FGF state
    description: source-defined FGF state. Maps to SBML symbol `F` and is emitted
      in native SBML units.
  - name: state
    maps_to: signaling_sbml_goldbeter2007_somitogenesis_switch_biomd0000000275_model.state
    label: Observable state
  - name: summary
    maps_to: signaling_sbml_goldbeter2007_somitogenesis_switch_biomd0000000275_model.summary
    label: Simulation summary
  - name: species_labels
    maps_to: signaling_sbml_goldbeter2007_somitogenesis_switch_biomd0000000275_model.species_labels
    label: Observable labels
