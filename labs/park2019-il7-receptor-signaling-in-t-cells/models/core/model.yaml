schema_version: '2.0'
title: Park2019 - IL7 receptor signaling in T cells
description: This model is an attempt to provide a mathematical description of IL-7
  dependent T cell homeostasis at the molecular and cellular level, with inclusion
  of gamma-chain and ligand binding in the context. It can be used to explore signaling
  dynamics and compare pathway response across conditions.
standard: other
tags:
- signaling
