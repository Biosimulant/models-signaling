- systems-biology
- sbml
- faithful
- biomodels_ebi
- gpcr
authors:
- Biosimulant Team
- Domitille Heitzler
- Guillaume Durand
- Nathalie Gallay
- Aurélien Rizk
- Seungkirl Ahn
upstream:
  id: biomodels_ebi:BIOMD0000000842
  source_db: biomodels_ebi
  source_id: BIOMD0000000842
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/BIOMD0000000842
  download_url: https://www.ebi.ac.uk/biomodels/model/download/BIOMD0000000842?filename=MODEL1012080000.xml
  license: CC0
biosim:
  entrypoint: src.heitzler2012_gpcr_signalling:Heitzler2012GpcrSignallingBiomd0000000842Model
  init_kwargs:
    model_path: data/BIOMD0000000842.xml
    integration_step: 0.01
  communication_step: 0.1
runtime:
