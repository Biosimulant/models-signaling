  - name: source_4_alpha_carboxy_4_beta_response_parameter_methylzymosterol
    maps_to: signaling_sbml_mazein2013_shunt_pathway_model1409170003_model.source_4_alpha_carboxy_4_beta_response_parameter_methylzymosterol
