schema_version: '2.0'
title: Bhattacharya2014 - A mathematical model of the sterol regulatory element binding
  protein 2 cholesterol biosynthesis pathway
description: This is a deterministic nonlinear ordinary differential equation mathematical
  model of the sterol regulatory element binding protein 2 (SREBP-2) cholesterol genetic
  regulatory pathway in a hepatocyte. It can be used to explore signaling dynamics
  and compare pathway response across conditions.
standard: other
tags:
- signaling
- systems
- systems-biology
- sbml
- faithful
- biomodels_ebi
- gpcr
- metabolic-signaling
authors:
