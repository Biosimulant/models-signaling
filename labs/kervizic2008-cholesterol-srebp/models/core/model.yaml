schema_version: '2.0'
title: Kervizic2008_Cholesterol_SREBP
description: Model of cholesterol regulation (with Boolean Formulae) (2008) This model
  is described in Dynamical modeling of the cholesterol regulatory pathway with Boolean
  networks ; Gwenael Kervizic and Laurent. It can be used to explore signaling dynamics
  and compare pathway response across conditions.
