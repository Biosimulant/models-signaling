  - name: intracellular_concentration_input
    maps_to: signaling_sbml_petelenzkuehn_osmoadaptation_hog1d_biomd0000000606_model.intracellular_concentration_input
    label: intracellular concentration input
    description: intracellular concentration input. Maps to SBML symbol `cin` and
      is emitted in native SBML units.
  - name: glucose_i
    maps_to: signaling_sbml_petelenzkuehn_osmoadaptation_hog1d_biomd0000000606_model.glucose_i
