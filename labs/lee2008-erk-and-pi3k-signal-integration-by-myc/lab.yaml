  - name: erk
    maps_to: signaling_sbml_lee2008_erk_and_pi3k_signal_integration_by_myc_biomd0000000818_model.erk
    label: ERK
    description: ERK. Maps to SBML symbol `ERK` and is emitted in native SBML units.
  - name: state
    maps_to: signaling_sbml_lee2008_erk_and_pi3k_signal_integration_by_myc_biomd0000000818_model.state
    label: Observable state
  - name: summary
    maps_to: signaling_sbml_lee2008_erk_and_pi3k_signal_integration_by_myc_biomd0000000818_model.summary
    label: Simulation summary
  - name: species_labels
