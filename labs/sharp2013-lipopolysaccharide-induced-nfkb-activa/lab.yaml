schema_version: '2.0'
package: sharp2013-lipopolysaccharide-induced-nfkb-activa
version: 1.0.0
title: Sharp2013 - Lipopolysaccharide induced NFkB activation Lab
description: Clean Biosimulant lab for NF-kB pathway signaling. Values are native
  SBML quantities; equations, parameters, and initial values remain in the bundled
  source file.
models:
- alias: signaling_sbml_sharp2013_lipopolysaccharide_induced_nfkb_activa_biomd0000000489_model
  path: models/core
- alias: visualisation
  path: models/visualisation
wiring:
- from: signaling_sbml_sharp2013_lipopolysaccharide_induced_nfkb_activa_biomd0000000489_model.state
  to:
  - visualisation.signaling_sbml_sharp2013_lipopolysaccharide_induced_nfkb_activa_biomd0000000489_model_state
- from: signaling_sbml_sharp2013_lipopolysaccharide_induced_nfkb_activa_biomd0000000489_model.summary
  to:
  - visualisation.signaling_sbml_sharp2013_lipopolysaccharide_induced_nfkb_activa_biomd0000000489_model_summary
- from: signaling_sbml_sharp2013_lipopolysaccharide_induced_nfkb_activa_biomd0000000489_model.species_labels
  to:
  - visualisation.signaling_sbml_sharp2013_lipopolysaccharide_induced_nfkb_activa_biomd0000000489_model_species_labels
runtime:
  duration: 1.0
  communication_step: 0.1
  initial_inputs: {}
tags:
- signaling
- systems
- systems-biology
- sbml
- faithful
- biomodels_ebi
- nfkb
- tlr-signaling
io:
