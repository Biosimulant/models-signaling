    description: Initial level of Rho Agdp. Maps to SBML symbol `RhoAgdp`; exposed
      as a traceable initial-condition perturbation.
  outputs:
  - name: actinf
    maps_to: signaling_sbml_hetmanski2021_rear_retraction_kinetic_model2103010001_model.actinf
    label: Actinf
    description: Actinf. Maps to SBML symbol `Actinf` and is emitted in native SBML
      units.
  - name: p_mlca
    maps_to: signaling_sbml_hetmanski2021_rear_retraction_kinetic_model2103010001_model.p_mlca
    label: P Mlca
    description: P Mlca. Maps to SBML symbol `pMLCa` and is emitted in native SBML
      units.
  - name: cavi_src
    maps_to: signaling_sbml_hetmanski2021_rear_retraction_kinetic_model2103010001_model.cavi_src
    label: Cavi Src
    description: Cavi Src. Maps to SBML symbol `Cavi_Src` and is emitted in native
      SBML units.
  - name: state
    maps_to: signaling_sbml_hetmanski2021_rear_retraction_kinetic_model2103010001_model.state
    label: Observable state
  - name: summary
    maps_to: signaling_sbml_hetmanski2021_rear_retraction_kinetic_model2103010001_model.summary
    label: Simulation summary
  - name: species_labels
    maps_to: signaling_sbml_hetmanski2021_rear_retraction_kinetic_model2103010001_model.species_labels
    label: Observable labels
