    description: Glucose I. Maps to SBML symbol `glucose_i` and is emitted in native
      SBML units.
  - name: state
    maps_to: signaling_sbml_petelenzkuehn_osmoadaptation_hog1d_biomd0000000606_model.state
    label: Observable state
  - name: summary
    maps_to: signaling_sbml_petelenzkuehn_osmoadaptation_hog1d_biomd0000000606_model.summary
    label: Simulation summary
  - name: species_labels
    maps_to: signaling_sbml_petelenzkuehn_osmoadaptation_hog1d_biomd0000000606_model.species_labels
    label: Observable labels
