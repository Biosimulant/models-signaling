schema_version: '2.0'
package: muller2008-simplified-mapk-activation-dynamics-m
version: 1.0.0
title: Muller2008 - Simplified MAPK activation Dynamics (Model B) Lab
description: Clean Biosimulant lab for MAPK/ERK receptor signaling. Values are native
  SBML quantities; equations, parameters, and initial values remain in the bundled
  source file.
models:
- alias: signaling_sbml_muller2008_simplified_mapk_activation_dynamics_m_biomd0000000664_model
  path: models/core
- alias: visualisation
  path: models/visualisation
wiring:
- from: signaling_sbml_muller2008_simplified_mapk_activation_dynamics_m_biomd0000000664_model.state
  to:
  - visualisation.signaling_sbml_muller2008_simplified_mapk_activation_dynamics_m_biomd0000000664_model_state
- from: signaling_sbml_muller2008_simplified_mapk_activation_dynamics_m_biomd0000000664_model.summary
  to:
  - visualisation.signaling_sbml_muller2008_simplified_mapk_activation_dynamics_m_biomd0000000664_model_summary
- from: signaling_sbml_muller2008_simplified_mapk_activation_dynamics_m_biomd0000000664_model.species_labels
  to:
  - visualisation.signaling_sbml_muller2008_simplified_mapk_activation_dynamics_m_biomd0000000664_model_species_labels
runtime:
  duration: 1.0
  communication_step: 0.1
  initial_inputs: {}
tags:
- signaling
- systems
- systems-biology
- sbml
- faithful
- biomodels_ebi
- mapk
io:
  inputs:
  - name: initial_source_defined_g1_state
    maps_to: signaling_sbml_muller2008_simplified_mapk_activation_dynamics_m_biomd0000000664_model.initial_source_defined_g1_state
    label: Initial source-defined G1 state
    description: Initial level of source-defined G1 state. Maps to SBML symbol `g1_0`;
      exposed as a traceable initial-condition perturbation.
  - name: initial_source_defined_g2_state
    maps_to: signaling_sbml_muller2008_simplified_mapk_activation_dynamics_m_biomd0000000664_model.initial_source_defined_g2_state
    label: Initial source-defined G2 state
    description: Initial level of source-defined G2 state. Maps to SBML symbol `g2_0`;
      exposed as a traceable initial-condition perturbation.
  outputs:
  - name: mapk
    maps_to: signaling_sbml_muller2008_simplified_mapk_activation_dynamics_m_biomd0000000664_model.mapk
    label: MAPK
    description: MAPK. Maps to SBML symbol `MAPK` and is emitted in native SBML units.
  - name: c_raf_inactive
    maps_to: signaling_sbml_muller2008_simplified_mapk_activation_dynamics_m_biomd0000000664_model.c_raf_inactive
    label: C RAF Inactive
    description: C RAF Inactive. Maps to SBML symbol `C_Raf_inactive` and is emitted
      in native SBML units.
  - name: source_defined_fgfr_state
    maps_to: signaling_sbml_muller2008_simplified_mapk_activation_dynamics_m_biomd0000000664_model.source_defined_fgfr_state
    label: source-defined FGFR state
    description: source-defined FGFR state. Maps to SBML symbol `FGFR` and is emitted
      in native SBML units.
  - name: state
    maps_to: signaling_sbml_muller2008_simplified_mapk_activation_dynamics_m_biomd0000000664_model.state
    label: Observable state
  - name: summary
    maps_to: signaling_sbml_muller2008_simplified_mapk_activation_dynamics_m_biomd0000000664_model.summary
    label: Simulation summary
  - name: species_labels
    maps_to: signaling_sbml_muller2008_simplified_mapk_activation_dynamics_m_biomd0000000664_model.species_labels
    label: Observable labels
