  - name: tnfa_tnf_receptor_1_traf2_tradd_rip1
    maps_to: signaling_sbml_sharp2013_lipopolysaccharide_induced_nfkb_activa_biomd0000000489_model.tnfa_tnf_receptor_1_traf2_tradd_rip1
    label: Tnfa TNF receptor 1 TRAF2 TRADD RIP1
    description: Tnfa TNF receptor 1 TRAF2 TRADD RIP1. Maps to SBML symbol `species_28`
      and is emitted in native SBML units.
  - name: state
    maps_to: signaling_sbml_sharp2013_lipopolysaccharide_induced_nfkb_activa_biomd0000000489_model.state
    label: Observable state
  - name: summary
    maps_to: signaling_sbml_sharp2013_lipopolysaccharide_induced_nfkb_activa_biomd0000000489_model.summary
    label: Simulation summary
  - name: species_labels
    maps_to: signaling_sbml_sharp2013_lipopolysaccharide_induced_nfkb_activa_biomd0000000489_model.species_labels
