schema_version: '2.0'
title: Goldbeter1991 - Min Mit Oscil
description: Goldbeter1991 - Min Mit Oscil Minimal cascade model for the mitotic oscillator
  involving cyclin and cdc2 kinase. It can be used to explore signaling dynamics and
  compare pathway response across conditions.
standard: other
tags:
- signaling
- systems
- systems-biology
- sbml
- faithful
- biomodels_ebi
- cell-cycle-signaling
authors:
- Biosimulant Team
- A Goldbeter
upstream:
  id: biomodels_ebi:BIOMD0000000003
  source_db: biomodels_ebi
  source_id: BIOMD0000000003
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/BIOMD0000000003
  download_url: https://www.ebi.ac.uk/biomodels/model/download/BIOMD0000000003?filename=BIOMD0000000003_url.xml
  license: CC0
biosim:
  entrypoint: src.goldbeter1991_min_mit_oscil:Goldbeter1991MinMitOscilBiomd0000000003Model
  init_kwargs:
    model_path: data/BIOMD0000000003.xml
    integration_step: 0.01
  communication_step: 0.1
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
io:
  inputs:
  - name: initial_cyclin
    maps_to: signaling_sbml_goldbeter1991_min_mit_oscil_biomd0000000003_model.initial_cyclin
    label: Initial Cyclin
    description: Initial level of Cyclin. Maps to SBML symbol `C`; exposed as a traceable
      initial-condition perturbation.
  outputs:
  - name: cyclin
    maps_to: signaling_sbml_goldbeter1991_min_mit_oscil_biomd0000000003_model.cyclin
    label: Cyclin
    description: Cyclin. Maps to SBML symbol `C` and is emitted in native SBML units.
  - name: cdc_2_kinase
    maps_to: signaling_sbml_goldbeter1991_min_mit_oscil_biomd0000000003_model.cdc_2_kinase
    label: CDC 2 Kinase
    description: CDC 2 Kinase. Maps to SBML symbol `M` and is emitted in native SBML
      units.
  - name: cyclin_protease
    maps_to: signaling_sbml_goldbeter1991_min_mit_oscil_biomd0000000003_model.cyclin_protease
    label: Cyclin Protease
    description: Cyclin Protease. Maps to SBML symbol `X` and is emitted in native
      SBML units.
  - name: state
    maps_to: signaling_sbml_goldbeter1991_min_mit_oscil_biomd0000000003_model.state
    label: Observable state
  - name: summary
    maps_to: signaling_sbml_goldbeter1991_min_mit_oscil_biomd0000000003_model.summary
    label: Simulation summary
  - name: species_labels
    maps_to: signaling_sbml_goldbeter1991_min_mit_oscil_biomd0000000003_model.species_labels
    label: Observable labels
