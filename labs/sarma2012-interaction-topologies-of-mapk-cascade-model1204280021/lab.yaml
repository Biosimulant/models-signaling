schema_version: '2.0'
title: Sarma2012 - Interaction topologies of MAPK cascade (M1_K2_PSEQ) Lab
description: Clean Biosimulant lab for MAPK/ERK receptor signaling. Values are native
  SBML quantities; equations, parameters, and initial values remain in the bundled
  source file.
models:
- alias: signaling_sbml_sarma2012_interaction_topologies_of_mapk_cascade_model1204280021_model
  path: models/core
- alias: visualisation
  path: models/visualisation
wiring:
- from: signaling_sbml_sarma2012_interaction_topologies_of_mapk_cascade_model1204280021_model.state
  to:
  - visualisation.signaling_sbml_sarma2012_interaction_topologies_of_mapk_cascade_model1204280021_model_state
- from: signaling_sbml_sarma2012_interaction_topologies_of_mapk_cascade_model1204280021_model.summary
  to:
  - visualisation.signaling_sbml_sarma2012_interaction_topologies_of_mapk_cascade_model1204280021_model_summary
- from: signaling_sbml_sarma2012_interaction_topologies_of_mapk_cascade_model1204280021_model.species_labels
  to:
  - visualisation.signaling_sbml_sarma2012_interaction_topologies_of_mapk_cascade_model1204280021_model_species_labels
runtime:
  duration: 1.0
  communication_step: 0.1
  initial_inputs: {}
tags:
- signaling
- systems
- systems-biology
- sbml
- faithful
- biomodels_ebi
- mapk
io:
  inputs:
  - name: initial_map_kinase
    maps_to: signaling_sbml_sarma2012_interaction_topologies_of_mapk_cascade_model1204280021_model.initial_map_kinase
    label: Initial MAP kinase
    description: Initial level of MAP kinase. Maps to SBML symbol `species_1`; exposed
      as a traceable initial-condition perturbation.
  outputs:
  - name: mapk_kinase_pp
    maps_to: signaling_sbml_sarma2012_interaction_topologies_of_mapk_cascade_model1204280021_model.mapk_kinase_pp
    label: MAPK kinase PP
    description: MAPK kinase PP. Maps to SBML symbol `species_2` and is emitted in
      native SBML units.
  - name: map_kinase_mapk_kinase_pp
    maps_to: signaling_sbml_sarma2012_interaction_topologies_of_mapk_cascade_model1204280021_model.map_kinase_mapk_kinase_pp
    label: MAP kinase MAPK kinase PP
    description: MAP kinase MAPK kinase PP. Maps to SBML symbol `species_3` and is
      emitted in native SBML units.
  - name: source_defined_mk_p_state
    maps_to: signaling_sbml_sarma2012_interaction_topologies_of_mapk_cascade_model1204280021_model.source_defined_mk_p_state
    label: source-defined MK-P state
    description: source-defined MK-P state. Maps to SBML symbol `species_4` and is
      emitted in native SBML units.
  - name: state
    maps_to: signaling_sbml_sarma2012_interaction_topologies_of_mapk_cascade_model1204280021_model.state
    label: Observable state
  - name: summary
    maps_to: signaling_sbml_sarma2012_interaction_topologies_of_mapk_cascade_model1204280021_model.summary
    label: Simulation summary
  - name: species_labels
    maps_to: signaling_sbml_sarma2012_interaction_topologies_of_mapk_cascade_model1204280021_model.species_labels
    label: Observable labels
