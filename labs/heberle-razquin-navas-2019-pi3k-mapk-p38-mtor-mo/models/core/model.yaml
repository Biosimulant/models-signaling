schema_version: '2.0'
title: Heberle-Razquin Navas-2019 - PI3K-MAPK/p38-mTOR Model V
description: Model V simulating stress induction with stress inputs on PI3K, Akt-pS473
  and mTORC1. The model scheme is depicted in Figure S11 and the simulations are shown
  in Figure S12.
standard: other
tags:
- signaling
- systems
- systems-biology
- sbml
- faithful
- biomodels_ebi
- mapk
- pi3k-akt
- mtor
- stress-response
authors:
- Biosimulant Team
- Alexander Martin Heberle
- Patricia Razquin Navas
- Miriam Langelaar-Makkinje
- Katharina Kasack
- Ahmed Sadik
upstream:
  id: biomodels_ebi:MODEL1902140002
  source_db: biomodels_ebi
  source_id: MODEL1902140002
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/MODEL1902140002
  download_url: https://www.ebi.ac.uk/biomodels/model/download/MODEL1902140002?filename=Heberle-RazquinNavas-2019_model_V.xml
  license: CC0
biosim:
  entrypoint: src.heberle_razquin_navas_2019_pi3k_mapk_p38_mtor_mo:HeberleRazquinNavas2019Pi3kMapkP38MtorMoModel1902140002Model
  init_kwargs:
    model_path: data/MODEL1902140002.xml
    integration_step: 0.01
  communication_step: 0.1
