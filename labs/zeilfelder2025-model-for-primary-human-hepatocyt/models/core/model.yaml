    maps_to: signaling_sbml_zeilfelder2025_model_for_primary_human_hepatocyt_model2503270002_model.initial_input_apap_level
    label: Input Apap
    description: Input Apap source parameter. Maps to SBML symbol `input_apap` and
      preserves the bundled default.
  - name: initial_input_cyclo_level
    maps_to: signaling_sbml_zeilfelder2025_model_for_primary_human_hepatocyt_model2503270002_model.initial_input_cyclo_level
    label: Input Cyclo
    description: Input Cyclo source parameter. Maps to SBML symbol `input_cyclo` and
      preserves the bundled default.
  - name: initial_input_dcf_level
    maps_to: signaling_sbml_zeilfelder2025_model_for_primary_human_hepatocyt_model2503270002_model.initial_input_dcf_level
    label: Input Dcf
    description: Input Dcf source parameter. Maps to SBML symbol `input_dcf` and preserves
      the bundled default.
  outputs:
  - name: inactive_receptor
    maps_to: signaling_sbml_zeilfelder2025_model_for_primary_human_hepatocyt_model2503270002_model.inactive_receptor
    label: Inactive Receptor
    description: Inactive Receptor. Maps to SBML symbol `JAK1_gp130` and is emitted
      in native SBML units.
  - name: total_phosphorylated_receptor
    maps_to: signaling_sbml_zeilfelder2025_model_for_primary_human_hepatocyt_model2503270002_model.total_phosphorylated_receptor
    label: Total Phosphorylated Receptor
    description: Total Phosphorylated Receptor. Maps to SBML symbol `pJAK1_pgp130`
      and is emitted in native SBML units.
  - name: unphosphorylated_stat3
    maps_to: signaling_sbml_zeilfelder2025_model_for_primary_human_hepatocyt_model2503270002_model.unphosphorylated_stat3
    label: Unphosphorylated STAT3
    description: Unphosphorylated STAT3. Maps to SBML symbol `STAT3` and is emitted
      in native SBML units.
  - name: state
    maps_to: signaling_sbml_zeilfelder2025_model_for_primary_human_hepatocyt_model2503270002_model.state
    label: Observable state
  - name: summary
