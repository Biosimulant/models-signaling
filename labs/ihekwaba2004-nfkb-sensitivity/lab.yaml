schema_version: '2.0'
package: ihekwaba2004-nfkb-sensitivity
version: 1.0.0
title: Ihekwaba2004_NFkB_Sensitivity Lab
description: Clean Biosimulant lab for NF-kB pathway signaling. Values are native
  SBML quantities; equations, parameters, and initial values remain in the bundled
  source file.
models:
- alias: signaling_sbml_ihekwaba2004_nfkb_sensitivity_biomd0000000230_model
  path: models/core
- alias: visualisation
  path: models/visualisation
wiring:
- from: signaling_sbml_ihekwaba2004_nfkb_sensitivity_biomd0000000230_model.state
  to:
  - visualisation.signaling_sbml_ihekwaba2004_nfkb_sensitivity_biomd0000000230_model_state
- from: signaling_sbml_ihekwaba2004_nfkb_sensitivity_biomd0000000230_model.summary
  to:
  - visualisation.signaling_sbml_ihekwaba2004_nfkb_sensitivity_biomd0000000230_model_summary
- from: signaling_sbml_ihekwaba2004_nfkb_sensitivity_biomd0000000230_model.species_labels
  to:
  - visualisation.signaling_sbml_ihekwaba2004_nfkb_sensitivity_biomd0000000230_model_species_labels
runtime:
  duration: 1.0
  communication_step: 0.1
  initial_inputs: {}
tags:
- signaling
- systems
- systems-biology
- sbml
- faithful
- biomodels_ebi
- nfkb
io:
  inputs:
  - name: initial_sink_species
    maps_to: signaling_sbml_ihekwaba2004_nfkb_sensitivity_biomd0000000230_model.initial_sink_species
    label: Initial sink species
    description: Initial level of sink species. Maps to SBML symbol `sink`; exposed
      as a traceable initial-condition perturbation.
  - name: initial_source
    maps_to: signaling_sbml_ihekwaba2004_nfkb_sensitivity_biomd0000000230_model.initial_source
    label: Initial Source
    description: Initial level of Source. Maps to SBML symbol `source`; exposed as
      a traceable initial-condition perturbation.
  outputs:
  - name: nfkb
    maps_to: signaling_sbml_ihekwaba2004_nfkb_sensitivity_biomd0000000230_model.nfkb
    label: NF-kB
    description: NF-kB. Maps to SBML symbol `NFkB` and is emitted in native SBML units.
  - name: ikkik_ba_nfk_b
    maps_to: signaling_sbml_ihekwaba2004_nfkb_sensitivity_biomd0000000230_model.ikkik_ba_nfk_b
    label: Ikkik Ba Nfk B
    description: Ikkik Ba Nfk B. Maps to SBML symbol `IKKIkBaNFkB` and is emitted
      in native SBML units.
  - name: ikkik_complement_factor_bb_nfk_b
    maps_to: signaling_sbml_ihekwaba2004_nfkb_sensitivity_biomd0000000230_model.ikkik_complement_factor_bb_nfk_b
    label: Ikkik complement factor Bb Nfk B
    description: Ikkik complement factor Bb Nfk B. Maps to SBML symbol `IKKIkBbNFkB`
      and is emitted in native SBML units.
  - name: state
    maps_to: signaling_sbml_ihekwaba2004_nfkb_sensitivity_biomd0000000230_model.state
    label: Observable state
  - name: summary
    maps_to: signaling_sbml_ihekwaba2004_nfkb_sensitivity_biomd0000000230_model.summary
    label: Simulation summary
  - name: species_labels
    maps_to: signaling_sbml_ihekwaba2004_nfkb_sensitivity_biomd0000000230_model.species_labels
    label: Observable labels
