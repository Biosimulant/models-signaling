description: 'This is an SBML implementation the model of the activator inhibitor
  oscillator (figure 2b) described in the article: Sniffers, buzzers, toggles and
  blinkers: dynamics of regulatory and signaling pathw. It can be used to explore
  signaling dynamics and compare pathway response across conditions.'
