- from: signaling_sbml_ouyang2014_photomorphogenic_uv_b_signalling_netw_biomd0000000545_model.summary
  to:
  - visualisation.signaling_sbml_ouyang2014_photomorphogenic_uv_b_signalling_netw_biomd0000000545_model_summary
- from: signaling_sbml_ouyang2014_photomorphogenic_uv_b_signalling_netw_biomd0000000545_model.species_labels
  to:
  - visualisation.signaling_sbml_ouyang2014_photomorphogenic_uv_b_signalling_netw_biomd0000000545_model_species_labels
runtime:
