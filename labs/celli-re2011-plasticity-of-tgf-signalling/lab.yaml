    maps_to: signaling_sbml_celli_re2011_plasticity_of_tgf_signalling_biomd0000000600_model.initial_tgf_beta
    label: Initial TGF-beta
    description: Initial level of TGF-beta. Maps to SBML symbol `TGFb`; exposed as
      a traceable initial-condition perturbation.
  - name: initial_i_smad_tgf_beta_tgf_beta_r_p
    maps_to: signaling_sbml_celli_re2011_plasticity_of_tgf_signalling_biomd0000000600_model.initial_i_smad_tgf_beta_tgf_beta_r_p
    label: Initial I SMAD TGF-beta TGF-beta R P
    description: Initial level of I SMAD TGF-beta TGF-beta R P. Maps to SBML symbol
      `I_Smad_TGFb_TGFbR_P`; exposed as a traceable initial-condition perturbation.
  - name: initial_tgf_beta_tgf_beta_r
    maps_to: signaling_sbml_celli_re2011_plasticity_of_tgf_signalling_biomd0000000600_model.initial_tgf_beta_tgf_beta_r
    label: Initial TGF-beta TGF-beta R
    description: Initial level of TGF-beta TGF-beta R. Maps to SBML symbol `TGFb_TGFbR`;
      exposed as a traceable initial-condition perturbation.
  outputs:
  - name: i_smad_tgf_beta_tgf_beta_r_p
    maps_to: signaling_sbml_celli_re2011_plasticity_of_tgf_signalling_biomd0000000600_model.i_smad_tgf_beta_tgf_beta_r_p
    label: I SMAD TGF-beta TGF-beta R P
    description: I SMAD TGF-beta TGF-beta R P. Maps to SBML symbol `I_Smad_TGFb_TGFbR_P`
      and is emitted in native SBML units.
  - name: smad
    maps_to: signaling_sbml_celli_re2011_plasticity_of_tgf_signalling_biomd0000000600_model.smad
    label: SMAD
    description: SMAD. Maps to SBML symbol `Smad` and is emitted in native SBML units.
  - name: smad_p
    maps_to: signaling_sbml_celli_re2011_plasticity_of_tgf_signalling_biomd0000000600_model.smad_p
    label: SMAD P
    description: SMAD P. Maps to SBML symbol `Smad_P` and is emitted in native SBML
      units.
  - name: state
    maps_to: signaling_sbml_celli_re2011_plasticity_of_tgf_signalling_biomd0000000600_model.state
    label: Observable state
  - name: summary
    maps_to: signaling_sbml_celli_re2011_plasticity_of_tgf_signalling_biomd0000000600_model.summary
    label: Simulation summary
  - name: species_labels
    maps_to: signaling_sbml_celli_re2011_plasticity_of_tgf_signalling_biomd0000000600_model.species_labels
