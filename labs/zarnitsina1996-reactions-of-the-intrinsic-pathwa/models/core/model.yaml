schema_version: '2.0'
title: Zarnitsina1996 - Reactions of the Intrinsic Pathway of Blood Coagulation
description: Model listing the reactions of the intrinsic pathway as listed in Zarnitsina1996.
  Publication model is a spatio-termporal mathematical model of blood coagulation.Model
  used as the example of the numer.
standard: other
tags:
- signaling
- systems
- systems-biology
- sbml
