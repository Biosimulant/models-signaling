  - name: acetyl_co_a_c_acetyltransferase_gene
    maps_to: signaling_sbml_kervizic2008_cholesterol_srebp_model0568648427_model.acetyl_co_a_c_acetyltransferase_gene
    label: Acetyl Co A C Acetyltransferase Gene
    description: Acetyl Co A C Acetyltransferase Gene. Maps to SBML symbol `s12` and
      is emitted in native SBML units.
  - name: acetyl_co_a_c_acetyltransferase_rna
    maps_to: signaling_sbml_kervizic2008_cholesterol_srebp_model0568648427_model.acetyl_co_a_c_acetyltransferase_rna
