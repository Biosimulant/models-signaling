      initial-condition perturbation.
  - name: initial_ip3
    maps_to: signaling_sbml_ajay_bhalla_2007_bistable_model9147091146_model.initial_ip3
    label: Initial IP3
    description: Initial level of IP3. Maps to SBML symbol `IP3`; exposed as a traceable
      initial-condition perturbation.
  outputs:
  - name: calcium_bound_pkc
    maps_to: signaling_sbml_ajay_bhalla_2007_bistable_model9147091146_model.calcium_bound_pkc
    label: Calcium bound PKC
    description: Calcium bound PKC. Maps to SBML symbol `PKC_slash_PKC_minus_Ca` and
