schema_version: '2.0'
title: Brannmark2010_InsulinSignalling_Mifamodel
description: 'This model is from the article: Mass and information feedbacks through
  receptor endocytosis govern insulin signaling as revealed using a parameter-free
  modeling framework. It can be used to explore signaling dynamics and compare pathway
  response across conditions.'
standard: other
tags:
- signaling
- systems
- systems-biology
- sbml
- faithful
- biomodels_ebi
- gpcr
- metabolic-signaling
- hormone-signaling
authors:
- Biosimulant Team
- Cecilia Brännmark
- Robert Palmér
- S Torkel Glad
- Gunnar Cedersund
- Peter Strålfors
upstream:
  id: biomodels_ebi:BIOMD0000000343
  source_db: biomodels_ebi
  source_id: BIOMD0000000343
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/BIOMD0000000343
  download_url: https://www.ebi.ac.uk/biomodels/model/download/BIOMD0000000343?filename=BIOMD0000000343_url.xml
  license: CC0
biosim:
  entrypoint: src.brannmark2010_insulinsignalling_mifamodel:Brannmark2010InsulinsignallingMifamodelBiomd0000000343Model
  init_kwargs:
    model_path: data/BIOMD0000000343.xml
    integration_step: 0.01
  communication_step: 0.1
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
io:
  inputs:
  - name: initial_internalized_insulin_receptor_amount
    maps_to: signaling_sbml_brannmark2010_insulinsignalling_mifamodel_biomd0000000343_model.initial_internalized_insulin_receptor_amount
    label: Initial internalized insulin receptor amount
    description: Initial level of internalized insulin receptor amount. Maps to SBML
      symbol `intamount`; exposed as a traceable initial-condition perturbation.
  - name: initial_internalized_insulin_receptor
    maps_to: signaling_sbml_brannmark2010_insulinsignalling_mifamodel_biomd0000000343_model.initial_internalized_insulin_receptor
    label: Initial internalized insulin receptor
    description: Initial level of internalized insulin receptor. Maps to SBML symbol
      `IRi`; exposed as a traceable initial-condition perturbation.
  - name: initial_insulin_bound_insulin_receptor
    maps_to: signaling_sbml_brannmark2010_insulinsignalling_mifamodel_biomd0000000343_model.initial_insulin_bound_insulin_receptor
    label: Initial insulin-bound insulin receptor
    description: Initial level of insulin-bound insulin receptor. Maps to SBML symbol
      `IRins`; exposed as a traceable initial-condition perturbation.
  outputs:
  - name: insulin_bound_insulin_receptor
    maps_to: signaling_sbml_brannmark2010_insulinsignalling_mifamodel_biomd0000000343_model.insulin_bound_insulin_receptor
    label: insulin-bound insulin receptor
    description: insulin-bound insulin receptor. Maps to SBML symbol `IRins` and is
      emitted in native SBML units.
  - name: phosphorylated_insulin_receptor
    maps_to: signaling_sbml_brannmark2010_insulinsignalling_mifamodel_biomd0000000343_model.phosphorylated_insulin_receptor
    label: phosphorylated insulin receptor
    description: phosphorylated insulin receptor. Maps to SBML symbol `IRp` and is
      emitted in native SBML units.
  - name: internalized_phosphorylated_insulin_receptor
    maps_to: signaling_sbml_brannmark2010_insulinsignalling_mifamodel_biomd0000000343_model.internalized_phosphorylated_insulin_receptor
    label: internalized phosphorylated insulin receptor
    description: internalized phosphorylated insulin receptor. Maps to SBML symbol
      `IRip` and is emitted in native SBML units.
  - name: state
    maps_to: signaling_sbml_brannmark2010_insulinsignalling_mifamodel_biomd0000000343_model.state
    label: Observable state
  - name: summary
    maps_to: signaling_sbml_brannmark2010_insulinsignalling_mifamodel_biomd0000000343_model.summary
    label: Simulation summary
  - name: species_labels
    maps_to: signaling_sbml_brannmark2010_insulinsignalling_mifamodel_biomd0000000343_model.species_labels
    label: Observable labels
