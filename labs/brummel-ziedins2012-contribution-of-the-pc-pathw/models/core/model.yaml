schema_version: '2.0'
title: Brummel-Ziedins2012 - Contribution of the PC pathway to thrombin generation
description: Mathematical model of the blood coagulation cascade including meizothrombin,
  protein C, thrombomodulin, factor VIIIa fragments, partially proteolyzed factor
  Va species and inactive factor Va fragments. It can be used to explore signaling
  dynamics and compare pathway response across conditions.
standard: other
