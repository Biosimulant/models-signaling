schema_version: '2.0'
title: Perrett2014 - GnRH pulse, ERK activity
description: Signaling Perrett2014Gnrh Pulse Erk Activity Model1509050002Model captures
  signaling perrett2014 gnrh pulse erk activity behavior in the context of signaling,
  sbml, biomodels_ebi using a biomodels_ebi-sourced O. When you run it, you can observe
  state and evaluate how the modeled system changes across runs.
standard: other
tags:
- signaling
- systems
- systems-biology
- sbml
- faithful
- biomodels_ebi
- mapk
- ras-erk
authors:
- Biosimulant Team
- Rebecca M Perrett
- Margaritis Voliotis
- Stephen P Armstrong
- Robert C Fowkes
- George R Pope
upstream:
  id: biomodels_ebi:MODEL1509050002
  source_db: biomodels_ebi
  source_id: MODEL1509050002
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/MODEL1509050002
  download_url: https://www.ebi.ac.uk/biomodels/model/download/MODEL1509050002?filename=MODEL1509050002_url.xml
  license: CC0
biosim:
  entrypoint: src.perrett2014_gnrh_pulse_erk_activity:Perrett2014GnrhPulseErkActivityModel1509050002Model
  init_kwargs:
    model_path: data/MODEL1509050002.xml
    integration_step: 0.01
  communication_step: 0.1
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
io:
  inputs:
  - name: initial_hr_inact
    maps_to: signaling_sbml_perrett2014_gnrh_pulse_erk_activity_model1509050002_model.initial_hr_inact
    label: Initial HR Inact
    description: Initial level of HR Inact. Maps to SBML symbol `species_11`; exposed
      as a traceable initial-condition perturbation.
  - name: initial_mek_act
    maps_to: signaling_sbml_perrett2014_gnrh_pulse_erk_activity_model1509050002_model.initial_mek_act
    label: Initial MEK Act
    description: Initial level of MEK Act. Maps to SBML symbol `species_14`; exposed
      as a traceable initial-condition perturbation.
  - name: initial_p_erk_c
    maps_to: signaling_sbml_perrett2014_gnrh_pulse_erk_activity_model1509050002_model.initial_p_erk_c
    label: Initial P ERK C
    description: Initial level of P ERK C. Maps to SBML symbol `species_13`; exposed
      as a traceable initial-condition perturbation.
  outputs:
  - name: nuclear_phosphorylated_erk
    maps_to: signaling_sbml_perrett2014_gnrh_pulse_erk_activity_model1509050002_model.nuclear_phosphorylated_erk
    label: nuclear phosphorylated ERK
    description: nuclear phosphorylated ERK. Maps to SBML symbol `species_1` and is
      emitted in native SBML units.
  - name: pp_erk_n
    maps_to: signaling_sbml_perrett2014_gnrh_pulse_erk_activity_model1509050002_model.pp_erk_n
    label: Pp ERK N
    description: Pp ERK N. Maps to SBML symbol `species_2` and is emitted in native
      SBML units.
  - name: cytosolic_phosphorylated_erk
    maps_to: signaling_sbml_perrett2014_gnrh_pulse_erk_activity_model1509050002_model.cytosolic_phosphorylated_erk
    label: cytosolic phosphorylated ERK
    description: cytosolic phosphorylated ERK. Maps to SBML symbol `species_6` and
      is emitted in native SBML units.
  - name: state
    maps_to: signaling_sbml_perrett2014_gnrh_pulse_erk_activity_model1509050002_model.state
    label: Observable state
  - name: summary
    maps_to: signaling_sbml_perrett2014_gnrh_pulse_erk_activity_model1509050002_model.summary
    label: Simulation summary
  - name: species_labels
    maps_to: signaling_sbml_perrett2014_gnrh_pulse_erk_activity_model1509050002_model.species_labels
    label: Observable labels
