  - name: active_tgf_beta_tgfr1_tgfr2
    maps_to: signaling_sbml_strasen2018_tgfb_smad_signalling_class_4_biomd0000001001_model.active_tgf_beta_tgfr1_tgfr2
    label: active TGF-beta TGFR1 TGFR2
