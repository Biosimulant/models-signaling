schema_version: '2.0'
title: Ajay_Bhalla_2007_PKM
description: This is a non-bistable model of ERKII signaling that also incorporates
  PKM synthesis triggered by Ca influx. It is a simplified variant of the model of
  &lt;a href = 'http://www.ncbi.nlm.nih.gov/entrez.
standard: other
tags:
- signaling
- systems
- systems-biology
- sbml
- faithful
- biomodels_ebi
- cellular-signaling
authors:
- Biosimulant Team
- Sriram M Ajay
- Upinder S Bhalla
upstream:
  id: biomodels_ebi:MODEL9147232940
  source_db: biomodels_ebi
  source_id: MODEL9147232940
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/MODEL9147232940
  download_url: https://www.ebi.ac.uk/biomodels/model/download/MODEL9147232940?filename=MODEL9147232940_url.xml
  license: CC0
biosim:
  entrypoint: src.ajay_bhalla_2007_pkm:AjayBhalla2007PkmModel9147232940Model
  init_kwargs:
    model_path: data/MODEL9147232940.xml
    integration_step: 0.01
  communication_step: 0.1
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
io:
  inputs:
  - name: initial_calcium_input
    maps_to: signaling_sbml_ajay_bhalla_2007_pkm_model9147232940_model.initial_calcium_input
    label: Initial calcium Input
    description: Initial level of calcium Input. Maps to SBML symbol `Ca_input`; exposed
      as a traceable initial-condition perturbation.
  - name: initial_dag
    maps_to: signaling_sbml_ajay_bhalla_2007_pkm_model9147232940_model.initial_dag
    label: Initial DAG
    description: Initial level of DAG. Maps to SBML symbol `DAG`; exposed as a traceable
      initial-condition perturbation.
  - name: initial_active_pkc
    maps_to: signaling_sbml_ajay_bhalla_2007_pkm_model9147232940_model.initial_active_pkc
    label: Initial active PKC
    description: Initial level of active PKC. Maps to SBML symbol `PKC_minus_active`;
      exposed as a traceable initial-condition perturbation.
  outputs:
  - name: calcium_bound_pkc
    maps_to: signaling_sbml_ajay_bhalla_2007_pkm_model9147232940_model.calcium_bound_pkc
    label: Calcium bound PKC
    description: Calcium bound PKC. Maps to SBML symbol `PKC_slash_PKC_minus_Ca` and
      is emitted in native SBML units.
  - name: membrane_active_calcium_bound_pkc
    maps_to: signaling_sbml_ajay_bhalla_2007_pkm_model9147232940_model.membrane_active_calcium_bound_pkc
    label: Membrane active Calcium bound PKC
    description: Membrane active Calcium bound PKC. Maps to SBML symbol `PKC_slash_PKC_minus_Ca_minus_memb_star_`
      and is emitted in native SBML units.
  - name: calcium_and_dag_bound_pkc
    maps_to: signaling_sbml_ajay_bhalla_2007_pkm_model9147232940_model.calcium_and_dag_bound_pkc
    label: Calcium And DAG bound PKC
    description: Calcium And DAG bound PKC. Maps to SBML symbol `PKC_slash_PKC_minus_Ca_minus_DAG`
      and is emitted in native SBML units.
  - name: state
    maps_to: signaling_sbml_ajay_bhalla_2007_pkm_model9147232940_model.state
    label: Observable state
  - name: summary
    maps_to: signaling_sbml_ajay_bhalla_2007_pkm_model9147232940_model.summary
    label: Simulation summary
  - name: species_labels
    maps_to: signaling_sbml_ajay_bhalla_2007_pkm_model9147232940_model.species_labels
    label: Observable labels
