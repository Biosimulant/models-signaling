    maps_to: signaling_sbml_hayashi1999_nosynth_phospho_model4780784080_model.nos_calcium_calcium_mn_nos
    label: NOS Calcium Calcium Mn NOS
    description: NOS Calcium Calcium Mn NOS. Maps to SBML symbol `NOS_slash_Ca_minus_CaMnNOS`
      and is emitted in native SBML units.
  - name: nos_calcium_calcium_mn_nos_kenz_kenz_cplx
