schema_version: '2.0'
title: Markevich2004_MAPK_phosphoRandomMM
description: The model corresponds to the schema 3 of Markevich et al 2004, as described
  in the figure 2 and the supplementary table S3, and modelled using Michaelis-Menten
  like kinetics. It can be used to explore signaling dynamics and compare pathway
  response across conditions.
standard: other
tags:
- signaling
- systems
- systems-biology
- sbml
- faithful
- biomodels_ebi
- mapk
authors:
- Biosimulant Team
- Nick I Markevich
- Jan B Hoek
- Boris N Kholodenko
upstream:
  id: biomodels_ebi:BIOMD0000000029
  source_db: biomodels_ebi
  source_id: BIOMD0000000029
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/BIOMD0000000029
  download_url: https://www.ebi.ac.uk/biomodels/model/download/BIOMD0000000029?filename=BIOMD0000000029_url.xml
  license: CC0
biosim:
  entrypoint: src.markevich2004_mapk_phosphorandommm:Markevich2004MapkPhosphorandommmBiomd0000000029Model
  init_kwargs:
    model_path: data/BIOMD0000000029.xml
    integration_step: 0.01
  communication_step: 0.1
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
io:
  inputs:
  - name: initial_erk
    maps_to: signaling_sbml_markevich2004_mapk_phosphorandommm_biomd0000000029_model.initial_erk
    label: Initial ERK
    description: Initial level of ERK. Maps to SBML symbol `M`; exposed as a traceable
      initial-condition perturbation.
  outputs:
  - name: erk
    maps_to: signaling_sbml_markevich2004_mapk_phosphorandommm_biomd0000000029_model.erk
    label: ERK
    description: ERK. Maps to SBML symbol `M` and is emitted in native SBML units.
  - name: erk_py
    maps_to: signaling_sbml_markevich2004_mapk_phosphorandommm_biomd0000000029_model.erk_py
    label: ERK PY
    description: ERK PY. Maps to SBML symbol `MpY` and is emitted in native SBML units.
  - name: erk_pt
    maps_to: signaling_sbml_markevich2004_mapk_phosphorandommm_biomd0000000029_model.erk_pt
    label: ERK PT
    description: ERK PT. Maps to SBML symbol `MpT` and is emitted in native SBML units.
  - name: state
    maps_to: signaling_sbml_markevich2004_mapk_phosphorandommm_biomd0000000029_model.state
    label: Observable state
  - name: summary
    maps_to: signaling_sbml_markevich2004_mapk_phosphorandommm_biomd0000000029_model.summary
    label: Simulation summary
  - name: species_labels
    maps_to: signaling_sbml_markevich2004_mapk_phosphorandommm_biomd0000000029_model.species_labels
    label: Observable labels
