schema_version: '2.0'
title: Caruso2020 - Activation of the alternative complement pathway and effects on
  hemolysis
description: This model is based on the publication:Caruso A, Vollmer J, Machacek
  M, Kortvely E. 'Modeling the activation of the alternative complement pathway and
  its effects on hemolysis in health and disease.'.
standard: other
tags:
- signaling
- systems
- systems-biology
- sbml
- faithful
- biomodels_ebi
- complement
authors:
- Biosimulant Team
- Antonello Caruso
- Jannik Vollmer
- Matthias Machacek
- Elod Kortvely
upstream:
  id: biomodels_ebi:MODEL2109110001
  source_db: biomodels_ebi
  source_id: MODEL2109110001
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/MODEL2109110001
  download_url: https://www.ebi.ac.uk/biomodels/model/download/MODEL2109110001?filename=Caruso2020.xml
  license: CC0
biosim:
  entrypoint: src.caruso2020_activation_of_the_alternative_complem:Caruso2020ActivationOfTheAlternativeComplemModel2109110001Model
  init_kwargs:
    model_path: data/MODEL2109110001.xml
    integration_step: 0.01
  communication_step: 0.1
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
io:
  inputs:
  - name: initial_complement_c3
    maps_to: signaling_sbml_caruso2020_activation_of_the_alternative_complem_model2109110001_model.initial_complement_c3
    label: Initial complement C3
    description: Initial level of complement C3. Maps to SBML symbol `C3`; exposed
      as a traceable initial-condition perturbation.
  outputs:
  - name: nf_complement_c3b
    maps_to: signaling_sbml_caruso2020_activation_of_the_alternative_complem_model2109110001_model.nf_complement_c3b
    label: Nf complement C3b
    description: Nf complement C3b. Maps to SBML symbol `nfC3b` and is emitted in
      native SBML units.
  - name: complement_c3_h2o_fluid
    maps_to: signaling_sbml_caruso2020_activation_of_the_alternative_complem_model2109110001_model.complement_c3_h2o_fluid
    label: complement C3 H2O Fluid
    description: complement C3 H2O Fluid. Maps to SBML symbol `C3_H2O__fluid` and
      is emitted in native SBML units.
  - name: complement_c3_h2o_b_fluid
    maps_to: signaling_sbml_caruso2020_activation_of_the_alternative_complem_model2109110001_model.complement_c3_h2o_b_fluid
    label: complement C3 H2O B Fluid
    description: complement C3 H2O B Fluid. Maps to SBML symbol `C3_H2O_B_fluid` and
      is emitted in native SBML units.
  - name: state
    maps_to: signaling_sbml_caruso2020_activation_of_the_alternative_complem_model2109110001_model.state
    label: Observable state
  - name: summary
    maps_to: signaling_sbml_caruso2020_activation_of_the_alternative_complem_model2109110001_model.summary
    label: Simulation summary
  - name: species_labels
    maps_to: signaling_sbml_caruso2020_activation_of_the_alternative_complem_model2109110001_model.species_labels
    label: Observable labels
