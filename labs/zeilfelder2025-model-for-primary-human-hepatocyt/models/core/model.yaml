schema_version: '2.0'
title: Zeilfelder2025 - Model for primary human hepatocytes (PHH)
description: Mathematical multi-compartment model described by sets of coupled ordinary
  differential equations (ODEs) for studying the IL6 and SMAD signaling in PHH cells.
  It can be used to explore signaling dynamics and compare pathway response across
  conditions.
standard: other
tags:
- signaling
- systems
- systems-biology
- sbml
- faithful
- biomodels_ebi
- cytokine-signaling
- interleukin-signaling
- smad
authors:
- Biosimulant Team
- Anja Zeilfelder
- Joep Vanlier
- Christina Mölders
- Philipp Kastl
- Barbara Helm
upstream:
  id: biomodels_ebi:MODEL2503270002
  source_db: biomodels_ebi
  source_id: MODEL2503270002
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/MODEL2503270002
  download_url: https://www.ebi.ac.uk/biomodels/model/download/MODEL2503270002?filename=PHH_model.xml
  license: CC0
biosim:
  entrypoint: src.zeilfelder2025_model_for_primary_human_hepatocyt:Zeilfelder2025ModelForPrimaryHumanHepatocytModel2503270002Model
  init_kwargs:
    model_path: data/MODEL2503270002.xml
    integration_step: 0.01
  communication_step: 0.1
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
io:
