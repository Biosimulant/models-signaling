  source_db: biomodels_ebi
  source_id: MODEL1503180004
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/MODEL1503180004
  download_url: https://www.ebi.ac.uk/biomodels/model/download/MODEL1503180004?filename=MODEL1503180004_url.xml
  license: CC0
biosim:
  entrypoint: src.smallbone2015_forced_pathway:Smallbone2015ForcedPathwayModel1503180004Model
  init_kwargs:
    model_path: data/MODEL1503180004.xml
    integration_step: 0.01
  communication_step: 0.1
runtime:
