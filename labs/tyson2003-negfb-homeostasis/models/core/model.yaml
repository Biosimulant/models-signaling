schema_version: '2.0'
title: Tyson2003_NegFB_Homeostasis
description: 'This is an SBML implementation the model of homeostastis by negative
  feedback (figure 1g) described in the article: Sniffers, buzzers, toggles and blinkers:
  dynamics of regulatory and signaling pathwa. It can be used to explore signaling
  dynamics and compare pathway response across conditions.'
