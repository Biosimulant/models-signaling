schema_version: '2.0'
package: schaber2012-hog-pathway-in-yeast
version: 1.0.0
title: Schaber2012 - Hog pathway in yeast Lab
description: Clean Biosimulant lab for MAPK/ERK receptor signaling. Values are native
  SBML quantities; equations, parameters, and initial values remain in the bundled
  source file.
models:
- alias: signaling_sbml_schaber2012_hog_pathway_in_yeast_biomd0000000429_model
  path: models/core
- alias: visualisation
  path: models/visualisation
wiring:
- from: signaling_sbml_schaber2012_hog_pathway_in_yeast_biomd0000000429_model.state
  to:
  - visualisation.signaling_sbml_schaber2012_hog_pathway_in_yeast_biomd0000000429_model_state
- from: signaling_sbml_schaber2012_hog_pathway_in_yeast_biomd0000000429_model.summary
  to:
  - visualisation.signaling_sbml_schaber2012_hog_pathway_in_yeast_biomd0000000429_model_summary
- from: signaling_sbml_schaber2012_hog_pathway_in_yeast_biomd0000000429_model.species_labels
  to:
  - visualisation.signaling_sbml_schaber2012_hog_pathway_in_yeast_biomd0000000429_model_species_labels
runtime:
  duration: 1.0
  communication_step: 0.1
  initial_inputs: {}
tags:
- signaling
- systems
- systems-biology
- sbml
- faithful
- biomodels_ebi
- mapk
io:
  inputs:
  - name: initial_hog1ppactive
    maps_to: signaling_sbml_schaber2012_hog_pathway_in_yeast_biomd0000000429_model.initial_hog1ppactive
    label: Initial Hog1ppactive
    description: Initial level of Hog1ppactive. Maps to SBML symbol `species_12`;
      exposed as a traceable initial-condition perturbation.
  outputs:
  - name: phosphatase
    maps_to: signaling_sbml_schaber2012_hog_pathway_in_yeast_biomd0000000429_model.phosphatase
    label: Phosphatase
    description: Phosphatase. Maps to SBML symbol `species_6` and is emitted in native
      SBML units.
  - name: hog1ppactive
    maps_to: signaling_sbml_schaber2012_hog_pathway_in_yeast_biomd0000000429_model.hog1ppactive
    label: Hog1ppactive
    description: Hog1ppactive. Maps to SBML symbol `species_12` and is emitted in
      native SBML units.
  - name: glyin
    maps_to: signaling_sbml_schaber2012_hog_pathway_in_yeast_biomd0000000429_model.glyin
    label: Glyin
    description: Glyin. Maps to SBML symbol `species_1` and is emitted in native SBML
      units.
  - name: state
    maps_to: signaling_sbml_schaber2012_hog_pathway_in_yeast_biomd0000000429_model.state
    label: Observable state
  - name: summary
    maps_to: signaling_sbml_schaber2012_hog_pathway_in_yeast_biomd0000000429_model.summary
    label: Simulation summary
  - name: species_labels
    maps_to: signaling_sbml_schaber2012_hog_pathway_in_yeast_biomd0000000429_model.species_labels
    label: Observable labels
