schema_version: '2.0'
package: kubota2012-insulinaction-aktpathway
version: 1.0.0
title: Kubota2012_InsulinAction_AKTpathway Lab
description: Clean Biosimulant lab for metabolic and hormone-linked signaling. Values
  are native SBML quantities; equations, parameters, and initial values remain in
  the bundled source file.
models:
- alias: signaling_sbml_kubota2012_insulinaction_aktpathway_model1204060000_model
  path: models/core
- alias: visualisation
  path: models/visualisation
wiring:
- from: signaling_sbml_kubota2012_insulinaction_aktpathway_model1204060000_model.state
  to:
  - visualisation.signaling_sbml_kubota2012_insulinaction_aktpathway_model1204060000_model_state
- from: signaling_sbml_kubota2012_insulinaction_aktpathway_model1204060000_model.summary
  to:
  - visualisation.signaling_sbml_kubota2012_insulinaction_aktpathway_model1204060000_model_summary
- from: signaling_sbml_kubota2012_insulinaction_aktpathway_model1204060000_model.species_labels
  to:
  - visualisation.signaling_sbml_kubota2012_insulinaction_aktpathway_model1204060000_model_species_labels
runtime:
  duration: 1.0
  communication_step: 0.1
  initial_inputs: {}
tags:
- signaling
- systems
- systems-biology
- sbml
- faithful
- biomodels_ebi
- pi3k-akt
- metabolic-signaling
- hormone-signaling
io:
  inputs:
  - name: initial_insulin
    maps_to: signaling_sbml_kubota2012_insulinaction_aktpathway_model1204060000_model.initial_insulin
    label: Initial Insulin
    description: Initial level of Insulin. Maps to SBML symbol `insulin`; exposed
      as a traceable initial-condition perturbation.
  outputs:
  - name: pro_insulin_receptor_complex
    maps_to: signaling_sbml_kubota2012_insulinaction_aktpathway_model1204060000_model.pro_insulin_receptor_complex
    label: Pro insulin receptor Complex
    description: Pro insulin receptor Complex. Maps to SBML symbol `proIR_complex`
      and is emitted in native SBML units.
  - name: insulin_receptor_complex
    maps_to: signaling_sbml_kubota2012_insulinaction_aktpathway_model1204060000_model.insulin_receptor_complex
    label: insulin receptor Complex
    description: insulin receptor Complex. Maps to SBML symbol `IR_complex` and is
      emitted in native SBML units.
  - name: p2ir_complex
    maps_to: signaling_sbml_kubota2012_insulinaction_aktpathway_model1204060000_model.p2ir_complex
    label: P2ir Complex
    description: P2ir Complex. Maps to SBML symbol `p2IR_complex` and is emitted in
      native SBML units.
  - name: state
    maps_to: signaling_sbml_kubota2012_insulinaction_aktpathway_model1204060000_model.state
    label: Observable state
  - name: summary
    maps_to: signaling_sbml_kubota2012_insulinaction_aktpathway_model1204060000_model.summary
    label: Simulation summary
  - name: species_labels
    maps_to: signaling_sbml_kubota2012_insulinaction_aktpathway_model1204060000_model.species_labels
    label: Observable labels
