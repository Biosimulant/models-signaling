io:
  inputs:
  - name: initial_insulin_level
    maps_to: signaling_sbml_br_nnmark2013_insulin_signalling_in_human_adipoc_biomd0000000448_model.initial_insulin_level
    label: Insulin
    description: Insulin source parameter. Maps to SBML symbol `insulin` and preserves
      the bundled default.
  - name: initial_scale_glucose_level
    maps_to: signaling_sbml_br_nnmark2013_insulin_signalling_in_human_adipoc_biomd0000000448_model.initial_scale_glucose_level
    label: Scale GLUCOSE
    description: Scale GLUCOSE source parameter. Maps to SBML symbol `scaleGLUCOSE`
      and preserves the bundled default.
  outputs:
  - name: phosphorylated_insulin_receptor
    maps_to: signaling_sbml_br_nnmark2013_insulin_signalling_in_human_adipoc_biomd0000000448_model.phosphorylated_insulin_receptor
    label: phosphorylated insulin receptor
    description: phosphorylated insulin receptor. Maps to SBML symbol `IRp` and is
      emitted in native SBML units.
  - name: insulin_bound_insulin_receptor
    maps_to: signaling_sbml_br_nnmark2013_insulin_signalling_in_human_adipoc_biomd0000000448_model.insulin_bound_insulin_receptor
    label: insulin-bound insulin receptor
    description: insulin-bound insulin receptor. Maps to SBML symbol `IRins` and is
      emitted in native SBML units.
  - name: internalized_phosphorylated_insulin_receptor
    maps_to: signaling_sbml_br_nnmark2013_insulin_signalling_in_human_adipoc_biomd0000000448_model.internalized_phosphorylated_insulin_receptor
    label: internalized phosphorylated insulin receptor
    description: internalized phosphorylated insulin receptor. Maps to SBML symbol
      `IRip` and is emitted in native SBML units.
  - name: state
    maps_to: signaling_sbml_br_nnmark2013_insulin_signalling_in_human_adipoc_biomd0000000448_model.state
    label: Observable state
  - name: summary
    maps_to: signaling_sbml_br_nnmark2013_insulin_signalling_in_human_adipoc_biomd0000000448_model.summary
    label: Simulation summary
  - name: species_labels
    maps_to: signaling_sbml_br_nnmark2013_insulin_signalling_in_human_adipoc_biomd0000000448_model.species_labels
    label: Observable labels
