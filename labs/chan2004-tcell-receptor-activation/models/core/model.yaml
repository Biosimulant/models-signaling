schema_version: '2.0'
title: Chan2004_TCell_receptor_activation
description: The model reproduces Fig 3a of the paper. Please note that the authors
  mention that they used a value of 2 for n, n being the power in the positive feedback
  function for kinase autocatalysis, however.
