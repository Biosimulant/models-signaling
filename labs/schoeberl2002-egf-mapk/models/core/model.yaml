schema_version: '2.0'
title: Schoeberl2002 - EGF MAPK
description: Schoeberl2002 - EGF MAPK Computational model that offers an integrated
  quantitative, dynamic, and topological representation of intracellular signal networks,
  based on known components of epidermal gr. It can be used to explore signaling dynamics
  and compare pathway response across conditions.
standard: other
tags:
- signaling
- systems
- systems-biology
- sbml
- faithful
- biomodels_ebi
- mapk
authors:
- Biosimulant Team
- Birgit Schoeberl
- Claudia Eichler-Jonsson
- Ernst Dieter Gilles
- Gertraud Müller
upstream:
  id: biomodels_ebi:BIOMD0000000019
  source_db: biomodels_ebi
  source_id: BIOMD0000000019
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/BIOMD0000000019
  download_url: https://www.ebi.ac.uk/biomodels/model/download/BIOMD0000000019?filename=BIOMD0000000019_url.xml
  license: CC0
biosim:
  entrypoint: src.schoeberl2002_egf_mapk:Schoeberl2002EgfMapkBiomd0000000019Model
  init_kwargs:
    model_path: data/BIOMD0000000019.xml
    integration_step: 0.01
  communication_step: 0.1
