    label: Initial source-defined X0 state
    description: Initial level of source-defined X0 state. Maps to SBML symbol `X0`;
      exposed as a traceable initial-condition perturbation.
  - name: initial_source_defined_x4_state
    maps_to: signaling_sbml_smallbone2015_forced_pathway_model1503180004_model.initial_source_defined_x4_state
    label: Initial source-defined X4 state
    description: Initial level of source-defined X4 state. Maps to SBML symbol `X4`;
      exposed as a traceable initial-condition perturbation.
  outputs:
  - name: source_defined_x0_state
    maps_to: signaling_sbml_smallbone2015_forced_pathway_model1503180004_model.source_defined_x0_state
    label: Source Defined X0 State
    description: Source Defined X0 State. Maps to SBML symbol `X0` and is emitted
      in native SBML units.
  - name: source_defined_x1_state
    maps_to: signaling_sbml_smallbone2015_forced_pathway_model1503180004_model.source_defined_x1_state
    label: Source Defined X1 State
    description: Source Defined X1 State. Maps to SBML symbol `X1` and is emitted
      in native SBML units.
  - name: source_defined_x2_state
    maps_to: signaling_sbml_smallbone2015_forced_pathway_model1503180004_model.source_defined_x2_state
    label: Source Defined X2 State
    description: Source Defined X2 State. Maps to SBML symbol `X2` and is emitted
      in native SBML units.
  - name: state
