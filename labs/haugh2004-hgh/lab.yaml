    description: Initial level of source-defined C state. Maps to SBML symbol `C`;
      exposed as a traceable initial-condition perturbation.
  outputs:
  - name: source_defined_c_state
    maps_to: signaling_sbml_haugh2004_hgh_model0848676877_model.source_defined_c_state
    label: source-defined C state
    description: source-defined C state. Maps to SBML symbol `C` and is emitted in
      native SBML units.
  - name: source_defined_d_state
    maps_to: signaling_sbml_haugh2004_hgh_model0848676877_model.source_defined_d_state
    label: source-defined D state
    description: source-defined D state. Maps to SBML symbol `D` and is emitted in
      native SBML units.
  - name: source_defined_r_state
    maps_to: signaling_sbml_haugh2004_hgh_model0848676877_model.source_defined_r_state
    label: source-defined R state
    description: source-defined R state. Maps to SBML symbol `R` and is emitted in
      native SBML units.
  - name: state
    maps_to: signaling_sbml_haugh2004_hgh_model0848676877_model.state
    label: Observable state
  - name: summary
    maps_to: signaling_sbml_haugh2004_hgh_model0848676877_model.summary
