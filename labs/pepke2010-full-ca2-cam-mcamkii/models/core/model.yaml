schema_version: '2.0'
title: Pepke2010_Full_Ca2/CaM_mCaMKII
description: 'This the full model from the article: A dynamic model of interactions
  of Ca2+, calmodulin, and catalytic subunits of Ca2+/calmodulin-dependent protein
  kinase II. It can be used to explore signaling dynamics and compare pathway response
  across conditions.'
standard: other
tags:
- signaling
- systems
- systems-biology
- sbml
- faithful
- biomodels_ebi
- calcium-signaling
- neuroscience
authors:
- Biosimulant Team
- Shirley Pepke
- Tamara Kinzer-Ursem
- Stefan Mihalas
- Mary B Kennedy
upstream:
  id: biomodels_ebi:MODEL1001150000
  source_db: biomodels_ebi
  source_id: MODEL1001150000
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/MODEL1001150000
  download_url: https://www.ebi.ac.uk/biomodels/model/download/MODEL1001150000?filename=MODEL1001150000_url.xml
  license: CC0
biosim:
  entrypoint: src.pepke2010_full_ca2_cam_mcamkii:Pepke2010FullCa2CamMcamkiiModel1001150000Model
  init_kwargs:
    model_path: data/MODEL1001150000.xml
    integration_step: 0.01
  communication_step: 0.1
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
io:
  inputs:
  - name: initial_kca_m2c_tot
    maps_to: signaling_sbml_pepke2010_full_ca2_cam_mcamkii_model1001150000_model.initial_kca_m2c_tot
    label: Initial Kca M2C Tot
    description: Initial level of Kca M2C Tot. Maps to SBML symbol `KCaM2C_tot`; exposed
      as a traceable initial-condition perturbation.
  outputs:
  - name: calcium_m_0_1
    maps_to: signaling_sbml_pepke2010_full_ca2_cam_mcamkii_model1001150000_model.calcium_m_0_1
    label: calcium M 0 1
    description: calcium M 0 1. Maps to SBML symbol `CaM_0_1` and is emitted in native
      SBML units.
  - name: calcium_m_0_2
    maps_to: signaling_sbml_pepke2010_full_ca2_cam_mcamkii_model1001150000_model.calcium_m_0_2
    label: calcium M 0 2
    description: calcium M 0 2. Maps to SBML symbol `CaM_0_2` and is emitted in native
      SBML units.
  - name: calcium_m_1_0
    maps_to: signaling_sbml_pepke2010_full_ca2_cam_mcamkii_model1001150000_model.calcium_m_1_0
    label: calcium M 1 0
    description: calcium M 1 0. Maps to SBML symbol `CaM_1_0` and is emitted in native
      SBML units.
  - name: state
    maps_to: signaling_sbml_pepke2010_full_ca2_cam_mcamkii_model1001150000_model.state
    label: Observable state
  - name: summary
    maps_to: signaling_sbml_pepke2010_full_ca2_cam_mcamkii_model1001150000_model.summary
    label: Simulation summary
  - name: species_labels
    maps_to: signaling_sbml_pepke2010_full_ca2_cam_mcamkii_model1001150000_model.species_labels
    label: Observable labels
