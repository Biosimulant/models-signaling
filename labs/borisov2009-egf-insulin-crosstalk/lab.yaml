schema_version: '2.0'
package: borisov2009-egf-insulin-crosstalk
version: 1.0.0
title: Borisov2009_EGF_Insulin_Crosstalk Lab
description: Clean Biosimulant lab for metabolic and hormone-linked signaling. Values
  are native SBML quantities; equations, parameters, and initial values remain in
  the bundled source file.
models:
- alias: signaling_sbml_borisov2009_egf_insulin_crosstalk_biomd0000000223_model
  path: models/core
- alias: visualisation
  path: models/visualisation
wiring:
- from: signaling_sbml_borisov2009_egf_insulin_crosstalk_biomd0000000223_model.state
  to:
  - visualisation.signaling_sbml_borisov2009_egf_insulin_crosstalk_biomd0000000223_model_state
- from: signaling_sbml_borisov2009_egf_insulin_crosstalk_biomd0000000223_model.summary
  to:
  - visualisation.signaling_sbml_borisov2009_egf_insulin_crosstalk_biomd0000000223_model_summary
- from: signaling_sbml_borisov2009_egf_insulin_crosstalk_biomd0000000223_model.species_labels
  to:
  - visualisation.signaling_sbml_borisov2009_egf_insulin_crosstalk_biomd0000000223_model_species_labels
runtime:
  duration: 1.0
  communication_step: 0.1
  initial_inputs: {}
tags:
- signaling
- systems
- systems-biology
- sbml
- faithful
- biomodels_ebi
- metabolic-signaling
- hormone-signaling
io:
  inputs:
  - name: initial_egf
    maps_to: signaling_sbml_borisov2009_egf_insulin_crosstalk_biomd0000000223_model.initial_egf
    label: Initial EGF
    description: Initial level of EGF. Maps to SBML symbol `EGF`; exposed as a traceable
      initial-condition perturbation.
  outputs:
  - name: ras_gap
    maps_to: signaling_sbml_borisov2009_egf_insulin_crosstalk_biomd0000000223_model.ras_gap
    label: RAS GAP
    description: RAS GAP. Maps to SBML symbol `RasGAP` and is emitted in native SBML
      units.
  - name: rp_ras_gap
    maps_to: signaling_sbml_borisov2009_egf_insulin_crosstalk_biomd0000000223_model.rp_ras_gap
    label: Rp RAS GAP
    description: Rp RAS GAP. Maps to SBML symbol `Rp_RasGAP` and is emitted in native
      SBML units.
  - name: phosphorylated_insulin_receptor_ras_gap
    maps_to: signaling_sbml_borisov2009_egf_insulin_crosstalk_biomd0000000223_model.phosphorylated_insulin_receptor_ras_gap
    label: Phosphorylated Insulin Receptor RAS GAP
    description: Phosphorylated Insulin Receptor RAS GAP. Maps to SBML symbol `IRp_RasGAP`
      and is emitted in native SBML units.
  - name: state
    maps_to: signaling_sbml_borisov2009_egf_insulin_crosstalk_biomd0000000223_model.state
    label: Observable state
  - name: summary
    maps_to: signaling_sbml_borisov2009_egf_insulin_crosstalk_biomd0000000223_model.summary
    label: Simulation summary
  - name: species_labels
    maps_to: signaling_sbml_borisov2009_egf_insulin_crosstalk_biomd0000000223_model.species_labels
    label: Observable labels
