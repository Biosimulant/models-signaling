schema_version: '2.0'
title: Brännmark2013 - Insulin signalling in human adipocytes (normal condition)
description: Brännmark2013 - Insulin signalling in human adipocytes (normal condition)
  The paper describes insulin signalling in human adipocytes under normal and diabetic
  states using mathematical models based on. It can be used to explore signaling dynamics
  and compare pathway response across conditions.
