schema_version: '2.0'
title: Bhalla2002_cAMP_pathway
description: This is a model of the canonical cAMP signaling pathway:&lt;br'&gt;Ligand-&gt;Receptor-&gt;G-protein-&gt;Cyclase-&gt;cAMP-&gt;PKA.&lt;br&gt;It
  also includes phosphodiesterases to balance out cAMP form. It can be used to explore
  signaling dynamics and compare pathway response across conditions.
standard: other
tags:
- signaling
- systems
- systems-biology
- sbml
- faithful
- biomodels_ebi
- camp-pka
- gpcr
authors:
- Biosimulant Team
- Bhalla US
upstream:
  id: biomodels_ebi:MODEL9077438479
  source_db: biomodels_ebi
  source_id: MODEL9077438479
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/MODEL9077438479
  download_url: https://www.ebi.ac.uk/biomodels/model/download/MODEL9077438479?filename=MODEL9077438479_url.xml
  license: CC0
biosim:
  entrypoint: src.bhalla2002_camp_pathway:Bhalla2002CampPathwayModel9077438479Model
  init_kwargs:
    model_path: data/MODEL9077438479.xml
    integration_step: 0.01
  communication_step: 0.1
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
io:
  inputs:
  - name: initial_ac_amp
    maps_to: signaling_sbml_bhalla2002_camp_pathway_model9077438479_model.initial_ac_amp
    label: Initial AC AMP
    description: Initial level of AC AMP. Maps to SBML symbol `AC_slash_AMP`; exposed
      as a traceable initial-condition perturbation.
  - name: initial_ac_atp
    maps_to: signaling_sbml_bhalla2002_camp_pathway_model9077438479_model.initial_ac_atp
    label: Initial AC ATP
    description: Initial level of AC ATP. Maps to SBML symbol `AC_slash_ATP`; exposed
      as a traceable initial-condition perturbation.
  - name: initial_gs_ligand
    maps_to: signaling_sbml_bhalla2002_camp_pathway_model9077438479_model.initial_gs_ligand
    label: Initial Gs ligand
    description: Initial level of Gs ligand. Maps to SBML symbol `Gs_slash_L`; exposed
      as a traceable initial-condition perturbation.
  outputs:
  - name: pka_c_amp_dot_r2c2
    maps_to: signaling_sbml_bhalla2002_camp_pathway_model9077438479_model.pka_c_amp_dot_r2c2
    label: PKA C AMP Dot R2C2
    description: PKA C AMP Dot R2C2. Maps to SBML symbol `PKA_slash_cAMP_dot_R2C2`
      and is emitted in native SBML units.
  - name: pka_camp2_dot_r2c2
    maps_to: signaling_sbml_bhalla2002_camp_pathway_model9077438479_model.pka_camp2_dot_r2c2
    label: PKA CAMP2 Dot R2C2
    description: PKA CAMP2 Dot R2C2. Maps to SBML symbol `PKA_slash_cAMP2_dot_R2C2`
      and is emitted in native SBML units.
  - name: pka_camp3_dot_r2c2
    maps_to: signaling_sbml_bhalla2002_camp_pathway_model9077438479_model.pka_camp3_dot_r2c2
    label: PKA CAMP3 Dot R2C2
    description: PKA CAMP3 Dot R2C2. Maps to SBML symbol `PKA_slash_cAMP3_dot_R2C2`
      and is emitted in native SBML units.
  - name: state
    maps_to: signaling_sbml_bhalla2002_camp_pathway_model9077438479_model.state
    label: Observable state
  - name: summary
    maps_to: signaling_sbml_bhalla2002_camp_pathway_model9077438479_model.summary
    label: Simulation summary
  - name: species_labels
    maps_to: signaling_sbml_bhalla2002_camp_pathway_model9077438479_model.species_labels
    label: Observable labels
