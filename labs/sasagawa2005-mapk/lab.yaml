schema_version: '2.0'
package: sasagawa2005-mapk
version: 1.0.0
title: Sasagawa2005_MAPK Lab
description: Clean Biosimulant lab for MAPK/ERK receptor signaling. Values are native
  SBML quantities; equations, parameters, and initial values remain in the bundled
  source file.
models:
- alias: signaling_sbml_sasagawa2005_mapk_biomd0000000049_model
  path: models/core
- alias: visualisation
  path: models/visualisation
wiring:
- from: signaling_sbml_sasagawa2005_mapk_biomd0000000049_model.state
  to:
  - visualisation.signaling_sbml_sasagawa2005_mapk_biomd0000000049_model_state
- from: signaling_sbml_sasagawa2005_mapk_biomd0000000049_model.summary
  to:
  - visualisation.signaling_sbml_sasagawa2005_mapk_biomd0000000049_model_summary
- from: signaling_sbml_sasagawa2005_mapk_biomd0000000049_model.species_labels
  to:
  - visualisation.signaling_sbml_sasagawa2005_mapk_biomd0000000049_model_species_labels
runtime:
  duration: 1.0
  communication_step: 0.1
  initial_inputs: {}
tags:
- signaling
- systems
- systems-biology
- sbml
- faithful
- biomodels_ebi
- mapk
- ras-erk
io:
  inputs:
  - name: initial_degradation
    maps_to: signaling_sbml_sasagawa2005_mapk_biomd0000000049_model.initial_degradation
    label: Initial Degradation
    description: Initial level of Degradation. Maps to SBML symbol `degradation`;
      exposed as a traceable initial-condition perturbation.
  - name: initial_egf
    maps_to: signaling_sbml_sasagawa2005_mapk_biomd0000000049_model.initial_egf
    label: Initial EGF
    description: Initial level of EGF. Maps to SBML symbol `EGF`; exposed as a traceable
      initial-condition perturbation.
  - name: initial_nerve_growth_factor
    maps_to: signaling_sbml_sasagawa2005_mapk_biomd0000000049_model.initial_nerve_growth_factor
    label: Initial nerve growth factor
    description: Initial level of nerve growth factor. Maps to SBML symbol `NGF`;
      exposed as a traceable initial-condition perturbation.
  outputs:
  - name: ras_gap
    maps_to: signaling_sbml_sasagawa2005_mapk_biomd0000000049_model.ras_gap
    label: RAS GAP
    description: RAS GAP. Maps to SBML symbol `RasGAP` and is emitted in native SBML
      units.
  - name: erk
    maps_to: signaling_sbml_sasagawa2005_mapk_biomd0000000049_model.erk
    label: ERK
    description: ERK. Maps to SBML symbol `ERK` and is emitted in native SBML units.
  - name: ras_gdp
    maps_to: signaling_sbml_sasagawa2005_mapk_biomd0000000049_model.ras_gdp
    label: RAS GDP
    description: RAS GDP. Maps to SBML symbol `Ras_GDP` and is emitted in native SBML
      units.
  - name: state
    maps_to: signaling_sbml_sasagawa2005_mapk_biomd0000000049_model.state
    label: Observable state
  - name: summary
    maps_to: signaling_sbml_sasagawa2005_mapk_biomd0000000049_model.summary
    label: Simulation summary
  - name: species_labels
    maps_to: signaling_sbml_sasagawa2005_mapk_biomd0000000049_model.species_labels
    label: Observable labels
