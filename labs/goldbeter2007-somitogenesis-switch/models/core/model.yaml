schema_version: '2.0'
title: Goldbeter2007_Somitogenesis_Switch
description: This is the simple model without diffusion described in th epublication
  Sharp developmental thresholds defined through bistability by antagonistic gradients
  of retinoic acid and FGF signaling. It can be used to explore signaling dynamics
  and compare pathway response across conditions.
standard: other
tags:
- signaling
- systems
- systems-biology
- sbml
- faithful
- biomodels_ebi
- cellular-signaling
authors:
- Biosimulant Team
- Albert Goldbeter
- Didier Gonze
- Olivier Pourquié
upstream:
  id: biomodels_ebi:BIOMD0000000275
  source_db: biomodels_ebi
  source_id: BIOMD0000000275
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/BIOMD0000000275
  download_url: https://www.ebi.ac.uk/biomodels/model/download/BIOMD0000000275?filename=BIOMD0000000275_url.xml
  license: CC0
biosim:
  entrypoint: src.goldbeter2007_somitogenesis_switch:Goldbeter2007SomitogenesisSwitchBiomd0000000275Model
  init_kwargs:
    model_path: data/BIOMD0000000275.xml
    integration_step: 0.01
  communication_step: 0.1
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
io:
  inputs:
  - name: initial_source_defined_ra_state
    maps_to: signaling_sbml_goldbeter2007_somitogenesis_switch_biomd0000000275_model.initial_source_defined_ra_state
    label: Initial source-defined RA state
    description: Initial level of source-defined RA state. Maps to SBML symbol `RA`;
      exposed as a traceable initial-condition perturbation.
  outputs:
  - name: cyp26_m_rna
    maps_to: signaling_sbml_goldbeter2007_somitogenesis_switch_biomd0000000275_model.cyp26_m_rna
    label: Cyp26 M RNA
    description: Cyp26 M RNA. Maps to SBML symbol `M_C` and is emitted in native SBML
      units.
  - name: cyp26
    maps_to: signaling_sbml_goldbeter2007_somitogenesis_switch_biomd0000000275_model.cyp26
    label: CYP26
    description: CYP26. Maps to SBML symbol `C` and is emitted in native SBML units.
  - name: source_defined_fgf_state
    maps_to: signaling_sbml_goldbeter2007_somitogenesis_switch_biomd0000000275_model.source_defined_fgf_state
    label: source-defined FGF state
    description: source-defined FGF state. Maps to SBML symbol `F` and is emitted
      in native SBML units.
  - name: state
    maps_to: signaling_sbml_goldbeter2007_somitogenesis_switch_biomd0000000275_model.state
    label: Observable state
  - name: summary
    maps_to: signaling_sbml_goldbeter2007_somitogenesis_switch_biomd0000000275_model.summary
    label: Simulation summary
  - name: species_labels
    maps_to: signaling_sbml_goldbeter2007_somitogenesis_switch_biomd0000000275_model.species_labels
    label: Observable labels
